[tool.pytest.ini_options]
testpaths = ["tests/unit"]
python_files = ["test_*.py", "*_test.py"]

# ---------------------------------------------------------------------------
# Ruff — replaces flake8 + black + isort
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 160
target-version = "py311"
exclude = [
    ".tox",
    "aap-dev",
    "services",
    "aap_gateway_api/migrations",
    "django-ansible-base",
]

[tool.ruff.lint]
# E/W: pycodestyle  F: pyflakes  I: isort
select = ["E", "W", "F", "I"]
# E203: whitespace before ':' — black-compatible, kept to match old flake8 config
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
# E402: Ansible boilerplate requires __metaclass__ = type before imports
"plugins/modules/*" = ["E402"]
"plugins/connection/*" = ["E402"]
# F821: AnsibleXxx classes are imported inside from_api() function bodies
# (local imports) and used as string annotations — ruff can't see them at
# module scope. Proper fix is TYPE_CHECKING guards; suppressed for now.
"plugins/plugin_utils/api/v1/*" = ["F821"]
"plugins/plugin_utils/api/v2/*" = ["F821"]

[tool.ruff.format]
skip-magic-trailing-comma = false

# ---------------------------------------------------------------------------
# Mypy — static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = false
no_implicit_optional = true
strict_optional = false
# Exclude Ansible boilerplate dirs — relative imports like `from ..module_utils`
# use Ansible's custom namespace resolution which mypy cannot follow, causing
# spurious "Relative import climbs too many namespaces" [misc] errors.
exclude = [
    "plugins/modules/",
    "plugins/module_utils/",
    "plugins/lookup/",
]

[[tool.mypy.overrides]]
module = "ansible.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ansible_collections.*"
ignore_missing_imports = true

# plugin_utils has two structural type issues that require dedicated refactoring:
#   1. Model classes passed as bare `type` instead of a typed Protocol/TypeVar —
#      causes ~30 "type has no attribute from_ansible_data" [attr-defined] errors.
#   2. Forward references in api/* model files — causes [name-defined] errors.
# Suppress until that work lands; action plugins remain fully checked.
[[tool.mypy.overrides]]
module = [
    "plugins.plugin_utils.*",
    "plugins.connection.*",
]
ignore_errors = true

# ---------------------------------------------------------------------------
# Pydoclint — docstring style enforcement (Google style)
# ---------------------------------------------------------------------------
[tool.pydoclint]
style = "google"
exclude = '\.(tox|git)|aap-dev|services|migrations'
skip-checking-short-docstrings = true
allow-init-docstring = true
