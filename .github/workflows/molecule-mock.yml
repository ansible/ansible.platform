---
# Run Molecule integration tests against the mock Gateway (no real AAP).
# Covers ansible.platform.user and ansible.platform.organization.
name: molecule (mock)

on:
  pull_request:
  push:
    branches: [devel]

env:
  MOLECULE_CONFIG: extensions/molecule/config.yml
  ANSIBLE_FORCE_COLOR: "1"
  PY_COLORS: "1"

jobs:
  molecule-mock:
    name: Molecule user + organization (mock)
    runs-on: ubuntu-latest
    env:
      # Use installed collection (galaxy install puts it here); else Molecule's ../../.. points at repo root and collection is not found
      ANSIBLE_COLLECTIONS_PATH: $HOME/.ansible/collections
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible-core and molecule
        run: pip install ansible-core molecule

      - name: Install collection
        run: ansible-galaxy collection install . --force

      - name: Start mock Gateway (default scenario create)
        run: molecule create -s default

      - name: Run user integration tests (mock)
        run: molecule test -s users_mock --all

      - name: Restart mock Gateway for organization tests
        working-directory: ${{ github.workspace }}
        run: ansible-playbook -i extensions/molecule/default/inventory.yml extensions/molecule/default/create.yml

      - name: Verify mock is up before organization tests
        working-directory: ${{ github.workspace }}
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health

      - name: Run organization integration tests (mock)
        run: molecule test -s organization_mock --all

      - name: Stop mock Gateway (default scenario destroy)
        if: always()
        run: molecule destroy -s default
...
