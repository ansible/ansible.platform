name: integration tests

on:
  pull_request_target:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

env:
  PY_COLORS: '1'
  ANSIBLE_FORCE_COLOR: '1'

jobs:
  integration:
    name: collection integration test
    runs-on: ubuntu-latest
    env:
      HEADLESS: "yes"

    steps:
      - uses: actions/checkout@v3
        with:
          path: ansible-platform
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout aap-gateway (and optionally DAB)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ secrets.AAP_GATEWAY_REPO_TOKEN }}
          GH_WORKSPACE: ${{ github.workspace }}
        run: tools/scripts/get_aap_gateway_and_dab.py
        working-directory: ansible-platform

      # 🧩 Build & install collection (from ansible.platform)
      - name: Build & install ansible.platform collection for gateway
        run: make setup-for-gateway
        working-directory: ansible-platform

      # 🧩 Shim missing target 'collection-install' inside aap-gateway
      - name: Shim missing collection-install in aap-gateway
        run: |
          cat > compat.mk <<'EOF'
          .PHONY: collection-install
          collection-install:
          	@echo "shim: collection-install satisfied"
          EOF
          echo "MAKEFLAGS=-f compat.mk -f Makefile" >> $GITHUB_ENV
        working-directory: aap-gateway

      - name: Build gateway image
        run: make docker-compose-build
        working-directory: aap-gateway

      - name: Spin up the dev env
        run: |
          ansible-playbook -v tools/ansible/smoke-test-no-services.yml \
            -e repo_root=$(pwd) \
            -e gateway_vars=$(readlink -f container-startup.yml)
        working-directory: aap-gateway

      - name: Cleanup services
        run: make cleanup-services
        working-directory: aap-gateway

      - name: Extract gateway password
        run: |
          ADMIN_PW=$(awk '/gateway_admin_password/{print $2}' container-startup.yml | xargs echo)
          echo "GATEWAY_PASSWORD=$ADMIN_PW" >> $GITHUB_ENV
        working-directory: aap-gateway

      - name: Run ansible.platform integration tests
        run: make collection-test
        working-directory: ansible-platform

      - name: Dump container logs on failure
        run: docker compose -f tools/generated/docker-compose.yml logs
        working-directory: aap-gateway
        if: failure()

  coverage_test:
    name: collection integration check
    runs-on: ubuntu-latest
    env:
      HEADLESS: "yes"

    steps:
      - uses: actions/checkout@v3
        with:
          path: ansible-platform
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout aap-gateway
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ secrets.AAP_GATEWAY_REPO_TOKEN }}
          GH_WORKSPACE: ${{ github.workspace }}
        run: tools/scripts/get_aap_gateway_and_dab.py
        working-directory: ansible-platform

      - name: Build & install collection
        run: make setup-for-gateway
        working-directory: ansible-platform

      - name: Shim missing collection-install in aap-gateway
        run: |
          cat > compat.mk <<'EOF'
          .PHONY: collection-install
          collection-install:
          	@echo "shim: collection-install satisfied"
          EOF
          echo "MAKEFLAGS=-f compat.mk -f Makefile" >> $GITHUB_ENV
        working-directory: aap-gateway

      - name: Start the dev environment
        run: COMPOSE_UP_OPTS='-d' make docker-compose
        working-directory: aap-gateway

      - name: Install Python and dependencies
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - run: pip install -r requirements/requirements_dev.txt ansible-core
        working-directory: ansible-platform

      - name: Run completeness checks
        run: make collection-test-integration-check
        working-directory: ansible-platform

  completeness_test:
    name: collection completeness test
    runs-on: ubuntu-latest
    env:
      HEADLESS: "yes"

    steps:
      - uses: actions/checkout@v3
        with:
          path: ansible-platform
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout aap-gateway
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ secrets.AAP_GATEWAY_REPO_TOKEN }}
          GH_WORKSPACE: ${{ github.workspace }}
        run: tools/scripts/get_aap_gateway_and_dab.py
        working-directory: ansible-platform

      - name: Build & install collection
        run: make setup-for-gateway
        working-directory: ansible-platform

      - name: Shim missing collection-install in aap-gateway
        run: |
          cat > compat.mk <<'EOF'
          .PHONY: collection-install
          collection-install:
          	@echo "shim: collection-install satisfied"
          EOF
          echo "MAKEFLAGS=-f compat.mk -f Makefile" >> $GITHUB_ENV
        working-directory: aap-gateway

      - name: Start the dev environment
        run: COMPOSE_UP_OPTS='-d' make docker-compose
        working-directory: aap-gateway

      - name: Install Python and dependencies
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - run: pip install -r requirements/requirements_dev.txt ansible-core
        working-directory: ansible-platform

      - name: Extract gateway password
        run: |
          ADMIN_PW=$(awk '/gateway_admin_password/{print $2}' container-startup.yml | xargs echo)
          echo "GATEWAY_PASSWORD=$ADMIN_PW" >> $GITHUB_ENV
        working-directory: aap-gateway

      - name: Copy container-startup.yml to ansible-platform
        run: cp container-startup.yml $GITHUB_WORKSPACE
        working-directory: aap-gateway

      - name: Run collection completeness tests
        run: make collection-test-completeness
        working-directory: ansible-platform
