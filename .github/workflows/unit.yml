---
name: unit tests

on:
  pull_request:
  push:
    branches: [devel, ANSTRAT-1640]

env:
  LC_ALL: "C.UTF-8"

jobs:
  unit:
    name: Unit (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install ansible-core pytest
          python -m pip install -r test-requirements.txt

      - name: Run tox unit tests
        run: python -m tox --ansible -f unit --conf tox-ansible.ini
...
