---
name: Collection Unit Tests

on:
  push:
    branches: [main]
  pull_request:
  push:
    branches: [devel, ANSTRAT-1640]

env:
  LC_ALL: "C.UTF-8"

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install tox-ansible
        run: python -m pip install tox-ansible

      - name: Run Unit Tests
        run: python -m tox --ansible -f unit
...