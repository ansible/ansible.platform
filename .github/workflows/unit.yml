---
# Run unit tests via tox-ansible (ANSTRAT-1640 P1R14: pytest/tox-ansible for unit tests).
# Single job runs tox -f unit (all unit envs). No matrix — matrix generation was empty and caused a skipped job.
name: unit tests

on:
  pull_request:
  push:
    branches: [devel]

env:
  LC_ALL: "C.UTF-8"

jobs:
  unit:
    name: Unit (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for tox-ansible.ini file, else add default
        uses: ansible/ansible-content-actions/.github/actions/add_tox_ansible@main

      - name: Install tox-ansible, includes tox
        run: python -m pip install tox-ansible 'tox!=4.47.1,!=4.47.2'

      - name: Run tox unit tests
        run: python -m tox --ansible -f unit --conf tox-ansible.ini
...
