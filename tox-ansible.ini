# tox-ansible config for ansible.platform (ANSTRAT-1640 P1R14: pytest/tox-ansible for unit tests).
# See: https://docs.ansible.com/projects/tox-ansible/
# Run unit tests: tox -f unit --ansible -p auto --conf tox-ansible.ini
# List envs:       tox list --ansible --conf tox-ansible.ini

[ansible]
# Optional: skip specific Python or ansible-core versions if needed.
# skip =
#     2.9
#     devel

[tox]
ignore_base_python_conflict = true

# Unit: pytest over tests/unit (connection plugin, registry, etc.). Uses local collection via ANSIBLE_COLLECTIONS_PATH.
[testenv:unit-*]
commands = bash -c 'cd {toxinidir} && ANSIBLE_COLLECTIONS_PATH={toxinidir}/../../.. python3 -m pytest --rootdir={toxinidir} --ansible-unit-inject-only ./tests/unit -v'

# Integration: run pytest from the repo ({toxinidir}) so we test your LOCAL code (including
# uncommitted changes). ANSIBLE_COLLECTIONS_PATH={toxinidir}/../../.. is the parent of
# ansible_collections so Ansible loads ansible.platform from the repo. Repo has galaxy.yml +
# extensions/molecule so scenario discovery works.
[testenv:integration-py3.10-2.17]
commands = bash -c 'cd {toxinidir} && ANSIBLE_COLLECTIONS_PATH={toxinidir}/../../.. python3 -m pytest --rootdir={toxinidir} --ansible-unit-inject-only ./tests/integration'
[testenv:integration-py3.10-2.18]
commands = bash -c 'cd {toxinidir} && ANSIBLE_COLLECTIONS_PATH={toxinidir}/../../.. python3 -m pytest --rootdir={toxinidir} --ansible-unit-inject-only ./tests/integration'
[testenv:integration-py3.11-2.17]
commands = bash -c 'cd {toxinidir} && ANSIBLE_COLLECTIONS_PATH={toxinidir}/../../.. python3 -m pytest --rootdir={toxinidir} --ansible-unit-inject-only ./tests/integration'
[testenv:integration-py3.11-2.18]
commands = bash -c 'cd {toxinidir} && ANSIBLE_COLLECTIONS_PATH={toxinidir}/../../.. python3 -m pytest --rootdir={toxinidir} --ansible-unit-inject-only ./tests/integration'
[testenv:integration-py3.12-2.17]
commands = bash -c 'cd {toxinidir} && ANSIBLE_COLLECTIONS_PATH={toxinidir}/../../.. python3 -m pytest --rootdir={toxinidir} --ansible-unit-inject-only ./tests/integration'
[testenv:integration-py3.12-2.18]
commands = bash -c 'cd {toxinidir} && ANSIBLE_COLLECTIONS_PATH={toxinidir}/../../.. python3 -m pytest --rootdir={toxinidir} --ansible-unit-inject-only ./tests/integration'
