# Molecule scenario: user resource (ANSTRAT-1640 integration tests).
# Tests create, update, in-play idempotency, verify, cleanup against AAP Gateway.
# Idempotence phase (converge run again) removed: platform user module reports changed on second run
# for create/update; idempotency is still asserted inside converge via "Run again" task.
---
driver:
  name: default

platforms:
  - name: localhost

ansible:
  executor:
    args:
      ansible_playbook:
        - --inventory=${MOLECULE_SCENARIO_DIRECTORY}/../inventory.yml

provisioner:
  name: ansible
  playbooks:
    converge: converge.yml
    verify: verify.yml
    cleanup: cleanup.yml
  config_options:
    defaults:
      collections_path: "${ANSIBLE_COLLECTIONS_PATH:-../../..}"

scenario:
  test_sequence:
    - converge
    - verify
    - cleanup
