---
# Molecule verify: assert Gateway is reachable and test user exists (after converge).
- name: Verify – user in expected state
  hosts: localhost
  gather_facts: false
  vars:
    molecule_user: "molecule-user-integration-test"
    gateway_hostname: "https://34.238.38.25/"
    gateway_username: "admin"
    gateway_password: "Admin!Password!Gw"
    gateway_validate_certs: false
  tasks:
    - name: Gather user (verify Gateway reachable and user present)
      ansible.platform.user:
        username: "{{ molecule_user }}"
        state: gathered
      register: gathered
      failed_when: false

    - name: Assert user was found (converge created it)
      ansible.builtin.assert:
        that:
          - gathered is not failed
          - gathered.get('before') is defined or gathered.get('users') is defined
        fail_msg: "Verify: could not gather user {{ molecule_user }} (Gateway unreachable or user missing)."
...
