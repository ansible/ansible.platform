---
# Molecule converge: user create, update, idempotency, delete (ANSTRAT-1640).
# Gateway vars: static defaults (no lookup) so connection plugin never sees unevaluated Jinja.
# Override via CLI: -e gateway_hostname=... -e gateway_password=... (molecule does not pass env to playbook).
- name: Converge – user integration tests
  hosts: localhost
  gather_facts: false
  vars:
    molecule_user: "molecule-user-integration-test"
    # Fixed password so idempotence run (converge again) sees no change.
    molecule_password: "MoleculeTestPassword1!"
    gateway_hostname: "https://34.238.38.25/"
    gateway_username: "admin"
    gateway_password: "Admin!Password!Gw"
    gateway_validate_certs: false
  tasks:
    - name: Create user (create)
      ansible.platform.user:
        username: "{{ molecule_user }}"
        first_name: MoleculeTest
        password: "{{ molecule_password }}"
      register: create_result

    - name: Show create result
      ansible.builtin.debug:
        var: create_result
        verbosity: 0

    - name: Assert create changed
      ansible.builtin.assert:
        that: create_result is changed

    - name: Run again (idempotency – no change)
      ansible.platform.user:
        username: "{{ molecule_user }}"
        first_name: MoleculeTest
        password: "{{ molecule_password }}"
        update_secrets: false
        state: present
      register: idem_result

    - name: Show idempotency result
      ansible.builtin.debug:
        var: idem_result
        verbosity: 0

    - name: Assert idempotent run did not change
      ansible.builtin.assert:
        that: idem_result is not changed

    - name: Update user (update)
      ansible.platform.user:
        username: "{{ molecule_user }}"
        first_name: MoleculeUpdated
        is_superuser: true
      register: update_result

    - name: Show update result
      ansible.builtin.debug:
        var: update_result
        verbosity: 0

    - name: Assert update changed
      ansible.builtin.assert:
        that: update_result is changed

    # Delete is done in cleanup.yml so idempotence phase (converge run again) sees no changes.
...
