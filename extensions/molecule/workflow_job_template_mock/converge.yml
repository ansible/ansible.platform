---
- name: Ensure mock Gateway is reachable
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
  tasks:
    - name: Wait for mock Gateway health endpoint
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}/health"
        method: GET
        status_code: 200
      register: health
      retries: 12
      delay: 5
      until: health.status == 200
      vars:
        ansible_connection: local

    - name: Ensure /tmp/ap directory exists
      ansible.builtin.file:
        path: /tmp/ap
        state: directory
        mode: "0755"
      vars:
        ansible_connection: local

    - name: Create manager survive flag
      ansible.builtin.file:
        path: /tmp/ap/.survive
        state: touch
        mode: "0600"
      vars:
        ansible_connection: local

- name: Converge — workflow_job_template (mock, connection local)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    wjt_name_local: "Molecule Test WJT Local"
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
  tasks:
    - name: Create workflow job template (connection local)
      ansible.platform.workflow_job_template:
        name: "{{ wjt_name_local }}"
        description: "Created by Molecule workflow_job_template_mock (connection local)"
      register: create_result_local
      vars:
        ansible_connection: local

    - name: Assert create changed (connection local)
      ansible.builtin.assert:
        that:
          - create_result_local is changed
          - create_result_local.workflow_job_template.id is defined
          - create_result_local.workflow_job_template.name == wjt_name_local
      vars:
        ansible_connection: local

    - name: Run again idempotency (connection local)
      ansible.platform.workflow_job_template:
        name: "{{ wjt_name_local }}"
        description: "Created by Molecule workflow_job_template_mock (connection local)"
        state: present
      register: idem_result_local
      vars:
        ansible_connection: local

    - name: Assert idempotent (connection local)
      ansible.builtin.assert:
        that: idem_result_local is not changed
      vars:
        ansible_connection: local

    - name: Update description (connection local)
      ansible.platform.workflow_job_template:
        name: "{{ wjt_name_local }}"
        description: "Updated by Molecule workflow_job_template_mock (connection local)"
      register: update_result_local
      vars:
        ansible_connection: local

    - name: Assert update changed (connection local)
      ansible.builtin.assert:
        that: update_result_local is changed
      vars:
        ansible_connection: local

    - name: Create labels for association test (connection local)
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}/api/controller/v2/labels/"
        method: POST
        body_format: json
        body:
          name: "{{ item }}"
          organization: 1
        status_code: [201]
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: false
      loop:
        - "wjt-label-1"
        - "wjt-label-2"
      vars:
        ansible_connection: local

    - name: Create notification template for association test (connection local)
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}/api/controller/v2/notification_templates/"
        method: POST
        body_format: json
        body:
          name: "{{ item }}"
        status_code: [201]
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: false
      loop:
        - "wjt-notify-start"
        - "wjt-notify-approval"
      vars:
        ansible_connection: local

    - name: Associate labels to workflow (connection local)
      ansible.platform.workflow_job_template:
        name: "{{ wjt_name_local }}"
        labels:
          - "wjt-label-1"
          - "wjt-label-2"
      register: label_result_local
      vars:
        ansible_connection: local

    - name: Assert label association changed (connection local)
      ansible.builtin.assert:
        that: label_result_local is changed
      vars:
        ansible_connection: local

    - name: Re-run same labels for idempotency (connection local)
      ansible.platform.workflow_job_template:
        name: "{{ wjt_name_local }}"
        labels:
          - "wjt-label-1"
          - "wjt-label-2"
      register: label_idem_local
      vars:
        ansible_connection: local

    - name: Assert label association idempotent (connection local)
      ansible.builtin.assert:
        that: label_idem_local is not changed
      vars:
        ansible_connection: local

    - name: Associate notification templates (connection local)
      ansible.platform.workflow_job_template:
        name: "{{ wjt_name_local }}"
        notification_templates_started:
          - "wjt-notify-start"
        notification_templates_approvals:
          - "wjt-notify-approval"
      register: notify_result_local
      vars:
        ansible_connection: local

    - name: Assert notification association changed (connection local)
      ansible.builtin.assert:
        that: notify_result_local is changed
      vars:
        ansible_connection: local

    - name: Set survey spec (connection local)
      ansible.platform.workflow_job_template:
        name: "{{ wjt_name_local }}"
        survey_enabled: true
        survey_spec:
          name: "Test Survey"
          description: "A test survey"
          spec:
            - question_name: "Target Host"
              variable: "target_host"
              type: "text"
              required: true
              default: "localhost"
      register: survey_result_local
      vars:
        ansible_connection: local

    - name: Assert survey changed (connection local)
      ansible.builtin.assert:
        that: survey_result_local is changed
      vars:
        ansible_connection: local

    - name: Copy workflow job template (connection local)
      ansible.platform.workflow_job_template:
        name: "{{ wjt_name_local }} Copy"
        copy_from: "{{ wjt_name_local }}"
        state: present
      register: copy_result_local
      vars:
        ansible_connection: local

    - name: Assert copy changed (connection local)
      ansible.builtin.assert:
        that:
          - copy_result_local is changed
          - copy_result_local.workflow_job_template.id is defined
      vars:
        ansible_connection: local

