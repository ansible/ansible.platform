---
# Converge: workflow_job_template create, idempotency, update, survey_spec,
# labels/notification_templates_* associations, copy_from, copy_from
# idempotency, check_mode, delete against the mock Gateway/Controller.
- name: Ensure mock Gateway is reachable
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
  tasks:
    - name: Wait for mock Gateway health endpoint
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}/health"
        method: GET
        status_code: 200
      register: health
      retries: 12
      delay: 5
      until: health.status == 200
      vars:
        ansible_connection: local

    - name: Ensure /tmp/ap directory exists
      ansible.builtin.file:
        path: /tmp/ap
        state: directory
        mode: "0755"
      vars:
        ansible_connection: local

    - name: Create manager survive flag (Molecule keeps manager alive across phases)
      ansible.builtin.file:
        path: /tmp/ap/.survive
        state: touch
        mode: "0600"
      vars:
        ansible_connection: local

# Play 2: full feature coverage (connection local) — create, idempotency, update,
# survey_spec, associations, copy_from, copy_from idempotency, check_mode, delete.
- name: Converge — workflow_job_template (mock, connection local)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
    molecule_org_name: "Molecule Test Org WFJT Local"
    molecule_wfjt_name: "molecule-wfjt-local"
    molecule_wfjt_copy_name: "molecule-wfjt-copy-local"
    molecule_label_name: "molecule-wfjt-label-local"
    molecule_nt_name: "molecule-wfjt-notification-local"
  tasks:
    - name: Create organization
      ansible.platform.organization:
        name: "{{ molecule_org_name }}"
      register: org_local
      vars:
        ansible_connection: local

    - name: Create notification_template to associate
      ansible.platform.notification_template:
        name: "{{ molecule_nt_name }}"
        organization: "{{ org_local.name }}"
        notification_type: webhook
        notification_configuration:
          url: "http://example.invalid/hook"
      vars:
        ansible_connection: local

    - name: Seed a label directly against the mock Controller
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}/api/controller/v2/labels/"
        method: POST
        headers:
          Authorization: "Basic bW9jazp0ZXN0cGFzcw=="
        body_format: json
        body:
          name: "{{ molecule_label_name }}"
        status_code: 201
      vars:
        ansible_connection: local

    - name: Create workflow_job_template
      ansible.platform.workflow_job_template:
        name: "{{ molecule_wfjt_name }}"
        organization: "{{ org_local.name }}"
        description: "Created by Molecule workflow_job_template_mock (connection local)"
        extra_vars:
          foo: bar
      register: create_result_local
      vars:
        ansible_connection: local

    - name: Assert create changed (connection local)
      ansible.builtin.assert:
        that:
          - create_result_local is changed
          - create_result_local.workflow_job_template.id is defined
          - create_result_local.workflow_job_template.name == molecule_wfjt_name
        fail_msg: "Create (local) should report changed. create_result_local={{ create_result_local }}"
      vars:
        ansible_connection: local

    - name: Run again idempotency (connection local)
      ansible.platform.workflow_job_template:
        name: "{{ molecule_wfjt_name }}"
        organization: "{{ org_local.name }}"
        description: "Created by Molecule workflow_job_template_mock (connection local)"
        extra_vars:
          foo: bar
      register: idem_result_local
      vars:
        ansible_connection: local

    - name: Assert idempotent run did not change (connection local)
      ansible.builtin.assert:
        that: idem_result_local is not changed
        fail_msg: "Idempotent run (local) should not report changed. idem_result_local={{ idem_result_local }}"
      vars:
        ansible_connection: local

    - name: Add survey_spec and associations (connection local)
      ansible.platform.workflow_job_template:
        name: "{{ molecule_wfjt_name }}"
        organization: "{{ org_local.name }}"
        survey_enabled: true
        survey_spec:
          name: ""
          description: ""
          spec:
            - question_name: "Environment"
              variable: environment
              type: text
              required: true
        labels:
          - "{{ molecule_label_name }}"
        notification_templates_success:
          - "{{ molecule_nt_name }}"
      register: survey_result_local
      vars:
        ansible_connection: local

    - name: Assert survey/association update changed (connection local)
      ansible.builtin.assert:
        that: survey_result_local is changed
        fail_msg: "Survey/association update (local) should report changed. survey_result_local={{ survey_result_local }}"
      vars:
        ansible_connection: local

    - name: Re-run survey_spec and associations — must be idempotent (connection local)
      ansible.platform.workflow_job_template:
        name: "{{ molecule_wfjt_name }}"
        organization: "{{ org_local.name }}"
        survey_enabled: true
        survey_spec:
          name: ""
          description: ""
          spec:
            - question_name: "Environment"
              variable: environment
              type: text
              required: true
        labels:
          - "{{ molecule_label_name }}"
        notification_templates_success:
          - "{{ molecule_nt_name }}"
      register: survey_idem_result_local
      vars:
        ansible_connection: local

    - name: Assert survey/association re-run did not change (connection local)
      ansible.builtin.assert:
        that: survey_idem_result_local is not changed
        fail_msg: "Survey/association re-run (local) should not report changed. survey_idem_result_local={{ survey_idem_result_local }}"
      vars:
        ansible_connection: local

    - name: Copy workflow_job_template (connection local)
      ansible.platform.workflow_job_template:
        name: "{{ molecule_wfjt_copy_name }}"
        copy_from: "{{ molecule_wfjt_name }}"
        organization: "{{ org_local.name }}"
      register: copy_result_local
      vars:
        ansible_connection: local

    - name: Assert copy changed and created a new resource (connection local)
      ansible.builtin.assert:
        that:
          - copy_result_local is changed
          - copy_result_local.workflow_job_template.id is defined
          - copy_result_local.workflow_job_template.id != create_result_local.workflow_job_template.id
        fail_msg: "Copy (local) should report changed with a new id. copy_result_local={{ copy_result_local }}"
      vars:
        ansible_connection: local

    - name: Re-run copy_from — must not create a second copy (connection local)
      ansible.platform.workflow_job_template:
        name: "{{ molecule_wfjt_copy_name }}"
        copy_from: "{{ molecule_wfjt_name }}"
        organization: "{{ org_local.name }}"
      register: copy_idem_result_local
      vars:
        ansible_connection: local

    - name: Assert re-run copy_from is idempotent (connection local)
      ansible.builtin.assert:
        that:
          - copy_idem_result_local.workflow_job_template.id == copy_result_local.workflow_job_template.id
        fail_msg: "Re-run copy_from (local) should not create another copy. copy_idem_result_local={{ copy_idem_result_local }}"
      vars:
        ansible_connection: local

    - name: Check mode update (must not call the API)
      ansible.platform.workflow_job_template:
        name: "{{ molecule_wfjt_name }}"
        organization: "{{ org_local.name }}"
        description: "Should not be applied"
        labels: []
      check_mode: true
      register: check_mode_result_local
      vars:
        ansible_connection: local

    - name: Assert check_mode reports changed (connection local)
      ansible.builtin.assert:
        that: check_mode_result_local is changed
        fail_msg: "Check mode (local) should report changed. check_mode_result_local={{ check_mode_result_local }}"
      vars:
        ansible_connection: local

# Play 3: basic CRUD parity (http direct).
- name: Converge — workflow_job_template (mock, http direct)
  hosts: localhost
  connection: ansible.platform.http
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
    ansible_platform_use_persistent_connection: false
    molecule_org_name: "Molecule Test Org WFJT HTTP Direct"
    molecule_wfjt_name: "molecule-wfjt-http-direct"
  tasks:
    - name: Create organization (http direct)
      ansible.platform.organization:
        name: "{{ molecule_org_name }}"
      register: org_http_direct

    - name: Create workflow_job_template (http direct)
      ansible.platform.workflow_job_template:
        name: "{{ molecule_wfjt_name }}"
        organization: "{{ org_http_direct.name }}"
      register: create_result_http_direct

    - name: Assert create changed (http direct)
      ansible.builtin.assert:
        that:
          - create_result_http_direct is changed
          - create_result_http_direct.workflow_job_template.id is defined
        fail_msg: "Create (http direct) should report changed. create_result_http_direct={{ create_result_http_direct }}"

    - name: Run again idempotency (http direct)
      ansible.platform.workflow_job_template:
        name: "{{ molecule_wfjt_name }}"
        organization: "{{ org_http_direct.name }}"
      register: idem_result_http_direct

    - name: Assert idempotent run did not change (http direct)
      ansible.builtin.assert:
        that: idem_result_http_direct is not changed
        fail_msg: "Idempotent run (http direct) should not report changed. idem_result_http_direct={{ idem_result_http_direct }}"

