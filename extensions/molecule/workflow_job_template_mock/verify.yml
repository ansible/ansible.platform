---
# Verify: the workflow_job_template created by converge is still present.
- name: Verify — workflow_job_template still exists (connection local)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
    molecule_org_name: "Molecule Test Org WFJT Local"
    molecule_wfjt_name: "molecule-wfjt-local"
  tasks:
    - name: Get workflow_job_template (state exists, connection local)
      ansible.platform.workflow_job_template:
        name: "{{ molecule_wfjt_name }}"
        organization: "{{ molecule_org_name }}"
        state: exists
      register: exists_result_local
      vars:
        ansible_connection: local

    - name: Assert workflow_job_template still exists (connection local)
      ansible.builtin.assert:
        that:
          - exists_result_local is not failed
          - exists_result_local.get('exists') | default(false) | bool
        fail_msg: "Verify: workflow_job_template {{ molecule_wfjt_name }} not found (connection local)."
      vars:
        ansible_connection: local
...
