---
# Verify: the job_template created by converge is still present (job_wait
# itself has no persistent identity to verify).
- name: Verify — job_template still exists (connection local)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
    molecule_jt_name: "molecule-jw-jt-local"
  tasks:
    - name: List job_templates by name (connection local)
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}/api/controller/v2/job_templates/?name={{ molecule_jt_name }}"
        method: GET
        headers:
          Authorization: "Basic bW9jazp0ZXN0cGFzcw=="
        status_code: 200
      register: list_result_local
      vars:
        ansible_connection: local

    - name: Assert job_template still exists (connection local)
      ansible.builtin.assert:
        that:
          - list_result_local.json.count | int > 0
        fail_msg: "Verify: job_template {{ molecule_jt_name }} not found (connection local)."
      vars:
        ansible_connection: local
...
