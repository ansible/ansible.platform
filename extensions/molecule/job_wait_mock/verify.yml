---
- name: Verify job fixtures in the mock Controller API
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Read each supported job resource
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}/api/controller/v2/{{ item.type }}/{{ item.id }}/"
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        return_content: true
        status_code: 200
      loop:
        - { id: 5801, type: jobs }
        - { id: 5901, type: project_updates }
        - { id: 6001, type: inventory_updates }
        - { id: 6101, type: workflow_jobs }
      register: jobs

    - name: Assert mock jobs retain their successful status
      ansible.builtin.assert:
        that:
          - jobs.results | map(attribute='json.status') | list == ['successful', 'successful', 'successful', 'successful']
...
