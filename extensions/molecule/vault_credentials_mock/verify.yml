---
- name: Verify — vault credentials test
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "{{ 'mock' | string }}"
    gateway_password: "{{ 'testpass' | string }}"
    gateway_validate_certs: false
  tasks:
    - name: Verify organization exists
      ansible.platform.organization:
        name: "vault-test-org-local"
        state: exists
        gateway_hostname: "{{ gateway_hostname }}"
        gateway_username: "{{ gateway_username }}"
        gateway_password: "{{ gateway_password }}"
        gateway_validate_certs: "{{ gateway_validate_certs }}"
      register: verify_org
      vars:
        ansible_connection: local

    - name: Assert organization exists
      ansible.builtin.assert:
        that:
          - verify_org.exists is true
        fail_msg: "Organization should exist after converge."
      vars:
        ansible_connection: local

- name: Verify — vault credentials test (http persistent)
  hosts: localhost
  connection: ansible.platform.http
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "{{ 'mock' | string }}"
    gateway_password: "{{ 'testpass' | string }}"
    gateway_validate_certs: false
    ansible_platform_use_persistent_connection: true
  tasks:
    - name: Verify team exists
      ansible.platform.team:
        name: "vault-test-team-hp"
        organization: "vault-test-org-local"
        state: exists
      register: verify_team

    - name: Assert team exists
      ansible.builtin.assert:
        that:
          - verify_team.exists is true
        fail_msg: "Team should exist after converge."
...
