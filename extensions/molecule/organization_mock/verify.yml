---
# Verify: all three connection scenarios (direct, persistent, local).
- name: Verify — organization created with direct mode (mock)
  hosts: localhost
  connection: ansible.platform.http
  gather_facts: false
  vars:
    molecule_org_name: "Molecule Test Org Direct"
    ansible_platform_persistent: false
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "mock"
    gateway_validate_certs: false
  tasks:
    - name: Get organization (state exists, direct mode)
      ansible.platform.organization:
        name: "{{ molecule_org_name }}"
        state: exists
      register: exists_result
      vars:
        ansible_connection: ansible.platform.http
        ansible_platform_persistent: false

    - name: Assert organization was found (direct mode)
      ansible.builtin.assert:
        that:
          - exists_result is not failed
          - exists_result.get('exists') | default(false) | bool
          - exists_result.get('organization') is defined
        fail_msg: "Verify: organization {{ molecule_org_name }} not found (direct mode)."
      vars:
        ansible_connection: local

    - name: Assert description updated (direct)
      ansible.builtin.assert:
        that: exists_result.organization.description == "Updated by Molecule organization_mock (direct)"
        fail_msg: "Verify: organization (direct) description was not updated."
      vars:
        ansible_connection: local

# Verify organization created with persistent mode.
- name: Verify — organization created with persistent mode (mock)
  hosts: localhost
