---
- name: Verify — service_key created (connection local)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: mock
    gateway_password: testpass
    gateway_validate_certs: false
  tasks:
    - name: Get service_key (state exists, connection local)
      ansible.platform.service_key:
        config:
          - name: molecule-mock-svckey-local
        state: gathered
        gateway_hostname: "{{ gateway_hostname }}"
        gateway_username: "{{ gateway_username }}"
        gateway_password: "{{ gateway_password }}"
        gateway_validate_certs: "{{ gateway_validate_certs }}"
      register: exists_result_local
      vars:
        ansible_connection: local

    - name: Assert service_key was found (connection local)
      ansible.builtin.assert:
        that:
          - exists_result_local is not failed
          - "exists_result_local.gathered | length > 0"
        fail_msg: "Verify: service_key not found (connection local)."
      vars:
        ansible_connection: local

- name: Verify — service_key created (http direct)
  hosts: localhost
  connection: ansible.platform.http
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: mock
    gateway_password: testpass
    gateway_validate_certs: false
    ansible_platform_use_persistent_connection: false
  tasks:
    - name: Get service_key (state exists, http direct)
      ansible.platform.service_key:
        config:
          - name: molecule-mock-svckey-local-hd
        state: gathered
      register: exists_result_http_direct

    - name: Assert service_key was found (http direct)
      ansible.builtin.assert:
        that:
          - exists_result_http_direct is not failed
          - "exists_result_http_direct.gathered | length > 0"
        fail_msg: "Verify: service_key not found (http direct)."

- name: Verify — service_key created (http persistent)
  hosts: localhost
  connection: ansible.platform.http
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: mock
    gateway_password: testpass
    gateway_validate_certs: false
    ansible_platform_use_persistent_connection: true
  tasks:
    - name: Get service_key (state exists, http persistent)
      ansible.platform.service_key:
        config:
          - name: molecule-mock-svckey-local-hp
        state: gathered
      register: exists_result_http_persistent

    - name: Assert service_key was found (http persistent)
      ansible.builtin.assert:
        that:
          - exists_result_http_persistent is not failed
          - "exists_result_http_persistent.gathered | length > 0"
        fail_msg: "Verify: service_key not found (http persistent)."

...
