---
driver:
  name: default

platforms:
  - name: localhost

provisioner:
  name: ansible
  ansible_args:
    - --inventory=${MOLECULE_SCENARIO_DIRECTORY}/inventory.yml
  playbooks:
    converge: converge.yml
    verify: verify.yml
    cleanup: cleanup.yml
  config_options:
    defaults:
      collections_path: "${ANSIBLE_COLLECTIONS_PATH}"
      log_verbosity: 4

scenario:
  test_sequence:
    - converge
    - verify
    - cleanup
...
