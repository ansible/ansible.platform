---
- name: "Verify — service_cluster (replaced)"
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars.yml
  tasks:
    - name: Gather service_cluster (assert present after replaced)
      ansible.platform.service_cluster:
        config:
          - name: "{{ expected_config.name }}"
        state: gathered
        gateway_hostname: "{{ gateway_hostname }}"
        gateway_username: "{{ gateway_username }}"
        gateway_password: "{{ gateway_password }}"
        gateway_validate_certs: "{{ gateway_validate_certs }}"
      register: gathered

    - name: Assert configuration exists after replaced
      ansible.builtin.assert:
        that:
          - gathered.gathered is defined
          - gathered.gathered | length > 0
        fail_msg: "Expected resource after replaced. got: {{ gathered.gathered }}"

    - name: Assert outlier_detection_enabled was updated by replaced
      ansible.builtin.assert:
        that:
          - (gathered.gathered | first).outlier_detection_enabled == expected_config.outlier_detection_enabled
        fail_msg: "replaced should have set outlier_detection_enabled=False. got: {{ (gathered.gathered | first).outlier_detection_enabled }}"

...
