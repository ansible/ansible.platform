---
- name: "Verify — service_cluster (overridden)"
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars.yml
  tasks:
    - name: Gather all service_cluster resources (verify overridden final state)
      ansible.platform.service_cluster:
        state: gathered
        gateway_hostname: "{{ gateway_hostname }}"
        gateway_username: "{{ gateway_username }}"
        gateway_password: "{{ gateway_password }}"
        gateway_validate_certs: "{{ gateway_validate_certs }}"
      register: gathered_all

    - name: Assert int-cluster-alpha still exists after overridden
      ansible.builtin.assert:
        that:
          - gathered_all.gathered is defined
          - gathered_all.gathered | selectattr("name", "equalto", "int-cluster-alpha") | list | length == 1
        fail_msg: "Expected int-cluster-alpha to exist after overridden. got: {{ gathered_all.gathered }}"

    - name: Assert int-cluster-beta was deleted by overridden (not in desired config)
      ansible.builtin.assert:
        that:
          - gathered_all.gathered is defined
          - gathered_all.gathered | selectattr("name", "equalto", "int-cluster-beta") | list | length == 0
        fail_msg: "overridden should have deleted int-cluster-beta. got: {{ gathered_all.gathered }}"

...
