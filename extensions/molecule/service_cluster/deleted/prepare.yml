---
- name: "Prepare — service_cluster (deleted)"
  hosts: localhost
  gather_facts: false
  vars_files:
  - vars.yml
  tasks:
  - name: Seed service_cluster to be deleted (prerequisite for deleted)
    ansible.platform.service_cluster:
      config:
      - "{{ prepare_config }}"
      state: merged
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs }}"
