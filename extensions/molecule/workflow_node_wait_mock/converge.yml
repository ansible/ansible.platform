---
- name: Exercise workflow_node_wait against the mock Gateway
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Wait for a workflow node whose job transitions to successful
      ansible.platform.workflow_node_wait:
        workflow_job_id: 8001
        name: Molecule Wait Node
        timeout: 10
        interval: 0.01
      register: wait_result

    - name: Verify the action followed the related job URL
      ansible.builtin.assert:
        that:
          - wait_result is not failed
          - wait_result is not changed
          - wait_result.id == 8201
          - wait_result.status == "successful"
          - wait_result.job_data.id == 8201
...
