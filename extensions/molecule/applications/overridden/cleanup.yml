---
- name: "Cleanup — applications (overridden)"
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars.yml
  tasks:
    - name: Remove int-app-alpha (test teardown)
      ansible.platform.applications:
        config:
          - name: "int-app-alpha"
        state: deleted
        gateway_hostname: "{{ gateway_hostname }}"
        gateway_username: "{{ gateway_username }}"
        gateway_password: "{{ gateway_password }}"
        gateway_validate_certs: "{{ gateway_validate_certs }}"
      failed_when: false

...
