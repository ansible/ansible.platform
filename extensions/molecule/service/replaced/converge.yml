---
- name: "Converge — service (replaced)"
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars.yml
  tasks:
    - name: Run ansible.platform.service with state=replaced
      ansible.platform.service:
        config:
          - "{{ expected_config }}"
        state: replaced
        gateway_hostname: "{{ gateway_hostname }}"
        gateway_username: "{{ gateway_username }}"
        gateway_password: "{{ gateway_password }}"
        gateway_validate_certs: "{{ gateway_validate_certs }}"
      register: result

...
