---
- name: "Verify — service_nodes (replaced)"
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars.yml
  tasks:
    - name: Gather service_nodes (assert present after replaced)
      ansible.platform.service_nodes:
        config:
          - name: "{{ expected_config.name }}"
        state: gathered
        gateway_hostname: "{{ gateway_hostname }}"
        gateway_username: "{{ gateway_username }}"
        gateway_password: "{{ gateway_password }}"
        gateway_validate_certs: "{{ gateway_validate_certs }}"
      register: gathered

    - name: Assert configuration exists after replaced
      ansible.builtin.assert:
        that:
          - gathered.gathered is defined
          - gathered.gathered | length > 0
        fail_msg: "Expected resource after replaced. got: {{ gathered.gathered }}"

    - name: Assert address was updated by replaced
      ansible.builtin.assert:
        that:
          - (gathered.gathered | first).address == expected_config.address
        fail_msg: "replaced should have set address='10.0.0.1'. got: {{ (gathered.gathered | first).address }}"

...
