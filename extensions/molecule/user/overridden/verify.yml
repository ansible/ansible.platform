---
- name: "Verify — user (overridden)"
  hosts: localhost
  gather_facts: false
  vars_files:
  - vars.yml
  tasks:
  - name: Gather target resource int-user-alice (should exist after overridden)
    ansible.platform.user:
      config:
      - username: "int-user-alice"
      state: gathered
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs }}"
    register: gathered_target

  - name: Assert int-user-alice still exists after overridden
    ansible.builtin.assert:
      that:
      - gathered_target.gathered is defined
      - gathered_target.gathered | length == 1
      fail_msg: "Expected int-user-alice to exist after overridden. got: {{ gathered_target.gathered }}"

  - name: Gather extra resource int-user-bob (should be deleted by overridden)
    ansible.platform.user:
      config:
      - username: "int-user-bob"
      state: gathered
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs }}"
    register: gathered_extra

  - name: Assert int-user-bob was deleted by overridden (not in desired config)
    ansible.builtin.assert:
      that:
      - gathered_extra.gathered is defined
      - gathered_extra.gathered | length == 0
      fail_msg: "overridden should have deleted int-user-bob. got: {{ gathered_extra.gathered }}"

