---
- name: "Verify — user (check)"
  hosts: localhost
  gather_facts: false
  vars_files:
  - vars.yml
  tasks:
  - name: Gather user (check mode must not have applied changes)
    ansible.platform.user:
      config:
      - username: "{{ expected_config.username }}"
      state: gathered
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs }}"
    register: gathered

  - name: Assert int-user-alice still has prepare_config values (check did not apply)
    ansible.builtin.assert:
      that:
      - gathered.gathered is defined
      - gathered.gathered | length > 0
      - (gathered.gathered | first).last_name == prepare_config.last_name
      fail_msg: "check mode should not alter resource. got: {{ gathered.gathered }}"
