    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
    ansible_platform_use_persistent_connection: false
  tasks:
    - name: Create credential type (http direct)
      ansible.platform.controller_credential_type:
        name: "{{ ct_name_http_direct }}"
        description: "Created by Molecule controller_credential_type_mock (http direct)"
