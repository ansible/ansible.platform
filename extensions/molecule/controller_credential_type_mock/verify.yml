    - name: Assert description updated (http persistent)
      ansible.builtin.assert:
        that: exists_result_http_persistent.controller_credential_type.description == "Updated by Molecule controller_credential_type_mock (http persistent)"
        fail_msg: "Verify: credential type (http persistent) description was not updated."
...
