---
# Verify: all three connection scenarios (local, direct, persistent).
- name: Verify — credential type created with connection local (mock)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ct_name_local: "Molecule Test CredType Local"
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
  tasks:
    - name: Get credential type (state exists, connection local)
      ansible.platform.controller_credential_type:
        name: "{{ ct_name_local }}"
        state: exists
        gateway_hostname: "{{ gateway_hostname }}"
        gateway_username: "{{ gateway_username }}"
        gateway_password: "{{ gateway_password }}"
        gateway_validate_certs: "{{ gateway_validate_certs }}"
      register: exists_result_local
      vars:
        ansible_connection: local

    - name: Assert credential type was found (connection local)
      ansible.builtin.assert:
        that:
          - exists_result_local is not failed
          - exists_result_local.get('exists') | default(false) | bool
          - exists_result_local.get('controller_credential_type') is defined
        fail_msg: "Verify: credential type {{ ct_name_local }} not found (connection local)."
      vars:
        ansible_connection: local

    - name: Assert description updated (connection local)
      ansible.builtin.assert:
        that: exists_result_local.controller_credential_type.description == "Updated by Molecule controller_credential_type_mock (connection local)"
        fail_msg: "Verify: credential type (local) description was not updated."
      vars:
        ansible_connection: local

- name: Verify — credential type created with http direct (mock)
  hosts: localhost
  connection: ansible.platform.http
  gather_facts: false
  vars:
    ct_name_http_direct: "Molecule Test CredType HTTP Direct"
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
    ansible_platform_use_persistent_connection: false
  tasks:
    - name: Get credential type (state exists, http direct)
      ansible.platform.controller_credential_type:
        name: "{{ ct_name_http_direct }}"
        state: exists
      register: exists_result_http_direct

    - name: Assert credential type was found (http direct)
