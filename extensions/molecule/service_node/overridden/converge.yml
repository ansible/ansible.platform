---
- name: "Converge — service_node (overridden)"
  hosts: localhost
  gather_facts: false
  vars_files:
  - vars.yml
  tasks:
  - name: Run ansible.platform.service_node with state=overridden
    ansible.platform.service_node:
      config:
      - "{{ expected_config }}"
      state: overridden
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs }}"
    register: result

