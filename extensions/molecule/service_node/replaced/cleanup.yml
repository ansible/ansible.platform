---
- name: "Cleanup — service_node (replaced)"
  hosts: localhost
  gather_facts: false
  vars_files:
  - vars.yml
  tasks:
  - name: Remove int-snode-alpha (test teardown)
    ansible.platform.service_node:
      config:
      - name: "int-snode-alpha"
      state: deleted
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs }}"
    ignore_errors: true
