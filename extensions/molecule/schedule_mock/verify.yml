    - name: Assert schedule was found (http persistent)
      ansible.builtin.assert:
        that:
          - exists_result_http_persistent is not failed
          - exists_result_http_persistent.get('exists') | default(false) | bool
        fail_msg: "Verify: schedule {{ molecule_schedule_name }} not found (http persistent)."
...
