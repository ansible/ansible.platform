---
# Converge: schedule create, idempotency, update, credentials/labels/instance_groups
# association, and delete against the mock Gateway/Controller.
- name: Ensure mock Gateway is reachable
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
  tasks:
    - name: Wait for mock Gateway health endpoint
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}/health"
        method: GET
        status_code: 200
      register: health
      retries: 12
      delay: 5
      until: health.status == 200
      vars:
        ansible_connection: local

    - name: Ensure /tmp/ap directory exists
      ansible.builtin.file:
        path: /tmp/ap
        state: directory
        mode: "0755"
      vars:
        ansible_connection: local

    - name: Create manager survive flag (Molecule keeps manager alive across phases)
      ansible.builtin.file:
        path: /tmp/ap/.survive
        state: touch
        mode: "0600"
      vars:
        ansible_connection: local

# Play 2: full feature coverage (connection local) — create, idempotency, update,
# associations, delete.
- name: Converge — schedule (mock, connection local)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
    molecule_ujt_name: "molecule-ujt-local"
    molecule_schedule_name: "molecule-schedule-local"
  tasks:
    - name: Seed a fake unified_job_template directly against the mock Controller
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}/api/controller/v2/unified_job_templates/"
        method: POST
        headers:
          Authorization: "Basic bW9jazp0ZXN0cGFzcw=="
        body_format: json
        body:
          name: "{{ molecule_ujt_name }}"
        status_code: 201
      register: ujt_local
      vars:
        ansible_connection: local

    - name: Seed a fake credential directly against the mock Controller
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}/api/controller/v2/credentials/"
        method: POST
        headers:
          Authorization: "Basic bW9jazp0ZXN0cGFzcw=="
        body_format: json
        body:
          name: "molecule-cred-local"
        status_code: 201
      register: cred_local
      vars:
        ansible_connection: local

    - name: Create schedule
      ansible.platform.schedule:
        name: "{{ molecule_schedule_name }}"
        unified_job_template: "{{ molecule_ujt_name }}"
        rrule: "DTSTART:20991219T130551Z RRULE:FREQ=WEEKLY;INTERVAL=1;COUNT=1"
        credentials:
          - "molecule-cred-local"
      register: create_result_local
      vars:
        ansible_connection: local

    - name: Assert create changed (connection local)
      ansible.builtin.assert:
        that:
          - create_result_local is changed
          - create_result_local.schedule.id is defined
          - create_result_local.schedule.name == molecule_schedule_name
        fail_msg: "Create (local) should report changed. create_result_local={{ create_result_local }}"
      vars:
        ansible_connection: local

    - name: Run again idempotency (connection local)
      ansible.platform.schedule:
        name: "{{ molecule_schedule_name }}"
        unified_job_template: "{{ molecule_ujt_name }}"
        rrule: "DTSTART:20991219T130551Z RRULE:FREQ=WEEKLY;INTERVAL=1;COUNT=1"
        credentials:
          - "molecule-cred-local"
      register: idem_result_local
      vars:
        ansible_connection: local

    - name: Assert idempotent run did not change (connection local)
      ansible.builtin.assert:
        that: idem_result_local is not changed
        fail_msg: "Idempotent run (local) should not report changed. idem_result_local={{ idem_result_local }}"
      vars:
        ansible_connection: local

    - name: Update schedule (disable it, connection local)
      ansible.platform.schedule:
        name: "{{ molecule_schedule_name }}"
        unified_job_template: "{{ molecule_ujt_name }}"
        enabled: false
      register: update_result_local
      vars:
        ansible_connection: local

    - name: Assert update changed (connection local)
      ansible.builtin.assert:
        that:
          - update_result_local is changed
          - update_result_local.schedule.enabled == false
        fail_msg: "Update (local) should report changed. update_result_local={{ update_result_local }}"
      vars:
        ansible_connection: local

