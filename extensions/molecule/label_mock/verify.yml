---
- name: Verify — label created with connection local (mock)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    label_name_local: "Molecule Test Label Local"
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
  tasks:
    - name: Get label (state exists, connection local)
      ansible.platform.label:
        name: "{{ label_name_local }}"
        organization: "1"
        state: exists
        gateway_hostname: "{{ gateway_hostname }}"
        gateway_username: "{{ gateway_username }}"
        gateway_password: "{{ gateway_password }}"
        gateway_validate_certs: "{{ gateway_validate_certs }}"
      register: exists_result_local
      vars:
        ansible_connection: local

    - name: Assert label was found (connection local)
      ansible.builtin.assert:
        that:
          - exists_result_local is not failed
          - exists_result_local.get('exists') | default(false) | bool
      vars:
        ansible_connection: local

- name: Verify — label created with http direct (mock)
  hosts: localhost
  connection: ansible.platform.http
  gather_facts: false
  vars:
    label_name_http_direct: "Molecule Test Label HTTP Direct"
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
    ansible_platform_use_persistent_connection: false
  tasks:
    - name: Get label (state exists, http direct)
      ansible.platform.label:
        name: "{{ label_name_http_direct }}"
        organization: "1"
        state: exists
      register: exists_result_http_direct

    - name: Assert label was found (http direct)
      ansible.builtin.assert:
        that:
          - exists_result_http_direct is not failed
          - exists_result_http_direct.get('exists') | default(false) | bool

- name: Verify — label created with http persistent (mock)
  hosts: localhost
  connection: ansible.platform.http
  gather_facts: false
  vars:
    label_name_http_persistent: "Molecule Test Label HTTP Persistent"
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
    ansible_platform_use_persistent_connection: true
  tasks:
    - name: Get label (state exists, http persistent)
      ansible.platform.label:
        name: "{{ label_name_http_persistent }}"
        organization: "1"
        state: exists
      register: exists_result_http_persistent

    - name: Assert label was found (http persistent)
      ansible.builtin.assert:
        that:
          - exists_result_http_persistent is not failed
          - exists_result_http_persistent.get('exists') | default(false) | bool
...
