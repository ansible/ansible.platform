---
- name: Ensure mock Gateway is reachable
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
  tasks:
    - name: Wait for mock Gateway health endpoint
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}/health"
        method: GET
        status_code: 200
      register: health
      retries: 12
      delay: 5
      until: health.status == 200
      vars:
        ansible_connection: local

    - name: Ensure /tmp/ap directory exists
      ansible.builtin.file:
        path: /tmp/ap
        state: directory
        mode: "0755"
      vars:
        ansible_connection: local

    - name: Create manager survive flag
      ansible.builtin.file:
        path: /tmp/ap/.survive
        state: touch
        mode: "0600"
      vars:
        ansible_connection: local

- name: Converge — label (mock, connection local)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    label_name_local: "Molecule Test Label Local"
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
  tasks:
    - name: Create label (connection local)
      ansible.platform.label:
        name: "{{ label_name_local }}"
        organization: "1"
      register: create_result_local
      vars:
        ansible_connection: local

    - name: Assert create changed (connection local)
      ansible.builtin.assert:
        that:
          - create_result_local is changed
          - create_result_local.label.id is defined
          - create_result_local.label.name == label_name_local
        fail_msg: "Create (local) should report changed. create_result_local={{ create_result_local }}"
      vars:
        ansible_connection: local

    - name: Run again idempotency (connection local)
      ansible.platform.label:
        name: "{{ label_name_local }}"
        organization: "1"
        state: present
      register: idem_result_local
      vars:
        ansible_connection: local

    - name: Assert idempotent run did not change (connection local)
      ansible.builtin.assert:
        that: idem_result_local is not changed
        fail_msg: "Idempotent run (local) should not report changed."
      vars:
        ansible_connection: local

- name: Converge — label (mock, http direct)
  hosts: localhost
  connection: ansible.platform.http
  gather_facts: false
  vars:
    label_name_http_direct: "Molecule Test Label HTTP Direct"
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
    ansible_platform_use_persistent_connection: false
  tasks:
    - name: Create label (http direct)
      ansible.platform.label:
        name: "{{ label_name_http_direct }}"
        organization: "1"
      register: create_result_http_direct

    - name: Assert create changed (http direct)
      ansible.builtin.assert:
        that:
          - create_result_http_direct is changed
          - create_result_http_direct.label.id is defined

    - name: Run again idempotency (http direct)
      ansible.platform.label:
        name: "{{ label_name_http_direct }}"
        organization: "1"
        state: present
      register: idem_result_http_direct

    - name: Assert idempotent (http direct)
      ansible.builtin.assert:
        that: idem_result_http_direct is not changed

- name: Converge — label (mock, http persistent)
  hosts: localhost
  connection: ansible.platform.http
  gather_facts: false
  vars:
    label_name_http_persistent: "Molecule Test Label HTTP Persistent"
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
    ansible_platform_use_persistent_connection: true
  tasks:
    - name: Create label (http persistent)
      ansible.platform.label:
        name: "{{ label_name_http_persistent }}"
        organization: "1"
      register: create_result_http_persistent

    - name: Assert create changed (http persistent)
      ansible.builtin.assert:
        that:
          - create_result_http_persistent is changed
          - create_result_http_persistent.label.id is defined

    - name: Run again idempotency (http persistent)
      ansible.platform.label:
        name: "{{ label_name_http_persistent }}"
        organization: "1"
        state: present
      register: idem_result_http_persistent

    - name: Assert idempotent (http persistent)
      ansible.builtin.assert:
        that: idem_result_http_persistent is not changed
...
