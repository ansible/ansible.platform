---
- name: "Verify — authenticator_maps (replaced)"
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars.yml
  tasks:
    - name: Gather authenticator_maps (assert present after replaced)
      ansible.platform.authenticator_maps:
        config:
          - name: "{{ expected_config.name }}"
        state: gathered
        gateway_hostname: "{{ gateway_hostname }}"
        gateway_username: "{{ gateway_username }}"
        gateway_password: "{{ gateway_password }}"
        gateway_validate_certs: "{{ gateway_validate_certs }}"
      register: gathered

    - name: Assert configuration exists after replaced
      ansible.builtin.assert:
        that:
          - gathered.gathered is defined
          - gathered.gathered | length > 0
        fail_msg: "Expected resource after replaced. got: {{ gathered.gathered }}"

    - name: Assert authenticator was updated by replaced
      ansible.builtin.assert:
        that:
          - (gathered.gathered | first).authenticator == expected_config.authenticator
        fail_msg: "replaced should have set authenticator=3100. got: {{ (gathered.gathered | first).authenticator }}"

...
