---
- name: "Cleanup — role_definition (replaced)"
  hosts: localhost
  gather_facts: false
  vars_files:
  - vars.yml
  tasks:
  - name: Remove int-roledef-alpha (test teardown)
    ansible.platform.role_definition:
      config:
      - name: "int-roledef-alpha"
      state: deleted
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs }}"
    ignore_errors: true
