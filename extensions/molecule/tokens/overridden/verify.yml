---
- name: "Verify — tokens (overridden)"
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars.yml
  tasks:
    - name: Gather all tokens resources (verify overridden final state)
      ansible.platform.tokens:
        state: gathered
        gateway_hostname: "{{ gateway_hostname }}"
        gateway_username: "{{ gateway_username }}"
        gateway_password: "{{ gateway_password }}"
        gateway_validate_certs: "{{ gateway_validate_certs }}"
      register: gathered_all

    - name: Assert Alpha token still exists after overridden
      ansible.builtin.assert:
        that:
          - gathered_all.gathered is defined
          - gathered_all.gathered | selectattr("description", "equalto", "Alpha token") | list | length == 1
        fail_msg: "Expected Alpha token to exist after overridden. got: {{ gathered_all.gathered }}"

    - name: Assert Beta token was deleted by overridden (not in desired config)
      ansible.builtin.assert:
        that:
          - gathered_all.gathered is defined
          - gathered_all.gathered | selectattr("description", "equalto", "Beta token") | list | length == 0
        fail_msg: "overridden should have deleted Beta token. got: {{ gathered_all.gathered }}"

...
