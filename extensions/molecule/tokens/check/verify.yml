---
- name: "Verify — tokens (check)"
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars.yml
  tasks:
    - name: Gather tokens (check mode must not have applied changes)
      ansible.platform.tokens:
        config:
          - description: "{{ expected_config.description }}"
        state: gathered
        gateway_hostname: "{{ gateway_hostname }}"
        gateway_username: "{{ gateway_username }}"
        gateway_password: "{{ gateway_password }}"
        gateway_validate_certs: "{{ gateway_validate_certs }}"
      register: gathered

    - name: Assert Alpha token still has prepare_config values (check did not apply)
      ansible.builtin.assert:
        that:
          - gathered.gathered is defined
          - gathered.gathered | length > 0
          - (gathered.gathered | first).scope == prepare_config.scope
        fail_msg: "check mode should not alter resource. got: {{ gathered.gathered }}"

...
