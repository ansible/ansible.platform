---
- name: "Verify — tokens (replaced)"
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars.yml
  tasks:
    - name: Gather tokens (assert present after replaced)
      ansible.platform.tokens:
        config:
          - description: "{{ expected_config.description }}"
        state: gathered
        gateway_hostname: "{{ gateway_hostname }}"
        gateway_username: "{{ gateway_username }}"
        gateway_password: "{{ gateway_password }}"
        gateway_validate_certs: "{{ gateway_validate_certs }}"
      register: gathered

    - name: Assert configuration exists after replaced
      ansible.builtin.assert:
        that:
          - gathered.gathered is defined
          - gathered.gathered | length > 0
        fail_msg: "Expected resource after replaced. got: {{ gathered.gathered }}"

    - name: Assert scope was updated by replaced
      ansible.builtin.assert:
        that:
          - (gathered.gathered | first).scope == expected_config.scope
        fail_msg: "replaced should have set scope='read'. got: {{ (gathered.gathered | first).scope }}"

...
