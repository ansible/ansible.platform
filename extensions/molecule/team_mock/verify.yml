---
# Verify: all three team connection scenarios (direct, persistent, local).
- name: Verify — team created with direct mode (mock)
  hosts: localhost
  connection: ansible.platform.http
  gather_facts: false
  vars:
    molecule_team_direct: "molecule-mock-team-direct"
    molecule_org: "Default"
    ansible_platform_persistent: false
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "mock"
    gateway_validate_certs: false
  tasks:
    - name: Get team (state exists, direct mode)
      ansible.platform.team:
        name: "{{ molecule_team_direct }}"
        organization: "{{ molecule_org }}"
        state: exists
        gateway_hostname: "{{ gateway_hostname }}"
        gateway_username: "{{ gateway_username }}"
        gateway_password: "{{ gateway_password }}"
        gateway_validate_certs: "{{ gateway_validate_certs }}"
      register: exists_result
      vars:
        ansible_connection: ansible.platform.http
        ansible_platform_persistent: false

    - name: Assert team was found (direct mode)
      ansible.builtin.assert:
        that:
          - exists_result is not failed
          - exists_result.get('exists') | default(false) | bool
          - exists_result.get('team') is defined
        fail_msg: "Verify: could not find team {{ molecule_team_direct }} (direct mode)."
      vars:
        ansible_connection: local

    - name: Assert description updated (direct)
      ansible.builtin.assert:
        that: exists_result.team.description == "Updated by Molecule team_mock (direct)"
        fail_msg: "Verify: team (direct) description was not updated."
      vars:
        ansible_connection: local

