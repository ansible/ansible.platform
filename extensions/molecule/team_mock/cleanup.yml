---
# Clean up test teams from mock (direct, persistent, local).
- name: Cleanup — delete team (mock, direct mode)
  hosts: localhost
  connection: ansible.platform.http
  gather_facts: false
  vars:
    molecule_team_direct: "molecule-mock-team-direct"
    molecule_org: "Default"
    ansible_platform_persistent: false
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "mock"
    gateway_validate_certs: false
  tasks:
    - name: Delete team (direct mode)
      ansible.platform.team:
        name: "{{ molecule_team_direct }}"
        organization: "{{ molecule_org }}"
        state: absent
        gateway_hostname: "{{ gateway_hostname }}"
        gateway_username: "{{ gateway_username }}"
        gateway_password: "{{ gateway_password }}"
        gateway_validate_certs: "{{ gateway_validate_certs }}"
      register: delete_result
      failed_when: false
      vars:
        ansible_connection: ansible.platform.http
        ansible_platform_persistent: false

    - name: Assert team removed or already absent (direct)
      ansible.builtin.assert:
        that: delete_result is not failed
        fail_msg: "Cleanup: failed to delete team {{ molecule_team_direct }}."
      vars:
        ansible_connection: local

- name: Cleanup — delete team (mock, persistent mode)
  hosts: localhost
  connection: ansible.platform.http
