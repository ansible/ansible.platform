---
- name: "Verify — ca_certificates (deleted)"
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars.yml
  tasks:
    - name: Gather ca_certificates (should be absent after deleted)
      ansible.platform.ca_certificates:
        config:
          - name: "int-cert-alpha"
        state: gathered
        gateway_hostname: "{{ gateway_hostname }}"
        gateway_username: "{{ gateway_username }}"
        gateway_password: "{{ gateway_password }}"
        gateway_validate_certs: "{{ gateway_validate_certs }}"
      register: gathered

    - name: Assert int-cert-alpha no longer exists (deleted)
      ansible.builtin.assert:
        that:
          - gathered.gathered is defined
          - gathered.gathered | length == 0
        fail_msg: "Expected empty after deleted, got: {{ gathered.gathered }}"

...
