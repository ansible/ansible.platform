---
- name: "Verify — ca_certificates (check)"
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars.yml
  tasks:
    - name: Gather ca_certificates (check mode must not have applied changes)
      ansible.platform.ca_certificates:
        config:
          - name: "{{ expected_config.name }}"
        state: gathered
        gateway_hostname: "{{ gateway_hostname }}"
        gateway_username: "{{ gateway_username }}"
        gateway_password: "{{ gateway_password }}"
        gateway_validate_certs: "{{ gateway_validate_certs }}"
      register: gathered

    - name: Assert int-cert-alpha still has prepare_config values (check did not apply)
      ansible.builtin.assert:
        that:
          - gathered.gathered is defined
          - gathered.gathered | length > 0
          - (gathered.gathered | first).pem_data == prepare_config.pem_data
        fail_msg: "check mode should not alter resource. got: {{ gathered.gathered }}"

...
