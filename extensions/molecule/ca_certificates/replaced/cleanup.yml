---
- name: "Cleanup — ca_certificates (replaced)"
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars.yml
  tasks:
    - name: Remove int-cert-alpha (test teardown)
      ansible.platform.ca_certificates:
        config:
          - name: "int-cert-alpha"
        state: deleted
        gateway_hostname: "{{ gateway_hostname }}"
        gateway_username: "{{ gateway_username }}"
        gateway_password: "{{ gateway_password }}"
        gateway_validate_certs: "{{ gateway_validate_certs }}"
      failed_when: false

...
