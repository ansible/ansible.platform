---
- name: "Verify — authenticator_map (deleted)"
  hosts: localhost
  gather_facts: false
  vars_files:
  - vars.yml
  tasks:
  - name: Gather authenticator_map (should be absent after deleted)
    ansible.platform.authenticator_map:
      config:
      - name: "int-authmap-alpha"
      state: gathered
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs }}"
    register: gathered

  - name: Assert int-authmap-alpha no longer exists (deleted)
    ansible.builtin.assert:
      that:
      - gathered.gathered is defined
      - gathered.gathered | length == 0
      fail_msg: "Expected empty after deleted, got: {{ gathered.gathered }}"

