---
- name: Ensure mock Gateway is reachable
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
  tasks:
    - name: Wait for mock Gateway health endpoint
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}/health"
        method: GET
        status_code: 200
      register: health
      retries: 12
      delay: 5
      until: health.status == 200
      vars:
        ansible_connection: local

- name: Setup prerequisites
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
    mock_auth: "Basic bW9jazptb2Nr"
  tasks:
    - name: Create prerequisite role_definition (Organization Admin)
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}/api/gateway/v1/role_definitions/"
        method: POST
        headers:
          Authorization: "{{ mock_auth }}"
          Content-Type: "application/json"
        body_format: json
        body:
          name: "Organization Admin"
          description: "Org-scoped admin role for molecule testing"
        status_code: [200, 201]
      register: roledef_result
      vars:
        ansible_connection: local

    - name: Create prerequisite team (molecule-mock-team)
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}/api/gateway/v1/teams/"
        method: POST
        headers:
          Authorization: "{{ mock_auth }}"
          Content-Type: "application/json"
        body_format: json
        body:
          name: "molecule-mock-team"
          organization: 1
          description: "Team for molecule role assignment tests"
        status_code: [200, 201]
      register: team_result
      vars:
        ansible_connection: local

    - name: Ensure /tmp/ap directory exists
      ansible.builtin.file:
        path: /tmp/ap
        state: directory
        mode: "0755"
      vars:
        ansible_connection: local

    - name: Create manager survive flag
      ansible.builtin.file:
        path: /tmp/ap/.survive
        state: touch
        mode: "0600"
      vars:
        ansible_connection: local

- name: Converge -- role_team_assignment (mock, connection local)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
  tasks:

    # -- org-scoped: create, idempotency, exists, absent ----------------------

    - name: Create org-scoped assignment
      ansible.platform.role_team_assignment:
        role_definition: "Organization Admin"
        team: "molecule-mock-team"
        assignment_objects:
          - name: "Default"
            type: organizations
        state: present
        gateway_hostname: "{{ gateway_hostname }}"
        gateway_username: "{{ gateway_username }}"
        gateway_password: "{{ gateway_password }}"
        gateway_validate_certs: "{{ gateway_validate_certs }}"
      register: create_result
      vars:
        ansible_connection: local

    - name: Assert create changed
      ansible.builtin.assert:
        that: create_result is changed
        fail_msg: "Create should report changed. result={{ create_result }}"
      vars:
        ansible_connection: local

    - name: Idempotency check
      ansible.platform.role_team_assignment:
        role_definition: "Organization Admin"
        team: "molecule-mock-team"
        assignment_objects:
          - name: "Default"
            type: organizations
        state: present
        gateway_hostname: "{{ gateway_hostname }}"
        gateway_username: "{{ gateway_username }}"
        gateway_password: "{{ gateway_password }}"
        gateway_validate_certs: "{{ gateway_validate_certs }}"
      register: idem_result
      vars:
        ansible_connection: local

    - name: Assert idempotent
      ansible.builtin.assert:
        that: idem_result is not changed
        fail_msg: "Second run should not change. result={{ idem_result }}"
      vars:
        ansible_connection: local

    - name: state=exists check
      ansible.platform.role_team_assignment:
        role_definition: "Organization Admin"
        team: "molecule-mock-team"
        assignment_objects:
          - name: "Default"
            type: organizations
        state: exists
        gateway_hostname: "{{ gateway_hostname }}"
        gateway_username: "{{ gateway_username }}"
        gateway_password: "{{ gateway_password }}"
        gateway_validate_certs: "{{ gateway_validate_certs }}"
      register: exists_result
      vars:
        ansible_connection: local

    - name: Assert exists returned names
      ansible.builtin.assert:
        that:
          - not exists_result.changed
          - exists_result.role_team_assignment.role_definition == "Organization Admin"
          - exists_result.role_team_assignment.team == "molecule-mock-team"
        fail_msg: "state=exists failed or returned wrong data. result={{ exists_result }}"
      vars:
        ansible_connection: local

    - name: state=absent remove assignment
      ansible.platform.role_team_assignment:
        role_definition: "Organization Admin"
        team: "molecule-mock-team"
        assignment_objects:
          - name: "Default"
            type: organizations
        state: absent
        gateway_hostname: "{{ gateway_hostname }}"
        gateway_username: "{{ gateway_username }}"
        gateway_password: "{{ gateway_password }}"
        gateway_validate_certs: "{{ gateway_validate_certs }}"
      register: absent_result
      vars:
        ansible_connection: local

    - name: Assert absent changed
      ansible.builtin.assert:
        that: absent_result is changed
        fail_msg: "state=absent should report changed. result={{ absent_result }}"
      vars:
        ansible_connection: local

    - name: state=absent idempotency (already gone)
      ansible.platform.role_team_assignment:
        role_definition: "Organization Admin"
        team: "molecule-mock-team"
        assignment_objects:
          - name: "Default"
            type: organizations
        state: absent
        gateway_hostname: "{{ gateway_hostname }}"
        gateway_username: "{{ gateway_username }}"
        gateway_password: "{{ gateway_password }}"
        gateway_validate_certs: "{{ gateway_validate_certs }}"
      register: absent_idem_result
      vars:
        ansible_connection: local

    - name: Assert absent idempotent
      ansible.builtin.assert:
        that: absent_idem_result is not changed
        fail_msg: "Second absent should not change. result={{ absent_idem_result }}"
      vars:
        ansible_connection: local

    # -- object_id path: used for resources the mock has no named endpoint for,
    # including EDA projects (eda_projects type routes to /api/eda/v1/projects/).
    - name: Assign by object_id (EDA project workaround pattern)
      ansible.platform.role_team_assignment:
        role_definition: "Organization Admin"
        team: "molecule-mock-team"
        object_id: 1
        state: present
        gateway_hostname: "{{ gateway_hostname }}"
        gateway_username: "{{ gateway_username }}"
        gateway_password: "{{ gateway_password }}"
        gateway_validate_certs: "{{ gateway_validate_certs }}"
      register: oid_result
      vars:
        ansible_connection: local

    - name: Assert object_id assignment changed
      ansible.builtin.assert:
        that: oid_result is changed
        fail_msg: "object_id assignment should report changed. result={{ oid_result }}"
      vars:
        ansible_connection: local

    - name: object_id assignment idempotency
      ansible.platform.role_team_assignment:
        role_definition: "Organization Admin"
        team: "molecule-mock-team"
        object_id: 1
        state: present
        gateway_hostname: "{{ gateway_hostname }}"
        gateway_username: "{{ gateway_username }}"
        gateway_password: "{{ gateway_password }}"
        gateway_validate_certs: "{{ gateway_validate_certs }}"
      register: oid_idem_result
      vars:
        ansible_connection: local

    - name: Assert object_id idempotent
      ansible.builtin.assert:
        that: oid_idem_result is not changed
        fail_msg: "object_id second run should not change. result={{ oid_idem_result }}"
      vars:
        ansible_connection: local
...
