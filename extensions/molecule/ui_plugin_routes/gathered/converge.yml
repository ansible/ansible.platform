---
- name: "Converge — ui_plugin_routes (gathered)"
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars.yml
  tasks:
    - name: Run ansible.platform.ui_plugin_routes with state=gathered
      ansible.platform.ui_plugin_routes:
        config:
          - "{{ expected_config }}"
        state: gathered
        gateway_hostname: "{{ gateway_hostname }}"
        gateway_username: "{{ gateway_username }}"
        gateway_password: "{{ gateway_password }}"
        gateway_validate_certs: "{{ gateway_validate_certs }}"
      register: result

...
