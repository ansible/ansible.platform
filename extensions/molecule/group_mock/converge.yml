---
- name: Ensure mock Gateway is reachable
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
  tasks:
    - name: Wait for mock Gateway health endpoint
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}/health"
        method: GET
        status_code: 200
      register: health
      retries: 12
      delay: 5
      until: health.status == 200
      vars:
        ansible_connection: local

    - name: Ensure /tmp/ap directory exists
      ansible.builtin.file:
        path: /tmp/ap
        state: directory
        mode: "0755"
      vars:
        ansible_connection: local

    - name: Create manager survive flag
      ansible.builtin.file:
        path: /tmp/ap/.survive
        state: touch
        mode: "0600"
      vars:
        ansible_connection: local

- name: Converge — group (mock, connection local)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    group_name_local: "Molecule Test Group Local"
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
  tasks:
    - name: Create group (connection local)
      ansible.platform.group:
        name: "{{ group_name_local }}"
        description: "Created by Molecule group_mock (connection local)"
        inventory: "1"
        variables:
          env: test
      register: create_result_local
      vars:
        ansible_connection: local

    - name: Assert create changed (connection local)
      ansible.builtin.assert:
        that:
          - create_result_local is changed
          - create_result_local.group.id is defined
          - create_result_local.group.name == group_name_local
      vars:
        ansible_connection: local

    - name: Run again idempotency (connection local)
      ansible.platform.group:
        name: "{{ group_name_local }}"
        description: "Created by Molecule group_mock (connection local)"
        inventory: "1"
        variables:
          env: test
        state: present
      register: idem_result_local
      vars:
        ansible_connection: local

    - name: Assert idempotent (connection local)
      ansible.builtin.assert:
        that: idem_result_local is not changed
      vars:
        ansible_connection: local

    - name: Update group description (connection local)
      ansible.platform.group:
        name: "{{ group_name_local }}"
        description: "Updated by Molecule group_mock (connection local)"
        inventory: "1"
      register: update_result_local
      vars:
        ansible_connection: local

    - name: Assert update changed (connection local)
      ansible.builtin.assert:
        that: update_result_local is changed
      vars:
        ansible_connection: local

- name: Converge — group (mock, http direct)
  hosts: localhost
  connection: ansible.platform.http
  gather_facts: false
  vars:
    group_name_http_direct: "Molecule Test Group HTTP Direct"
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
    ansible_platform_use_persistent_connection: false
  tasks:
    - name: Create group (http direct)
      ansible.platform.group:
        name: "{{ group_name_http_direct }}"
        description: "Created by Molecule group_mock (http direct)"
        inventory: "1"
      register: create_result_http_direct

    - name: Assert create changed (http direct)
      ansible.builtin.assert:
        that:
          - create_result_http_direct is changed
          - create_result_http_direct.group.id is defined

    - name: Run again idempotency (http direct)
      ansible.platform.group:
        name: "{{ group_name_http_direct }}"
        description: "Created by Molecule group_mock (http direct)"
        inventory: "1"
        state: present
      register: idem_result_http_direct

    - name: Assert idempotent (http direct)
      ansible.builtin.assert:
        that: idem_result_http_direct is not changed

    - name: Update group description (http direct)
      ansible.platform.group:
        name: "{{ group_name_http_direct }}"
        description: "Updated by Molecule group_mock (http direct)"
        inventory: "1"
      register: update_result_http_direct

    - name: Assert update changed (http direct)
      ansible.builtin.assert:
        that: update_result_http_direct is changed

- name: Converge — group (mock, http persistent)
  hosts: localhost
  connection: ansible.platform.http
  gather_facts: false
  vars:
    group_name_http_persistent: "Molecule Test Group HTTP Persistent"
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
    ansible_platform_use_persistent_connection: true
  tasks:
    - name: Create group (http persistent)
      ansible.platform.group:
        name: "{{ group_name_http_persistent }}"
        description: "Created by Molecule group_mock (http persistent)"
        inventory: "1"
      register: create_result_http_persistent

    - name: Assert create changed (http persistent)
      ansible.builtin.assert:
        that:
          - create_result_http_persistent is changed
          - create_result_http_persistent.group.id is defined

    - name: Run again idempotency (http persistent)
      ansible.platform.group:
        name: "{{ group_name_http_persistent }}"
        description: "Created by Molecule group_mock (http persistent)"
        inventory: "1"
        state: present
      register: idem_result_http_persistent

    - name: Assert idempotent (http persistent)
      ansible.builtin.assert:
        that: idem_result_http_persistent is not changed

    - name: Update group description (http persistent)
      ansible.platform.group:
        name: "{{ group_name_http_persistent }}"
        description: "Updated by Molecule group_mock (http persistent)"
        inventory: "1"
      register: update_result_http_persistent

    - name: Assert update changed (http persistent)
      ansible.builtin.assert:
        that: update_result_http_persistent is changed
...
