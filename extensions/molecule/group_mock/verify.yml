---
# Verify: the group created by converge is still present.
- name: Verify — group still exists (connection local)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
    molecule_inv_name: "Molecule Test Inventory Group Local"
    molecule_group_name: "molecule-group-local"
  tasks:
    - name: Get group (state exists, connection local)
      ansible.platform.group:
        name: "{{ molecule_group_name }}"
        inventory: "{{ molecule_inv_name }}"
        state: exists
      register: exists_result_local
      vars:
        ansible_connection: local

    - name: Assert group still exists (connection local)
      ansible.builtin.assert:
        that:
          - exists_result_local is not failed
          - exists_result_local.get('exists') | default(false) | bool
        fail_msg: "Verify: group {{ molecule_group_name }} not found (connection local)."
      vars:
        ansible_connection: local
...
