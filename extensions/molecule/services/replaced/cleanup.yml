---
- name: "Cleanup — services (replaced)"
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars.yml
  tasks:
    - name: Remove int-svc-alpha (test teardown)
      ansible.platform.services:
        config:
          - name: "int-svc-alpha"
        state: deleted
        gateway_hostname: "{{ gateway_hostname }}"
        gateway_username: "{{ gateway_username }}"
        gateway_password: "{{ gateway_password }}"
        gateway_validate_certs: "{{ gateway_validate_certs }}"
      failed_when: false

...
