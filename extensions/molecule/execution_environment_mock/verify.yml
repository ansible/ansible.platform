---
- name: Verify — execution_environment (mock, connection local)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ee_name_local: "Molecule Test EE Local"
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
  tasks:
    - name: Get execution environment (state exists, connection local)
      ansible.platform.execution_environment:
        name: "{{ ee_name_local }}"
        state: exists
        gateway_hostname: "{{ gateway_hostname }}"
        gateway_username: "{{ gateway_username }}"
        gateway_password: "{{ gateway_password }}"
        gateway_validate_certs: "{{ gateway_validate_certs }}"
      register: exists_result_local
      vars:
        ansible_connection: local

    - name: Assert found (connection local)
      ansible.builtin.assert:
        that:
          - exists_result_local is not failed
          - exists_result_local.get('exists') | default(false) | bool
      vars:
        ansible_connection: local

    - name: Assert description updated (connection local)
      ansible.builtin.assert:
        that: exists_result_local.execution_environment.description == "Updated by Molecule (connection local)"
      vars:
        ansible_connection: local

- name: Verify — execution_environment (mock, http direct)
  hosts: localhost
  connection: ansible.platform.http
  gather_facts: false
  vars:
    ee_name_http_direct: "Molecule Test EE HTTP Direct"
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
    ansible_platform_use_persistent_connection: false
  tasks:
    - name: Get execution environment (state exists, http direct)
      ansible.platform.execution_environment:
        name: "{{ ee_name_http_direct }}"
        state: exists
      register: exists_result_http_direct

    - name: Assert found (http direct)
      ansible.builtin.assert:
        that:
          - exists_result_http_direct is not failed
          - exists_result_http_direct.get('exists') | default(false) | bool

- name: Verify — execution_environment (mock, http persistent)
  hosts: localhost
  connection: ansible.platform.http
  gather_facts: false
  vars:
    ee_name_http_persistent: "Molecule Test EE HTTP Persistent"
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
    ansible_platform_use_persistent_connection: true
  tasks:
    - name: Get execution environment (state exists, http persistent)
      ansible.platform.execution_environment:
        name: "{{ ee_name_http_persistent }}"
        state: exists
      register: exists_result_http_persistent

    - name: Assert found (http persistent)
      ansible.builtin.assert:
        that:
          - exists_result_http_persistent is not failed
          - exists_result_http_persistent.get('exists') | default(false) | bool
...
