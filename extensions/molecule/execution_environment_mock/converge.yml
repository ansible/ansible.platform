        fail_msg: "Create (http persistent) should report changed. create_result_http_persistent={{ create_result_http_persistent }}"

    - name: Run again idempotency (http persistent)
      ansible.platform.execution_environment:
        name: "{{ molecule_ee_name }}"
        image: "quay.io/ansible/awx-ee:latest"
      register: idem_result_http_persistent

    - name: Assert idempotent run did not change (http persistent)
      ansible.builtin.assert:
