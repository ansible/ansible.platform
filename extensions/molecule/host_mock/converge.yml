    - name: Run again idempotency (http persistent)
      ansible.platform.host:
        name: "{{ host_name_http_persistent }}"
        description: "Created by Molecule host_mock (http persistent)"
        inventory: "1"
        enabled: true
        state: present
      register: idem_result_http_persistent

    - name: Assert idempotent run did not change (http persistent)
      ansible.builtin.assert:
        that: idem_result_http_persistent is not changed

    - name: Update host description (http persistent)
      ansible.platform.host:
        name: "{{ host_name_http_persistent }}"
        description: "Updated by Molecule host_mock (http persistent)"
        inventory: "1"
