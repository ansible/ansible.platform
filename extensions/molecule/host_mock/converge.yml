---
- name: Ensure mock Gateway is reachable
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
  tasks:
    - name: Wait for mock Gateway health endpoint
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}/health"
        method: GET
        status_code: 200
      register: health
      retries: 12
      delay: 5
      until: health.status == 200
      vars:
        ansible_connection: local

    - name: Ensure /tmp/ap directory exists
      ansible.builtin.file:
        path: /tmp/ap
        state: directory
        mode: "0755"
      vars:
        ansible_connection: local

    - name: Create manager survive flag
      ansible.builtin.file:
        path: /tmp/ap/.survive
        state: touch
        mode: "0600"
      vars:
        ansible_connection: local

- name: Converge — host (mock, connection local)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    host_name_local: "Molecule Test Host Local"
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
  tasks:
    - name: Create host (connection local)
      ansible.platform.host:
        name: "{{ host_name_local }}"
        description: "Created by Molecule host_mock (connection local)"
        inventory: "1"
        enabled: true
        variables:
          ansible_host: "192.168.1.10"
      register: create_result_local
      vars:
        ansible_connection: local

    - name: Assert create changed (connection local)
      ansible.builtin.assert:
        that:
          - create_result_local is changed
          - create_result_local.host.id is defined
          - create_result_local.host.name == host_name_local
        fail_msg: "Create (local) should report changed. create_result_local={{ create_result_local }}"
      vars:
        ansible_connection: local

    - name: Assert RETURN shape
      ansible.builtin.assert:
        that:
          - "'_timing' not in create_result_local"
          - "'_timing' not in create_result_local.host"
          - "'changed' not in create_result_local.host"
          - "'state' not in create_result_local.host"
          - "'new_name' not in create_result_local.host"
        fail_msg: "RETURN shape violation. result={{ create_result_local }}"
      vars:
        ansible_connection: local

    - name: Run again idempotency (connection local)
      ansible.platform.host:
        name: "{{ host_name_local }}"
        description: "Created by Molecule host_mock (connection local)"
        inventory: "1"
        enabled: true
        variables:
          ansible_host: "192.168.1.10"
        state: present
      register: idem_result_local
      vars:
        ansible_connection: local

    - name: Assert idempotent run did not change (connection local)
      ansible.builtin.assert:
        that: idem_result_local is not changed
        fail_msg: "Idempotent run (local) should not report changed. idem_result_local={{ idem_result_local }}"
      vars:
        ansible_connection: local

    - name: Update host description (connection local)
      ansible.platform.host:
        name: "{{ host_name_local }}"
        description: "Updated by Molecule host_mock (connection local)"
        inventory: "1"
      register: update_result_local
      vars:
        ansible_connection: local

    - name: Assert update changed (connection local)
      ansible.builtin.assert:
        that: update_result_local is changed
        fail_msg: "Update (local) should report changed. update_result_local={{ update_result_local }}"
      vars:
        ansible_connection: local

- name: Converge — host (mock, http direct)
  hosts: localhost
  connection: ansible.platform.http
  gather_facts: false
  vars:
    host_name_http_direct: "Molecule Test Host HTTP Direct"
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
    ansible_platform_use_persistent_connection: false
  tasks:
    - name: Create host (http direct)
      ansible.platform.host:
        name: "{{ host_name_http_direct }}"
        description: "Created by Molecule host_mock (http direct)"
        inventory: "1"
        enabled: true
      register: create_result_http_direct

    - name: Assert create changed (http direct)
      ansible.builtin.assert:
        that:
          - create_result_http_direct is changed
          - create_result_http_direct.host.id is defined
        fail_msg: "Create (http direct) should report changed."

    - name: Run again idempotency (http direct)
      ansible.platform.host:
        name: "{{ host_name_http_direct }}"
        description: "Created by Molecule host_mock (http direct)"
        inventory: "1"
        enabled: true
        state: present
      register: idem_result_http_direct

    - name: Assert idempotent run did not change (http direct)
      ansible.builtin.assert:
        that: idem_result_http_direct is not changed

    - name: Update host description (http direct)
      ansible.platform.host:
        name: "{{ host_name_http_direct }}"
        description: "Updated by Molecule host_mock (http direct)"
        inventory: "1"
      register: update_result_http_direct

    - name: Assert update changed (http direct)
      ansible.builtin.assert:
        that: update_result_http_direct is changed

- name: Converge — host (mock, http persistent)
  hosts: localhost
