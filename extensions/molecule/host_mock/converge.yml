  vars:
    host_name_http_persistent: "Molecule Test Host HTTP Persistent"
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
    ansible_platform_use_persistent_connection: true
  tasks:
    - name: Create host (http persistent)
      ansible.platform.host:
        name: "{{ host_name_http_persistent }}"
        description: "Created by Molecule host_mock (http persistent)"
        inventory: "1"
