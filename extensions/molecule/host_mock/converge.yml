---
# Converge: host create, idempotency, update, delete against the mock Gateway/Controller.
# Play 1: health check runs on controller (connection: local); platform connection cannot run uri.
- name: Ensure mock Gateway is reachable
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
  tasks:
    - name: Wait for mock Gateway health endpoint
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}/health"
        method: GET
        status_code: 200
      register: health
      retries: 12
      delay: 5
      until: health.status == 200
      vars:
        ansible_connection: local

    - name: Ensure /tmp/ap directory exists
      ansible.builtin.file:
        path: /tmp/ap
        state: directory
        mode: "0755"
      vars:
        ansible_connection: local

    - name: Create manager survive flag (Molecule keeps manager alive across phases)
      ansible.builtin.file:
        path: /tmp/ap/.survive
        state: touch
        mode: "0600"
      vars:
        ansible_connection: local

# Play 2: full feature coverage (connection local) — create, idempotency, update, delete.
- name: Converge — host (mock, connection local)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
    molecule_org_name: "Molecule Test Org Host Local"
    molecule_inv_name: "Molecule Test Inventory Host Local"
    molecule_host_name: "molecule-host-local"
  tasks:
    - name: Create organization
      ansible.platform.organization:
        name: "{{ molecule_org_name }}"
      register: org_local
      vars:
        ansible_connection: local

    - name: Create inventory
      ansible.platform.inventory:
        name: "{{ molecule_inv_name }}"
        organization: "{{ org_local.name }}"
      register: inv_local
      vars:
        ansible_connection: local

    - name: Create host
      ansible.platform.host:
        name: "{{ molecule_host_name }}"
        inventory: "{{ inv_local.name }}"
        description: "Created by Molecule host_mock (connection local)"
        variables:
          example_var: 123
      register: create_result_local
      vars:
        ansible_connection: local

    - name: Assert create changed (connection local)
      ansible.builtin.assert:
        that:
          - create_result_local is changed
          - create_result_local.host.id is defined
          - create_result_local.host.name == molecule_host_name
        fail_msg: "Create (local) should report changed. create_result_local={{ create_result_local }}"
      vars:
        ansible_connection: local

    - name: Run again idempotency (connection local)
      ansible.platform.host:
        name: "{{ molecule_host_name }}"
        inventory: "{{ inv_local.name }}"
        description: "Created by Molecule host_mock (connection local)"
        variables:
          example_var: 123
      register: idem_result_local
      vars:
        ansible_connection: local

    - name: Assert idempotent run did not change (connection local)
      ansible.builtin.assert:
        that: idem_result_local is not changed
        fail_msg: "Idempotent run (local) should not report changed. idem_result_local={{ idem_result_local }}"
      vars:
        ansible_connection: local

    - name: Update and disable host (connection local)
      ansible.platform.host:
        name: "{{ molecule_host_name }}"
        inventory: "{{ inv_local.name }}"
        description: "Updated by Molecule host_mock (connection local)"
        enabled: false
      register: update_result_local
      vars:
        ansible_connection: local

    - name: Assert update changed (connection local)
      ansible.builtin.assert:
        that:
          - update_result_local is changed
          - update_result_local.host.enabled == false
        fail_msg: "Update (local) should report changed. update_result_local={{ update_result_local }}"
      vars:
        ansible_connection: local

# Play 3: basic CRUD parity (http direct).
