      ansible.platform.host:
        name: "{{ molecule_host_name }}"
        inventory: "{{ molecule_inv_name }}"
        state: exists
      register: exists_result_http_persistent

    - name: Assert host was found (http persistent)
      ansible.builtin.assert:
        that:
          - exists_result_http_persistent is not failed
          - exists_result_http_persistent.get('exists') | default(false) | bool
        fail_msg: "Verify: host {{ molecule_host_name }} not found (http persistent)."

    - name: Assert description updated (http persistent)
      ansible.builtin.assert:
        that: exists_result_http_persistent.host.description == "Updated by Molecule host_mock (http persistent)"
        fail_msg: "Verify: host (http persistent) description was not updated."
...
