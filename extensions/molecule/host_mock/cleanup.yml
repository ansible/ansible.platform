---
- name: Cleanup — delete host (mock, connection local)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    host_name_local: "Molecule Test Host Local"
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
  tasks:
    - name: Delete host (connection local)
      ansible.platform.host:
        name: "{{ host_name_local }}"
        inventory: "1"
        state: absent
        gateway_hostname: "{{ gateway_hostname }}"
        gateway_username: "{{ gateway_username }}"
        gateway_password: "{{ gateway_password }}"
        gateway_validate_certs: "{{ gateway_validate_certs }}"
      register: delete_result_local
      failed_when: false
      vars:
        ansible_connection: local

    - name: Assert host removed or already absent (connection local)
      ansible.builtin.assert:
        that: delete_result_local is not failed
        fail_msg: "Cleanup: failed to delete host {{ host_name_local }}."
      vars:
        ansible_connection: local

    - name: Remove manager survive flag
      ansible.builtin.file:
        path: /tmp/ap/.survive
        state: absent
      vars:
        ansible_connection: local

- name: Cleanup — delete host (mock, http direct)
  hosts: localhost
  connection: ansible.platform.http
  gather_facts: false
  vars:
    host_name_http_direct: "Molecule Test Host HTTP Direct"
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
    ansible_platform_use_persistent_connection: false
  tasks:
    - name: Delete host (http direct)
      ansible.platform.host:
        name: "{{ host_name_http_direct }}"
        inventory: "1"
        state: absent
      register: delete_result_http_direct
      failed_when: false

    - name: Assert host removed or already absent (http direct)
      ansible.builtin.assert:
        that: delete_result_http_direct is not failed

    - name: Remove manager survive flag
      ansible.builtin.file:
        path: /tmp/ap/.survive
        state: absent
      vars:
        ansible_connection: local

- name: Cleanup — delete host (mock, http persistent)
  hosts: localhost
  connection: ansible.platform.http
  gather_facts: false
  vars:
    host_name_http_persistent: "Molecule Test Host HTTP Persistent"
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
    ansible_platform_use_persistent_connection: true
  tasks:
    - name: Delete host (http persistent)
      ansible.platform.host:
        name: "{{ host_name_http_persistent }}"
        inventory: "1"
        state: absent
      register: delete_result_http_persistent
      failed_when: false

    - name: Assert host removed or already absent (http persistent)
      ansible.builtin.assert:
        that: delete_result_http_persistent is not failed

    - name: Remove manager survive flag
      ansible.builtin.file:
        path: /tmp/ap/.survive
        state: absent
      vars:
        ansible_connection: local
...
