---
- name: "Prepare — role_definitions (gathered)"
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars.yml
  tasks:
    - name: Seed role_definitions to be gathered (prerequisite for gathered)
      ansible.platform.role_definitions:
        config:
          - "{{ prepare_config }}"
        state: merged
        gateway_hostname: "{{ gateway_hostname }}"
        gateway_username: "{{ gateway_username }}"
        gateway_password: "{{ gateway_password }}"
        gateway_validate_certs: "{{ gateway_validate_certs }}"

...
