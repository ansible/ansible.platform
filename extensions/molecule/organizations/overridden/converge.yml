---
- name: "Converge — organizations (overridden)"
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars.yml
  tasks:
    - name: Run ansible.platform.organizations with state=overridden
      ansible.platform.organizations:
        config:
          - "{{ expected_config }}"
        state: overridden
        gateway_hostname: "{{ gateway_hostname }}"
        gateway_username: "{{ gateway_username }}"
        gateway_password: "{{ gateway_password }}"
        gateway_validate_certs: "{{ gateway_validate_certs }}"
      register: result

...
