---
# Verify: all three connection scenarios (local, http direct, http persistent).
- name: Verify — inventory created with connection local (mock)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
    molecule_org_name: "Molecule Test Org Inventory Local"
    molecule_inv_name: "Molecule Test Inventory Local"
  tasks:
    - name: Get inventory (state exists, connection local)
      ansible.platform.inventory:
        name: "{{ molecule_inv_name }}-Renamed"
        organization: "{{ molecule_org_name }}"
        state: exists
      register: exists_result_local
      vars:
        ansible_connection: local

    - name: Assert inventory was found (connection local)
      ansible.builtin.assert:
        that:
          - exists_result_local is not failed
          - exists_result_local.get('exists') | default(false) | bool
          - exists_result_local.get('inventory') is defined
        fail_msg: "Verify: inventory {{ molecule_inv_name }}-Renamed not found (connection local)."
      vars:
        ansible_connection: local

    - name: Assert description was updated before rename (connection local)
      ansible.builtin.assert:
        that: exists_result_local.inventory.description == "Updated by Molecule inventory_mock (connection local)"
        fail_msg: "Verify: inventory (local) description was not updated."
      vars:
        ansible_connection: local

- name: Verify — inventory created with http direct (mock)
  hosts: localhost
  connection: ansible.platform.http
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
    ansible_platform_use_persistent_connection: false
    molecule_org_name: "Molecule Test Org Inventory HTTP Direct"
    molecule_inv_name: "Molecule Test Inventory HTTP Direct"
  tasks:
    - name: Get inventory (state exists, http direct)
      ansible.platform.inventory:
        name: "{{ molecule_inv_name }}"
        organization: "{{ molecule_org_name }}"
        state: exists
      register: exists_result_http_direct

    - name: Assert inventory was found (http direct)
      ansible.builtin.assert:
        that:
          - exists_result_http_direct is not failed
          - exists_result_http_direct.get('exists') | default(false) | bool
        fail_msg: "Verify: inventory {{ molecule_inv_name }} not found (http direct)."

    - name: Assert description updated (http direct)
      ansible.builtin.assert:
        that: exists_result_http_direct.inventory.description == "Updated by Molecule inventory_mock (http direct)"
        fail_msg: "Verify: inventory (http direct) description was not updated."

- name: Verify — inventory created with http persistent (mock)
  hosts: localhost
  connection: ansible.platform.http
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
    ansible_platform_use_persistent_connection: true
    molecule_org_name: "Molecule Test Org Inventory HTTP Persistent"
    molecule_inv_name: "Molecule Test Inventory HTTP Persistent"
  tasks:
