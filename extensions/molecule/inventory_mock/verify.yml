      register: exists_result_http_persistent

    - name: Assert inventory was found (http persistent)
      ansible.builtin.assert:
        that:
          - exists_result_http_persistent is not failed
          - exists_result_http_persistent.get('exists') | default(false) | bool
        fail_msg: "Verify: inventory {{ molecule_inv_name }} not found (http persistent)."

    - name: Assert description updated (http persistent)
      ansible.builtin.assert:
        that: exists_result_http_persistent.inventory.description == "Updated by Molecule inventory_mock (http persistent)"
        fail_msg: "Verify: inventory (http persistent) description was not updated."
...
