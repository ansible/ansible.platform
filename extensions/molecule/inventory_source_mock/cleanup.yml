---
# Cleanup: delete inventory sources/inventories/organizations created by converge.
- name: Cleanup — delete inventory_source, inventory, organization (mock, connection local)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
    molecule_org_name: "Molecule Test Org InvSource Local"
    molecule_inv_name: "Molecule Test Inventory InvSource Local"
    molecule_source_name: "molecule-source-local"
  tasks:
    - name: Delete inventory source (connection local)
      ansible.platform.inventory_source:
        name: "{{ molecule_source_name }}"
        inventory: "{{ molecule_inv_name }}"
        state: absent
      register: delete_result_local
      failed_when: false
      vars:
        ansible_connection: local

    - name: Assert inventory source removed or already absent (connection local)
      ansible.builtin.assert:
        that: delete_result_local is not failed
        fail_msg: "Cleanup: failed to delete inventory source {{ molecule_source_name }}."
      vars:
        ansible_connection: local

    - name: Delete inventory (connection local)
      ansible.platform.inventory:
        name: "{{ molecule_inv_name }}"
        organization: "{{ molecule_org_name }}"
        state: absent
      failed_when: false
      vars:
        ansible_connection: local

    - name: Delete organization (connection local)
      ansible.platform.organization:
        name: "{{ molecule_org_name }}"
        state: absent
      failed_when: false
      vars:
        ansible_connection: local

    - name: Remove manager survive flag (signals manager to shut down)
      ansible.builtin.file:
        path: /tmp/ap/.survive
        state: absent
      vars:
        ansible_connection: local

