---
# Converge: inventory_source create, idempotency, update, notification_templates
# association, and delete against the mock Gateway/Controller.
- name: Ensure mock Gateway is reachable
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
  tasks:
    - name: Wait for mock Gateway health endpoint
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}/health"
        method: GET
        status_code: 200
      register: health
      retries: 12
      delay: 5
      until: health.status == 200
      vars:
        ansible_connection: local

    - name: Ensure /tmp/ap directory exists
      ansible.builtin.file:
        path: /tmp/ap
        state: directory
        mode: "0755"
      vars:
        ansible_connection: local

    - name: Create manager survive flag (Molecule keeps manager alive across phases)
      ansible.builtin.file:
        path: /tmp/ap/.survive
        state: touch
        mode: "0600"
      vars:
        ansible_connection: local

# Play 2: full feature coverage (connection local) — create, idempotency, update,
# notification_templates association, delete.
- name: Converge — inventory_source (mock, connection local)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
    molecule_org_name: "Molecule Test Org InvSource Local"
    molecule_inv_name: "Molecule Test Inventory InvSource Local"
    molecule_source_name: "molecule-source-local"
  tasks:
    - name: Create organization
      ansible.platform.organization:
        name: "{{ molecule_org_name }}"
      register: org_local
      vars:
        ansible_connection: local

    - name: Create inventory
      ansible.platform.inventory:
        name: "{{ molecule_inv_name }}"
        organization: "{{ org_local.name }}"
      register: inv_local
      vars:
        ansible_connection: local

    - name: Seed a fake notification template directly against the mock Controller
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}/api/controller/v2/notification_templates/"
        method: POST
        headers:
          Authorization: "Basic bW9jazp0ZXN0cGFzcw=="
        body_format: json
        body:
          name: "molecule-notif-local"
        status_code: 201
      register: notif_local
      vars:
        ansible_connection: local

    - name: Create inventory source
      ansible.platform.inventory_source:
        name: "{{ molecule_source_name }}"
        inventory: "{{ inv_local.name }}"
        source: scm
        source_path: "inventory.yml"
        overwrite: true
        notification_templates_started:
          - "molecule-notif-local"
      register: create_result_local
      vars:
        ansible_connection: local

    - name: Assert create changed (connection local)
      ansible.builtin.assert:
        that:
          - create_result_local is changed
          - create_result_local.inventory_source.id is defined
          - create_result_local.inventory_source.source == "scm"
        fail_msg: "Create (local) should report changed. create_result_local={{ create_result_local }}"
      vars:
        ansible_connection: local

    - name: Run again idempotency (connection local)
      ansible.platform.inventory_source:
        name: "{{ molecule_source_name }}"
        inventory: "{{ inv_local.name }}"
        source: scm
        source_path: "inventory.yml"
        overwrite: true
        notification_templates_started:
          - "molecule-notif-local"
      register: idem_result_local
      vars:
        ansible_connection: local

    - name: Assert idempotent run did not change (connection local)
      ansible.builtin.assert:
        that: idem_result_local is not changed
        fail_msg: "Idempotent run (local) should not report changed. idem_result_local={{ idem_result_local }}"
      vars:
        ansible_connection: local

    - name: Update inventory source (connection local)
      ansible.platform.inventory_source:
        name: "{{ molecule_source_name }}"
        inventory: "{{ inv_local.name }}"
        source: scm
        source_path: "inventory.yml"
        overwrite: false
        update_on_launch: true
        notification_templates_started:
          - "molecule-notif-local"
      register: update_result_local
      vars:
        ansible_connection: local

    - name: Assert update changed (connection local)
      ansible.builtin.assert:
        that:
          - update_result_local is changed
          - update_result_local.inventory_source.overwrite == false
          - update_result_local.inventory_source.update_on_launch == true
        fail_msg: "Update (local) should report changed. update_result_local={{ update_result_local }}"
      vars:
        ansible_connection: local

