        source: scm
        source_path: "inventory.yml"
        update_on_launch: true
      register: update_result_http_direct

    - name: Assert update changed (http direct)
      ansible.builtin.assert:
        that: update_result_http_direct is changed
        fail_msg: "Update (http direct) should report changed. update_result_http_direct={{ update_result_http_direct }}"

