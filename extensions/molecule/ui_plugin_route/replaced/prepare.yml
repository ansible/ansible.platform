---
- name: "Prepare — ui_plugin_route (replaced)"
  hosts: localhost
  gather_facts: false
  vars_files:
  - vars.yml
  tasks:
  - name: Seed ui_plugin_route to be replaced (prerequisite for replaced)
    ansible.platform.ui_plugin_route:
      config:
      - "{{ prepare_config }}"
      state: merged
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs }}"
