---
- name: "Cleanup — service_key (gathered)"
  hosts: localhost
  gather_facts: false
  vars_files:
  - vars.yml
  tasks:
  - name: Remove int-skey-alpha (test teardown)
    ansible.platform.service_key:
      config:
      - name: "int-skey-alpha"
      state: deleted
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs }}"
    ignore_errors: true

