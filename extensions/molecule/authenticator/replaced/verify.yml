---
- name: "Verify — authenticator (replaced)"
  hosts: localhost
  gather_facts: false
  vars_files:
  - vars.yml
  tasks:
  - name: Gather authenticator (assert present after replaced)
    ansible.platform.authenticator:
      config:
      - name: "{{ expected_config.name }}"
      state: gathered
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs }}"
    register: gathered

  - name: Assert configuration exists after replaced
    ansible.builtin.assert:
      that:
      - gathered.gathered is defined
      - gathered.gathered | length > 0
      fail_msg: "Expected resource after replaced. got: {{ gathered.gathered }}"

  - name: Assert type was updated by replaced
    ansible.builtin.assert:
      that:
      - (gathered.gathered | first).type == expected_config.type
      fail_msg: "replaced should have set type='ansible_base.authentication.authenticator_plugins.local'. got: {{ (gathered.gathered | first).type }}"
