---
- name: Ensure mock Gateway is reachable
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
  tasks:
    - name: Wait for mock Gateway health endpoint
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}/health"
        method: GET
        status_code: 200
      register: health
      retries: 12
      delay: 5
      until: health.status == 200
      vars:
        ansible_connection: local

    - name: Ensure /tmp/ap directory exists
      ansible.builtin.file:
        path: /tmp/ap
        state: directory
        mode: "0755"
      vars:
        ansible_connection: local

    - name: Create manager survive flag (Molecule keeps manager alive across phases)
      ansible.builtin.file:
        path: /tmp/ap/.survive
        state: touch
        mode: "0600"
      vars:
        ansible_connection: local

- name: Converge — decision_environment (mock, connection local)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
    de_name: "molecule-mock-decision-environment"
    de_renamed: "molecule-mock-decision-environment-renamed"
  module_defaults:
    group/ansible.platform.eda:
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs }}"
  tasks:
    - name: Create decision environment with check mode
      ansible.platform.decision_environment:
        name: "{{ de_name }}"
        image_url: "quay.io/ansible/ansible-rulebook:main"
        organization_name: "Default"
        credential: "Molecule Mock EDA Credential"
        state: present
      check_mode: true
      register: check_create

    - name: Assert check mode reports changed
      ansible.builtin.assert:
        that:
          - check_create is changed

    - name: Create decision environment
      ansible.platform.decision_environment:
        name: "{{ de_name }}"
        image_url: "quay.io/ansible/ansible-rulebook:main"
        organization_name: "Default"
        credential: "Molecule Mock EDA Credential"
        state: present
      register: create_result

    - name: Assert decision environment was created
      ansible.builtin.assert:
        that:
          - create_result is changed
          - create_result.decision_environment.id is defined

    - name: Re-create same decision environment with identical parameters (idempotency)
      ansible.platform.decision_environment:
        name: "{{ de_name }}"
        image_url: "quay.io/ansible/ansible-rulebook:main"
        organization_name: "Default"
        credential: "Molecule Mock EDA Credential"
        state: present
      register: recreate_result

    - name: Assert re-create with no actual changes reports changed=false
      ansible.builtin.assert:
        that:
          - recreate_result is not changed
          - recreate_result.decision_environment.id == create_result.decision_environment.id

    - name: Update decision environment description (real change)
      ansible.platform.decision_environment:
        name: "{{ de_name }}"
        image_url: "quay.io/ansible/ansible-rulebook:main"
        description: "Molecule mock decision environment (updated)"
        state: present
      register: update_result

    - name: Assert updating a field reports changed
      ansible.builtin.assert:
        that:
          - update_result is changed

    - name: Rename the decision environment
      ansible.platform.decision_environment:
        name: "{{ de_name }}"
        new_name: "{{ de_renamed }}"
        image_url: "quay.io/ansible/ansible-rulebook:main"
        state: present
      register: rename_result

    - name: Assert rename reports changed
      ansible.builtin.assert:
        that:
          - rename_result is changed

    - name: Delete the decision environment
      ansible.platform.decision_environment:
        name: "{{ de_renamed }}"
        state: absent
      register: delete_result

    - name: Assert delete reports changed
      ansible.builtin.assert:
        that:
          - delete_result is changed

    - name: Delete already-absent decision environment
      ansible.platform.decision_environment:
        name: "{{ de_renamed }}"
        state: absent
      register: delete_absent_result

    - name: Assert delete-absent is a no-op
      ansible.builtin.assert:
        that:
          - delete_absent_result is not changed
...
