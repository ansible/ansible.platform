---
- name: Cleanup — remove test decision environments
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
  tasks:
    - name: Delete molecule-mock-decision-environment
      ansible.platform.decision_environment:
        name: "molecule-mock-decision-environment"
        state: absent
        gateway_hostname: "{{ gateway_hostname }}"
        gateway_username: "{{ gateway_username }}"
        gateway_password: "{{ gateway_password }}"
        gateway_validate_certs: "{{ gateway_validate_certs }}"
      failed_when: false
      vars:
        ansible_connection: local

    - name: Delete molecule-mock-decision-environment-renamed
      ansible.platform.decision_environment:
        name: "molecule-mock-decision-environment-renamed"
        state: absent
        gateway_hostname: "{{ gateway_hostname }}"
        gateway_username: "{{ gateway_username }}"
        gateway_password: "{{ gateway_password }}"
        gateway_validate_certs: "{{ gateway_validate_certs }}"
      failed_when: false
      vars:
        ansible_connection: local
...
