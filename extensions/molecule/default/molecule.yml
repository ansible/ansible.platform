---
# Default scenario: manages mock Gateway server lifecycle.
# With shared_state: true in config.yml, `make molecule-test-all` runs create before the
# mock scenarios and destroy after them.
# Uses its own inventory (connection: local) so create/destroy run on controller, not via platform connection.

driver:
  name: default

platforms:
  - name: localhost

ansible:
  executor:
    args:
      ansible_playbook:
        - --inventory=${MOLECULE_SCENARIO_DIRECTORY}/inventory.yml

provisioner:
  name: ansible
  playbooks:
    create: create.yml
    destroy: destroy.yml

scenario:
  test_sequence:
    - create
    - destroy
...
