---
# Default scenario: manages mock Gateway server lifecycle.
# With shared_state: true in config.yml, make molecule-test-all starts and destroys this scenario.
# Other scenarios (e.g. users, users_mock) then share
# the same mock server and skip their own create/destroy.
# Uses its own inventory (connection: local) so create/destroy run on controller, not via platform connection.

driver:
  name: default

platforms:
  - name: localhost

ansible:
  executor:
    args:
      ansible_playbook:
        - --inventory=${MOLECULE_SCENARIO_DIRECTORY}/inventory.yml

provisioner:
  name: ansible
  playbooks:
    create: create.yml
    destroy: destroy.yml

scenario:
  test_sequence:
    - create
    - destroy
...
