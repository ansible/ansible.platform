---
- name: Verify — instance created with connection local (mock)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    instance_hostname_local: "molecule-test-exec-local.example.com"
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
  tasks:
    - name: Get instance (state exists, connection local)
      ansible.platform.instance:
        hostname: "{{ instance_hostname_local }}"
        state: exists
        gateway_hostname: "{{ gateway_hostname }}"
        gateway_username: "{{ gateway_username }}"
        gateway_password: "{{ gateway_password }}"
        gateway_validate_certs: "{{ gateway_validate_certs }}"
      register: exists_result_local
      vars:
        ansible_connection: local

    - name: Assert instance was found (connection local)
      ansible.builtin.assert:
        that:
          - exists_result_local is not failed
          - exists_result_local.get('exists') | default(false) | bool
      vars:
        ansible_connection: local

- name: Verify — instance created with http direct (mock)
  hosts: localhost
  connection: ansible.platform.http
  gather_facts: false
  vars:
    instance_hostname_http_direct: "molecule-test-exec-direct.example.com"
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
    ansible_platform_use_persistent_connection: false
  tasks:
    - name: Get instance (state exists, http direct)
      ansible.platform.instance:
        hostname: "{{ instance_hostname_http_direct }}"
        state: exists
      register: exists_result_http_direct

    - name: Assert instance was found (http direct)
      ansible.builtin.assert:
        that:
          - exists_result_http_direct is not failed
          - exists_result_http_direct.get('exists') | default(false) | bool

- name: Verify — instance created with http persistent (mock)
  hosts: localhost
  connection: ansible.platform.http
  gather_facts: false
  vars:
    instance_hostname_http_persistent: "molecule-test-exec-persistent.example.com"
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
    ansible_platform_use_persistent_connection: true
  tasks:
    - name: Get instance (state exists, http persistent)
      ansible.platform.instance:
        hostname: "{{ instance_hostname_http_persistent }}"
        state: exists
      register: exists_result_http_persistent

    - name: Assert instance was found (http persistent)
      ansible.builtin.assert:
        that:
          - exists_result_http_persistent is not failed
          - exists_result_http_persistent.get('exists') | default(false) | bool
...
