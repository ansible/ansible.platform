# Base Molecule config for ansible.platform (ANSTRAT-1640: Molecule replaces classic integration tests).
# Integration tests run against an AAP Gateway; connection vars come from inventory or env.
# See: https://ansible.readthedocs.io/projects/molecule/getting-started-collections/

ansible:
  executor:
    args:
      ansible_playbook:
        - --inventory=${MOLECULE_SCENARIO_DIRECTORY}/../inventory.yml

scenario:
  test_sequence:
    - converge
    - verify
    - idempotence
    - verify
