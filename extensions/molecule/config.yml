---
# Base Molecule config for ansible.platform (ANSTRAT-1640).
# See: https://ansible.readthedocs.io/projects/molecule/getting-started-collections/
#
# With shared_state: true, the "default" scenario is the lifecycle manager for the mock server.
# Run `make molecule-test-all` to start it before running each *_mock scenario and stop it afterward.

ansible:
  executor:
    args:
      ansible_playbook:
        - --inventory=${MOLECULE_SCENARIO_DIRECTORY}/../inventory.yml
  env:
    ANSIBLE_FORCE_COLOR: "true"
    ANSIBLE_HOST_KEY_CHECKING: "false"
    ANSIBLE_DEPRECATION_WARNINGS: "false"

scenario:
  test_sequence:
    - converge
    - verify
    - cleanup

# Share the mock server across scenarios; Makefile orchestrates the default lifecycle scenario.
shared_state: true
prerun: false

verifier:
  name: ansible
...
