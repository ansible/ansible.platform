---
- name: Verify — Controller API prefix is still being served after converge
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
    mock_auth: "Basic bW9jazptb2Nr"
  tasks:
    - name: Re-check Controller ping endpoint
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}/api/controller/v2/ping/"
        method: GET
        headers:
          Authorization: "{{ mock_auth }}"
        return_content: true
        status_code: 200
      register: controller_ping
      vars:
        ansible_connection: local

    - name: Assert Controller ping still reports a version
      ansible.builtin.assert:
        that:
          - controller_ping.json.version is defined
        fail_msg: "Verify: Controller ping should report a version. Got: {{ controller_ping.json }}"
      vars:
        ansible_connection: local
...
