---
# Scenario: verify the mock Gateway serves the Controller API prefix
# (/api/controller/vN/, distinct from /api/gateway/vN/) so Molecule scenarios
# for ported Controller/awx_collection resources have a mock to test against.
# No ansible.platform module is exercised here — this is routing-only plumbing.
driver:
  name: default

platforms:
  - name: localhost

ansible:
  executor:
    args:
      ansible_playbook:
        - --inventory=${MOLECULE_SCENARIO_DIRECTORY}/../inventory.yml

provisioner:
  name: ansible
  playbooks:
    converge: converge.yml
    verify: verify.yml
    cleanup: cleanup.yml
  config_options:
    defaults:
      collections_path: "${MOLECULE_SCENARIO_DIRECTORY}/../../../../../../"
      log_verbosity: 4

scenario:
  test_sequence:
    - converge
    - verify
    - cleanup
...
