---
- name: "Verify — service_type (replaced)"
  hosts: localhost
  gather_facts: false
  vars_files:
  - vars.yml
  tasks:
  - name: Gather service_type (assert present after replaced)
    ansible.platform.service_type:
      config:
      - name: "{{ expected_config.name }}"
      state: gathered
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs }}"
    register: gathered

  - name: Assert configuration exists after replaced
    ansible.builtin.assert:
      that:
      - gathered.gathered is defined
      - gathered.gathered | length > 0
      fail_msg: "Expected resource after replaced. got: {{ gathered.gathered }}"

  - name: Assert login_path was updated by replaced
    ansible.builtin.assert:
      that:
      - (gathered.gathered | first).login_path == expected_config.login_path
      fail_msg: "replaced should have set login_path='/login'. got: {{ (gathered.gathered | first).login_path }}"
