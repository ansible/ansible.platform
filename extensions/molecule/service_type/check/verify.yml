---
- name: "Verify — service_type (check)"
  hosts: localhost
  gather_facts: false
  vars_files:
  - vars.yml
  tasks:
  - name: Gather service_type (check mode must not have applied changes)
    ansible.platform.service_type:
      config:
      - name: "{{ expected_config.name }}"
      state: gathered
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs }}"
    register: gathered

  - name: Assert int-stype-alpha still has prepare_config values (check did not apply)
    ansible.builtin.assert:
      that:
      - gathered.gathered is defined
      - gathered.gathered | length > 0
      fail_msg: "check mode should not alter resource. got: {{ gathered.gathered }}"

