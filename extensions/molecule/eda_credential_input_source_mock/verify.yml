---
- name: Verify EDA credential input source was deleted
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_connection: local
  module_defaults:
    group/ansible.platform.eda:
      gateway_hostname: "http://127.0.0.1:8000"
      gateway_username: mock
      gateway_password: testpass
      gateway_validate_certs: false
  tasks:
    - name: Delete already absent input source
      ansible.platform.eda_credential_input_source:
        input_field_name: password
        target_credential: "1"
        source_credential: "2"
        organization_name: Default
        state: absent
      register: delete_absent_result

    - name: Assert cleanup was idempotent
      ansible.builtin.assert:
        that: delete_absent_result is not changed
...
