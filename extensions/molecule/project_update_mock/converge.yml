    - name: Assert wait launch resolved (http persistent)
      ansible.builtin.assert:
        that:
          - wait_result_http_persistent is changed
          - wait_result_http_persistent.status == "successful"
        fail_msg: "Wait launch (http persistent) should resolve to successful. wait_result_http_persistent={{ wait_result_http_persistent }}"
...
