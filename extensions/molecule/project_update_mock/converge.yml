---
# Converge: project_update launch (no wait), launch (wait), non-idempotency,
# and check_mode against the mock Gateway/Controller.
- name: Ensure mock Gateway is reachable
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
  tasks:
    - name: Wait for mock Gateway health endpoint
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}/health"
        method: GET
        status_code: 200
      register: health
      retries: 12
      delay: 5
      until: health.status == 200
      vars:
        ansible_connection: local

    - name: Ensure /tmp/ap directory exists
      ansible.builtin.file:
        path: /tmp/ap
        state: directory
        mode: "0755"
      vars:
        ansible_connection: local

    - name: Create manager survive flag (Molecule keeps manager alive across phases)
      ansible.builtin.file:
        path: /tmp/ap/.survive
        state: touch
        mode: "0600"
      vars:
        ansible_connection: local

# Play 2: full feature coverage (connection local) — launch without wait, launch with
# wait, non-idempotency, check_mode.
- name: Converge — project_update (mock, connection local)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
    molecule_project_name: "molecule-project-update-local"
  tasks:
    - name: Seed a project via a raw API call (no project module in this collection yet)
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}/api/controller/v2/projects/"
        method: POST
        headers:
          Authorization: "Basic bW9jazp0ZXN0cGFzcw=="
        body_format: json
        body:
          name: "{{ molecule_project_name }}"
        status_code: 201
      register: project_local
      vars:
        ansible_connection: local

    - name: Check mode launch (must not call the API)
      ansible.platform.project_update:
        name: "{{ molecule_project_name }}"
      check_mode: true
      register: check_mode_result_local
      vars:
        ansible_connection: local

    - name: Assert check_mode launch reports changed with no id (connection local)
      ansible.builtin.assert:
        that:
          - check_mode_result_local is changed
          - check_mode_result_local.id is none
        fail_msg: "Check mode (local) should report changed with no id. check_mode_result_local={{ check_mode_result_local }}"
      vars:
        ansible_connection: local

    - name: Launch update without waiting (connection local)
      ansible.platform.project_update:
        name: "{{ molecule_project_name }}"
        wait: false
      register: launch_result_local
      vars:
        ansible_connection: local

    - name: Assert launch changed and pending (connection local)
      ansible.builtin.assert:
        that:
          - launch_result_local is changed
          - launch_result_local.id is defined
          - launch_result_local.status == "pending"
        fail_msg: "Launch (local) should report changed and pending. launch_result_local={{ launch_result_local }}"
      vars:
        ansible_connection: local

    - name: Launch update again, waiting for completion (connection local)
      ansible.platform.project_update:
        name: "{{ molecule_project_name }}"
        interval: 0.2
        timeout: 30
      register: wait_result_local
      vars:
        ansible_connection: local

    - name: Assert wait launch resolved and is a distinct id (non-idempotent, connection local)
      ansible.builtin.assert:
        that:
          - wait_result_local is changed
          - wait_result_local.status == "successful"
          - wait_result_local.id != launch_result_local.id
        fail_msg: "Wait launch (local) should resolve to successful with a new id. wait_result_local={{ wait_result_local }}"
      vars:
        ansible_connection: local

# Play 3: connection-mode parity (http direct) — launch with wait.
- name: Converge — project_update (mock, http direct)
  hosts: localhost
  connection: ansible.platform.http
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
    ansible_platform_use_persistent_connection: false
    molecule_project_name: "molecule-project-update-http-direct"
  tasks:
    - name: Seed a project via a raw API call (http direct)
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}/api/controller/v2/projects/"
        method: POST
        headers:
          Authorization: "Basic bW9jazp0ZXN0cGFzcw=="
        body_format: json
        body:
          name: "{{ molecule_project_name }}"
        status_code: 201
      register: project_http_direct

    - name: Launch update, waiting for completion (http direct)
      ansible.platform.project_update:
        name: "{{ molecule_project_name }}"
        interval: 0.2
        timeout: 30
      register: wait_result_http_direct

    - name: Assert wait launch resolved (http direct)
      ansible.builtin.assert:
        that:
          - wait_result_http_direct is changed
          - wait_result_http_direct.status == "successful"
        fail_msg: "Wait launch (http direct) should resolve to successful. wait_result_http_direct={{ wait_result_http_direct }}"

# Play 4: connection-mode parity (http persistent) — launch with wait.
- name: Converge — project_update (mock, http persistent)
  hosts: localhost
  connection: ansible.platform.http
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
    ansible_platform_use_persistent_connection: true
    molecule_project_name: "molecule-project-update-http-persistent"
  tasks:
    - name: Seed a project via a raw API call (http persistent)
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}/api/controller/v2/projects/"
        method: POST
        headers:
          Authorization: "Basic bW9jazp0ZXN0cGFzcw=="
        body_format: json
