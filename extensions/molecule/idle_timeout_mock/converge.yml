---
# Converge: spawn persistent manager, then assert it exits after idle_timeout and removes its socket.

- name: Ensure mock Gateway is reachable
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
  tasks:
    - name: Wait for mock Gateway health endpoint
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}/health"
        method: GET
        status_code: 200
      register: health
      retries: 12
      delay: 5
      until: health.status == 200
      vars:
        ansible_connection: local

- name: Converge — idle timeout (mock, http persistent)
  hosts: localhost
  connection: ansible.platform.http
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "testpass"
    gateway_validate_certs: false
    ansible_platform_use_persistent_connection: true
    gateway_idle_timeout: 3
    manager_socket_dir: "/tmp/ansible_platform"

  tasks:
    - name: Trigger manager activity (state exists is non-fatal)
      ansible.platform.user:
        username: "idle-timeout-molecule-user"
        state: exists
      register: exists_result

    - name: Assert module call succeeded
      ansible.builtin.assert:
        that:
          - exists_result is not failed
        fail_msg: "Expected state:exists to succeed. result={{ exists_result }}"

    - name: Get uid
      ansible.builtin.command: id -u
      register: uid
      changed_when: false

    - name: Find manager socket for localhost + current uid
      ansible.builtin.find:
        paths: "{{ manager_socket_dir }}"
        patterns:
          - "manager_{{ uid.stdout }}_localhost_*.sock"
        file_type: file
      register: sock_find

    - name: Assert a manager socket was created
      ansible.builtin.assert:
        that:
          - sock_find.files | length > 0
        fail_msg: "Expected a manager socket in {{ manager_socket_dir }}. found={{ sock_find }}"

    - name: Record socket path
      ansible.builtin.set_fact:
        manager_socket_path: "{{ (sock_find.files | sort(attribute='mtime'))[-1].path }}"
        manager_meta_path: "{{ (sock_find.files | sort(attribute='mtime'))[-1].path }}.meta"

    - name: Wait past idle_timeout (poll=2s in scenario molecule.yml)
      ansible.builtin.pause:
        seconds: 8

    - name: Assert socket removed after idle shutdown
      ansible.builtin.wait_for:
        path: "{{ manager_socket_path }}"
        state: absent
        timeout: 30

    - name: Assert meta removed after idle shutdown
      ansible.builtin.wait_for:
        path: "{{ manager_meta_path }}"
        state: absent
        timeout: 30
...
