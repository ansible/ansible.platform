---
# Clean up test users from mock (direct, persistent, local).
- name: Cleanup — delete test user (mock, direct mode)
  hosts: localhost
  connection: ansible.platform.http
  gather_facts: false
  vars:
    molecule_user: "molecule-mock-user-direct"
    ansible_platform_persistent: false
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "mock"
    gateway_validate_certs: false
  tasks:
    - name: Delete test user (direct mode)
      ansible.platform.user:
        username: "{{ molecule_user }}"
        state: absent
        gateway_hostname: "{{ gateway_hostname }}"
        gateway_username: "{{ gateway_username }}"
        gateway_password: "{{ gateway_password }}"
        gateway_validate_certs: "{{ gateway_validate_certs }}"
      register: delete_result
      failed_when: false
      vars:
        ansible_connection: ansible.platform.http
        ansible_platform_persistent: false

    - name: Assert user removed or already absent (direct)
      ansible.builtin.assert:
        that: delete_result is not failed
        fail_msg: "Cleanup: failed to delete user {{ molecule_user }}."
      vars:
        ansible_connection: local

