---
# Verify: gather user from mock and assert it exists.
- name: Verify — user in expected state (mock)
  hosts: localhost
  gather_facts: false
  vars:
    molecule_user: "molecule-mock-user"
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "mock"
    gateway_validate_certs: false
  tasks:
    - name: Gather user
      ansible.platform.user:
        username: "{{ molecule_user }}"
        state: gathered
      register: gathered
      failed_when: false

    - name: Assert user was found
      ansible.builtin.assert:
        that:
          - gathered is not failed
          - gathered.get('before') is defined or gathered.get('users') is defined
        fail_msg: "Verify: could not gather user {{ molecule_user }} (mock unreachable or user missing)."
