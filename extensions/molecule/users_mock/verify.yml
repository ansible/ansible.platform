---
# Verify: user exists and has expected state (mock).
- name: Verify — user in expected state (mock)
  hosts: localhost
  gather_facts: false
  vars:
    molecule_user: "molecule-mock-user"
    gateway_hostname: "http://127.0.0.1:8000"
    gateway_username: "mock"
    gateway_password: "mock"
    gateway_validate_certs: false
  tasks:
    - name: Get user (state exists)
      ansible.platform.user:
        username: "{{ molecule_user }}"
        state: exists
      register: exists_result

    - name: Assert user was found
      ansible.builtin.assert:
        that:
          - exists_result is not failed
          - exists_result.get('exists') | default(false) | bool
          - exists_result.get('user') is defined
        fail_msg: "Verify: could not find user {{ molecule_user }} (mock unreachable or user missing)."
...
