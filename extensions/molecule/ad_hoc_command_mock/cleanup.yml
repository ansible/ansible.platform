---
- name: Cleanup — ad_hoc_command (no cleanup needed, commands are ephemeral)
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Remove manager survive flag (signals manager to shut down)
      ansible.builtin.file:
        path: /tmp/ap/.survive
        state: absent
      vars:
        ansible_connection: local
...
