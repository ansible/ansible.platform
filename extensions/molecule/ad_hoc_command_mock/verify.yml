---
- name: Verify — ad hoc commands were created on mock server
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gateway_hostname: "http://127.0.0.1:8000"
    mock_auth: "Basic bW9jazptb2Nr"
  tasks:
    - name: List ad hoc commands from mock Gateway API
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}/api/gateway/v1/ad_hoc_commands/"
        method: GET
        headers:
          Authorization: "{{ mock_auth }}"
        return_content: true
        status_code: 200
      register: commands_check
      vars:
        ansible_connection: local

    - name: Assert at least 4 commands were created (converge creates 4)
      ansible.builtin.assert:
        that:
          - commands_check.json.count >= 4
        fail_msg: >-
          Verify: expected at least 4 ad hoc commands.
          Got: {{ commands_check.json.count }}
      vars:
        ansible_connection: local
...
