---
- name: Generate a test ID
  ansible.builtin.set_fact:
    test_id: "{{ lookup('password', '/dev/null chars=ascii_letters length=16') }}"
  when: test_id is not defined

- name: Preset vars
  ansible.builtin.set_fact:
    organization_name: "GW-Collection-Test-Organization-{{ test_id }}"

- name: Run Tests
  module_defaults:
    group/ansible.platform.gateway:
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs | bool }}"

  block:
    # <Organizations> -------------------
    - name: Create an organization with check mode
      ansible.platform.organization:
        name: "{{ organization_name }}"
      check_mode: true

    - name: Search for the organization
      ansible.builtin.set_fact:
        item_that_should_not_exist: "{{ lookup('ansible.platform.gateway_api', 'organizations',
          query_params={'name': '{{ organization_name }}'}, **connection_info) }}"

    - name: Assert that organization does not exist
      ansible.builtin.assert:
        that:
          - item_that_should_not_exist is not defined or item_that_should_not_exist | length == 0
        fail_msg: "organization '{{ organization_name }}' exists in the system!"

    - name: Create Organizations
      ansible.platform.organization:
        name: "{{ organization_name }}"
      register: org

    - name: Assert a creation changes the system
      ansible.builtin.assert:
        that:
          - org is changed

    - name: Recreate an organization
      ansible.platform.organization:
        name: "{{ organization_name }}"
        state: exists
      register: recreate_org

    - name: Assert that a recreate does not change the system
      ansible.builtin.assert:
        that:
          - recreate_org is not changed

    - name: Alter an existing organization by ID
      ansible.platform.organization:
        name: "{{ org.id }}"
        description: "Some Organization"
      register: org_change

    - name: Assert that an org change changes the system
      ansible.builtin.assert:
        that:
          - org_change is changed

    - name: Rename an organization
      ansible.platform.organization:
        name: "{{ organization_name }}"
        new_name: "new-{{ organization_name }}"
      register: rename_org

    - name: Assert the rename of an org changes the existing item
      ansible.builtin.assert:
        that:
          - rename_org is changed
          - org.id == rename_org.id

    - name: Delete a non-existent organization
      ansible.platform.organization:
        name: "{{ organization_name }}"
        state: absent
      register: org_delete

    - name: Assert that the deletion of a non-existent org does not fail or change the system
      ansible.builtin.assert:
        that:
          org_delete is not changed

    - name: Delete an org
      ansible.platform.organization:
        name: "{{ org.id }}"
        state: absent
      register: org_delete

    - name: Assert that the deletion of a valid or changes the system
      ansible.builtin.assert:
        that:
          - org_delete is changed

    # <Controller Organization Overlays> ---
    - name: Read the Default Controller organization
      ansible.builtin.set_fact:
        default_controller_org: >-
          {{ query('ansible.platform.platform_api', '/api/controller/v2/organizations/',
                   query_params={'name': 'Default'}, expect_one=true, **connection_info) | first }}

    - name: Save the Default Controller organization settings and associations
      ansible.builtin.set_fact:
        default_controller_org_original:
          settings:
            max_hosts: "{{ default_controller_org.max_hosts }}"
            default_environment: "{{ default_controller_org.default_environment }}"
          associations:
            galaxy_credentials: >-
              {{ query('ansible.platform.platform_api', default_controller_org_path ~ 'galaxy_credentials/',
                       return_all=true, return_ids=true, **connection_info) }}
            instance_groups: >-
              {{ query('ansible.platform.platform_api', default_controller_org_path ~ 'instance_groups/',
                       return_all=true, return_ids=true, **connection_info) }}
      vars:
        default_controller_org_path: "/api/controller/v2/organizations/{{ default_controller_org.id }}/"

    - name: Apply Controller organization settings
      ansible.platform.organization:
        name: Default
        max_hosts: 100
        default_environment: Default execution environment
        galaxy_credentials:
          - Ansible Galaxy
        instance_groups:
          - default
        state: present
      register: controller_org_settings

    - name: Reapply Controller organization settings idempotently
      ansible.platform.organization:
        name: Default
        max_hosts: 100
        default_environment: Default execution environment
        galaxy_credentials:
          - Ansible Galaxy
        instance_groups:
          - default
        state: present
      register: controller_org_settings_repeat

    - name: Verify Controller organization settings idempotency
      ansible.builtin.assert:
        that:
          - not controller_org_settings_repeat.changed

    # </Controller Organization Overlays> ---

    # </Organizations> ------------------

  # <Cleanup>
  always:
    - name: Restore Default and clean up test organizations
      block:
        - name: Restore the Default Controller organization
          when: default_controller_org_original is defined
          vars:
            default_controller_org_url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/controller/v2/organizations/{{ default_controller_org.id }}/"
          module_defaults:
            ansible.builtin.uri:
              user: "{{ gateway_username }}"
              password: "{{ gateway_password }}"
              force_basic_auth: true
              validate_certs: "{{ gateway_validate_certs | bool }}"
              body_format: json
          block:
            - name: Restore original Controller organization settings
              ansible.builtin.uri:
                url: "{{ default_controller_org_url }}"
                method: PATCH
                body: "{{ default_controller_org_original.settings }}"
              delegate_to: localhost

            # These associations are ordered. Reattach in the original API order.
            - name: Clear test associations before restoring their original order
              ansible.platform.organization:
                name: Default
                galaxy_credentials: []
                instance_groups: []

            - name: Restore original Controller organization associations in order
              ansible.builtin.uri:
                url: "{{ default_controller_org_url }}{{ item.0.key }}/"
                method: POST
                body:
                  id: "{{ item.1 | int }}"
                  associate: true
                status_code: 204
              loop: "{{ default_controller_org_original.associations | default({}) | dict2items | subelements('value') }}"
              delegate_to: localhost
      always:
        - name: Delete Organizations
          ansible.platform.organization:
            name: "{{ item }}"
            state: absent
          when: "item in vars and 'id' in vars[item]"
          loop:
            - "org"
...
