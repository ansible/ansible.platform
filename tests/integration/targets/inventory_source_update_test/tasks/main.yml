---
- name: Generate a test ID
  ansible.builtin.set_fact:
    test_id: "{{ lookup('password', '/dev/null chars=ascii_letters length=16') }}"
  when: test_id is not defined

- name: Preset vars
  ansible.builtin.set_fact:
    name_prefix: "AAP-Collection-Test-InvSrcUpdate-{{ test_id }}"

- name: Run Test
  module_defaults:
    group/ansible.platform.gateway:
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs | bool }}"

  block:
    - name: Create Organization
      ansible.platform.organization:
        name: "{{ name_prefix }}-Organization"
      register: org1

    - name: Create Inventory
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Inventory"
        organization: "{{ org1.name }}"
      register: inv1

    - name: Create inventory source
      ansible.platform.inventory_source:
        name: "{{ name_prefix }}-Test-Source"
        inventory: "{{ inv1.name }}"
        source: scm
        source_path: "inventory.yml"
      register: source1

    - name: Check mode launch (must not actually launch)
      ansible.platform.inventory_source_update:
        name: "{{ name_prefix }}-Test-Source"
        inventory: "{{ inv1.name }}"
      check_mode: true
      register: check_mode_result

    - name: Assert check mode reports changed with no id
      ansible.builtin.assert:
        that:
          - check_mode_result is changed
          - check_mode_result.id is none

    - name: Launch an inventory source update, waiting for completion
      ansible.platform.inventory_source_update:
        name: "{{ name_prefix }}-Test-Source"
        inventory: "{{ inv1.name }}"
        wait: true
        interval: 1
        timeout: 120
      register: launch_result

    - name: Assert the update launched and completed
      ansible.builtin.assert:
        that:
          - launch_result is changed
          - launch_result.id is defined
          - launch_result.status in ("successful", "failed", "error", "canceled")

    - name: Launch again without waiting (non-idempotent — always launches)
      ansible.platform.inventory_source_update:
        name: "{{ name_prefix }}-Test-Source"
        inventory: "{{ inv1.name }}"
      register: launch_result_again

    - name: Assert the second launch is a distinct update
      ansible.builtin.assert:
        that:
          - launch_result_again is changed
          - launch_result_again.id != launch_result.id

  always:
    - name: Delete Inventory Source
      ansible.platform.inventory_source:
        name: "{{ name_prefix }}-Test-Source"
        inventory: "{{ inv1.name }}"
        state: absent
      when: inv1 is defined and "id" in inv1

    - name: Delete Inventory
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Inventory"
        organization: "{{ org1.name }}"
        state: absent
      when: org1 is defined and "id" in org1

    - name: Delete Organization
      ansible.platform.organization:
        name: "{{ org1.name }}"
        state: absent
      when: org1 is defined and "id" in org1
...
