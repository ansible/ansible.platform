---
- set_fact:
    test_id: "{{ lookup('password', '/dev/null chars=ascii_letters length=16') }}"
  when: test_id is not defined

- set_fact:
    name_prefix: "AAP-Collection-Test-AHCW-{{ test_id }}"

- name: Create a test inventory for ad hoc command wait
  ansible.builtin.uri:
    url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/controller/v2/inventories/"
    method: POST
    user: "{{ gateway_username }}"
    password: "{{ gateway_password }}"
    force_basic_auth: true
    validate_certs: "{{ gateway_validate_certs | bool }}"
    body_format: json
    body:
      name: "{{ name_prefix }}-Inventory"
      organization: 1
    status_code: [201]
  register: test_inventory
  delegate_to: localhost

- name: Add localhost to the inventory
  ansible.builtin.uri:
    url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/controller/v2/inventories/{{ test_inventory.json.id }}/hosts/"
    method: POST
    user: "{{ gateway_username }}"
    password: "{{ gateway_password }}"
    force_basic_auth: true
    validate_certs: "{{ gateway_validate_certs | bool }}"
    body_format: json
    body:
      name: "localhost"
      variables: '{"ansible_connection": "local"}'
    status_code: [201]
  delegate_to: localhost

- name: Look up Demo Credential
  ansible.builtin.uri:
    url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/controller/v2/credentials/?name=Demo+Credential"
    method: GET
    user: "{{ gateway_username }}"
    password: "{{ gateway_password }}"
    force_basic_auth: true
    validate_certs: "{{ gateway_validate_certs | bool }}"
    status_code: [200]
  register: demo_credential
  delegate_to: localhost

- name: Launch an ad hoc command without waiting
  ansible.builtin.uri:
    url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/controller/v2/ad_hoc_commands/"
    method: POST
    user: "{{ gateway_username }}"
    password: "{{ gateway_password }}"
    force_basic_auth: true
    validate_certs: "{{ gateway_validate_certs | bool }}"
    body_format: json
    body:
      inventory: "{{ test_inventory.json.id }}"
      credential: "{{ demo_credential.json.results[0].id }}"
      module_name: "ping"
    status_code: [201]
  register: launched_cmd
  delegate_to: localhost

- name: Wait for the ad hoc command to complete
  ansible.platform.ad_hoc_command_wait:
    command_id: "{{ launched_cmd.json.id }}"
    timeout: 60
    interval: 2
  register: wait_result

- name: Assert wait returned status and ID
  ansible.builtin.assert:
    that:
      - wait_result is not failed
      - wait_result.id | int == launched_cmd.json.id | int
      - wait_result.status is defined

- name: Wait for an already-finished command (idempotent)
  ansible.platform.ad_hoc_command_wait:
    command_id: "{{ launched_cmd.json.id }}"
    timeout: 10
    interval: 1
  register: rewait_result

- name: Assert re-wait succeeded immediately
  ansible.builtin.assert:
    that:
      - rewait_result is not failed
      - rewait_result.status is defined

- name: Clean up test inventory
  ansible.builtin.uri:
    url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/controller/v2/inventories/{{ test_inventory.json.id }}/"
    method: DELETE
    user: "{{ gateway_username }}"
    password: "{{ gateway_password }}"
    force_basic_auth: true
    validate_certs: "{{ gateway_validate_certs | bool }}"
    status_code: [202, 204]
  delegate_to: localhost
...
