---
- name: Generate a test ID
  ansible.builtin.set_fact:
    test_id: "{{ lookup('password', '/dev/null chars=ascii_letters length=16') }}"
  when: test_id is not defined

- name: Preset vars
  ansible.builtin.set_fact:
    gateway_user_default_password: "change-me"
    name_prefix: "{{ name_prefix }}"
    plugin_name: "ansible.platform.gateway_api"
    org2_description: "{{ name_prefix }}-Org-2-Description"
  vars:
    name_prefix: "GW-Collection-Test-Lookup-{{ test_id }}"


- name: Run Test
  module_defaults:
    group/ansible.platform.gateway:
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs | bool }}"

  block:
    - name: Create user 1
      ansible.platform.user:
        username: "{{ name_prefix }}-User-1"
      register: user1

    - name: Create user 2
      ansible.platform.user:
        username: "{{ name_prefix }}-User-2"
        password: "{{ gateway_user_default_password }}"
      register: user2

    - name: Create admin user
      ansible.platform.user:
        username: "{{ name_prefix }}-Admin-1"
        is_superuser: true
      register: admin1

    - name: Create org1
      ansible.platform.organization:
        name: "{{ name_prefix }}-Org-1"
      register: org1

    - name: Create org2
      ansible.platform.organization:
        name: "{{ name_prefix }}-Org-2"
        description: "{{ org2_description }}"
      register: org2

    - name: Make user 2 admin of org1
      ansible.platform.role_user_assignment:
        role_definition: Organization Admin
        user: "{{ user2.user.id }}"
        object_id: "{{ org1.organization.id }}"

    - name: Make admin user admin of org1
      ansible.platform.role_user_assignment:
        role_definition: Organization Admin
        user: "{{ admin1.user.id }}"
        object_id: "{{ org1.organization.id }}"

    # Baseline: count manager processes already running (persistent managers from
    # the action module tasks above stay alive until play_end and must not skew
    # the assertion below).
    - name: Count manager_process.py subprocesses before lookups (baseline)
      ansible.builtin.shell: |
        pgrep -c -f manager_process[.]py || echo 0
      register: manager_proc_baseline
      changed_when: false

    - name: Use lookup plugin to query created objects
      ansible.builtin.set_fact:
        _org2: >-
          {{ lookup(plugin_name, 'organizations',
                query_params={'description': org2_description},
                **connection_info) }}
        _users: >-
          {{ query(plugin_name, 'users',
               query_params={'username__startswith': name_prefix, 'order_by': 'username'},
               **connection_info) | list }}
        _admins: >-
          {{ query(plugin_name, 'organizations/' ~ (org1.organization.id | string) ~ '/admins/',
               query_params=admins_query, **connection_info) | list }}
      vars:
        admins_query:
          username__startswith: "{{ name_prefix }}"
          order_by: 'username'

    - name: Check Org 2
      ansible.builtin.assert:
        that:
          - _org2.name == org2.organization.name
          - _org2.id == org2.organization.id

    - name: Check all Users
      ansible.builtin.assert:
        that:
          - _users | length == 3
          - _users[0].username == admin1.user.username
          - _users[1].username == user1.user.username
          - _users[2].username == user2.user.username

    - name: Check Org-1 Admins
      ansible.builtin.assert:
        that:
          - _admins | length == 2
          - _admins[0].username == admin1.user.username
          - _admins[0].password == "Password Disabled"
          - _admins[1].username == user2.user.username
          - _admins[1].password == "$encrypted$"

    - name: Expect One - Get 0
      ansible.builtin.set_fact:
        _users: "{{ lookup(plugin_name, 'users', query_params={'username': name_prefix + '-NonExisting-1'}, expect_one=true, **connection_info) }}"
      ignore_errors: true
      register: expect_one

    - name: Assert we failed with a proper message
      ansible.builtin.assert:
        that:
          - expect_one is failed
          - "'Expected one object from endpoint users, but obtained 0 from API' in expect_one.msg"

    - name: Expect One - Get 3
      ansible.builtin.set_fact:
        _users: "{{ lookup(plugin_name, 'users', query_params={'username__startswith': name_prefix}, expect_one=true, **connection_info) }}"
      ignore_errors: true
      register: expect_one

    - name: Assert we failed with a proper message
      ansible.builtin.assert:
        that:
          - expect_one is failed
          - "'Expected one object from endpoint users, but obtained 3 from API' in expect_one.msg"

    # Verify ephemeral manager processes spawned by gateway_api lookups are
    # cleaned up immediately after each call (not left running until play end).
    # Compared against the baseline taken before the lookups so that persistent
    # managers from the action module tasks above don't produce false positives.
    - name: Count manager_process.py subprocesses after lookups
      ansible.builtin.shell: |
        pgrep -c -f manager_process[.]py || echo 0
      register: manager_proc_count
      changed_when: false

    - name: Assert no new manager processes are lingering after lookups
      ansible.builtin.assert:
        that:
          - manager_proc_count.stdout | trim | int <= manager_proc_baseline.stdout | trim | int
        fail_msg: >-
          {{ manager_proc_count.stdout | trim | int - manager_proc_baseline.stdout | trim | int }}
          new manager_process.py subprocess(es) still running after all lookup
          tasks completed (baseline={{ manager_proc_baseline.stdout | trim }},
          after={{ manager_proc_count.stdout | trim }}) — ephemeral manager
          cleanup is broken.
        success_msg: >-
          Ephemeral manager processes cleaned up successfully
          (baseline={{ manager_proc_baseline.stdout | trim }},
          after={{ manager_proc_count.stdout | trim }}).

  always:
    # <Cleanup>
    - name: Delete Organizations
      ansible.platform.organization:
        state: absent
        name: "{{ vars[item].organization.id }}"
      loop:
        - "org1"
        - "org2"
      when: "item in vars and vars[item].organization is defined and 'id' in vars[item].organization"

    - name: Delete Users
      ansible.platform.user:
        state: absent
        username: "{{ vars[item].user.id }}"
      loop:
        - "user1"
        - "user2"
        - "admin1"
      when: "item in vars and vars[item].user is defined and 'id' in vars[item].user"
...
