---
- set_fact:
    test_id: "{{ lookup('password', '/dev/null chars=ascii_letters length=16') }}"
  when: test_id is not defined

- set_fact:
    name_prefix: "AAP-Collection-Test-BHD-{{ test_id }}"

- name: Create a test inventory for bulk host delete
  ansible.builtin.uri:
    url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/controller/v2/inventories/"
    method: POST
    user: "{{ gateway_username }}"
    password: "{{ gateway_password }}"
    force_basic_auth: true
    validate_certs: "{{ gateway_validate_certs | bool }}"
    body_format: json
    body:
      name: "{{ name_prefix }}-Inventory"
      organization: 1
    status_code: [201]
  register: test_inventory
  delegate_to: localhost

- name: Create test hosts for bulk deletion
  ansible.builtin.uri:
    url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/controller/v2/hosts/"
    method: POST
    user: "{{ gateway_username }}"
    password: "{{ gateway_password }}"
    force_basic_auth: true
    validate_certs: "{{ gateway_validate_certs | bool }}"
    body_format: json
    body:
      name: "{{ name_prefix }}-host-{{ item }}"
      inventory: "{{ test_inventory.json.id }}"
    status_code: [201]
  register: created_hosts
  delegate_to: localhost
  loop:
    - 1
    - 2
    - 3

- name: Bulk delete the test hosts
  ansible.platform.bulk_host_delete:
    hosts:
      - "{{ created_hosts.results[0].json.id }}"
      - "{{ created_hosts.results[1].json.id }}"
      - "{{ created_hosts.results[2].json.id }}"
  register: delete_result

- name: Assert bulk delete succeeded
  ansible.builtin.assert:
    that:
      - delete_result is not failed
      - delete_result.changed

- name: Verify hosts no longer exist
  ansible.builtin.uri:
    url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/controller/v2/hosts/{{ item.json.id }}/"
    method: GET
    user: "{{ gateway_username }}"
    password: "{{ gateway_password }}"
    force_basic_auth: true
    validate_certs: "{{ gateway_validate_certs | bool }}"
    status_code: [404]
  delegate_to: localhost
  loop: "{{ created_hosts.results }}"

- name: Clean up test inventory
  ansible.builtin.uri:
    url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/controller/v2/inventories/{{ test_inventory.json.id }}/"
    method: DELETE
    user: "{{ gateway_username }}"
    password: "{{ gateway_password }}"
    force_basic_auth: true
    validate_certs: "{{ gateway_validate_certs | bool }}"
    status_code: [202, 204]
  delegate_to: localhost
...
