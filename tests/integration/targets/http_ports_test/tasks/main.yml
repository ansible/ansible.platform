---
- name: Generate a test ID
  ansible.builtin.set_fact:
    test_id: "{{ lookup('password', '/dev/null chars=ascii_letters length=16') }}"
  when: test_id is not defined

- name: Run Test
  module_defaults:
    group/ansible.platform.gateway:
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs | bool }}"

  block:
    - name: Create http port 1 with check mode
      ansible.platform.http_port:
        name: "{{ test_id }}-Port-65531"
        number: 65531
        use_https: false
      check_mode: true

    - name: Search for http port 1
      ansible.builtin.set_fact:
        item_that_should_not_exist: "{{ lookup('ansible.platform.gateway_api', 'http_ports',
          query_params={'name': '{{ test_id }}-Port-65531'}, **connection_info) }}"

    - name: Assert that http port 1 does not exist
      ansible.builtin.assert:
        that:
          - item_that_should_not_exist is not defined or item_that_should_not_exist | length == 0
        fail_msg: "http port '{{ test_id }}-Port-65531' exists in the system!"

    - name: Create http port 1
      ansible.platform.http_port:
        name: "{{ test_id }}-Port-65530"
        number: 65530
        use_https: false
      register: http_port1

    - name: Validate we created the port
      ansible.builtin.assert:
        that:
          - http_port1 is changed

    - name: Recreate http port 1
      ansible.platform.http_port:
        name: "{{ test_id }}-Port-65530"
        number: 65530
        use_https: false
      register: recreate_http_port1

    - name: Validate we created the port
      ansible.builtin.assert:
        that:
          - recreate_http_port1 is not changed

    - name: Create http port 2
      ansible.platform.http_port:
        name: "{{ test_id }}-Port-65531"
        number: 65531
        state: present
      register: http_port2

    - name: Validate we created the port
      ansible.builtin.assert:
        that:
          - http_port2 is changed

    - name: Create http port 3
      ansible.platform.http_port:
        name: "{{ test_id }}-Port-65532"
        number: 65532
        use_https: true
      register: http_port3

    - name: Validate we created the port
      ansible.builtin.assert:
        that:
          - http_port3 is changed

    - name: Create http port 4
      ansible.platform.http_port:
        name: "{{ test_id }}-Port-65533"
        number: 65533
      register: http_port4

    - name: Validate we created the port
      ansible.builtin.assert:
        that:
          - http_port4 is changed

    - name: Check existence of a port
      ansible.platform.http_port:
        name: "{{  http_port2.name }}"
        state: exists
      register: exists_http_port2

    - name: Validate that exists does not change the system
      ansible.builtin.assert:
        that:
          - exists_http_port2 is not changed

    - name: Change a port
      ansible.platform.http_port:
        name: "{{ http_port3.id }}"
        use_https: false
      register: change_http_port3

    - name: Validate that we did change an existing port
      ansible.builtin.assert:
        that:
          - change_http_port3 is changed
          - change_http_port3.id == http_port3.id

    - name: Rename a port
      ansible.platform.http_port:
        name: "{{ http_port4.id }}"
        new_name: "{{ http_port4.name }}-New"
      register: rename_http_port4

    - name: Validate that a rename changed an existing http port
      ansible.builtin.assert:
        that:
          - rename_http_port4 is changed
          - rename_http_port4.id == http_port4.id

    - name: Delete a non-existent port
      ansible.platform.http_port:
        name: "{{ test_id }}-Port-DNE"
        state: absent
      register: delete

    - name: Assert that delete of non-existent port does not change the system
      ansible.builtin.assert:
        that:
          - delete is not changed

    - name: Delete an existing http port
      ansible.platform.http_port:
        name: "{{ http_port1.id }}"
        state: absent
      register: delete

    - name: Assert delete of existing http_port changes the system
      ansible.builtin.assert:
        that:
          - delete is changed

    - name: Find existing API port
      ansible.builtin.set_fact:
        existing_api_ports: >-
          {{ query('ansible.platform.gateway_api', 'http_ports',
             query_params={'is_api_port': 'true'}, **connection_info) }}

    - name: Create an API port if none exists
      ansible.platform.http_port:
        name: "{{ test_id }}-API-Port-Initial"
        number: 44300
        use_https: true
        is_api_port: true
      register: initial_api_port
      when: existing_api_ports | length == 0

    - name: Set API port name for subsequent tests
      ansible.builtin.set_fact:
        api_port_name: >-
          {{ existing_api_ports[0].name if existing_api_ports | length > 0
             else initial_api_port.name }}

    - name: Try to create a duplicate API port
      ansible.platform.http_port:
        name: "{{ test_id }}-API-Port"
        number: 44301
        use_https: true
        is_api_port: true
      ignore_errors: true
      register: duplicate_api_port_result

    - name: Assert creating a duplicate API port fails
      ansible.builtin.assert:
        that:
          - duplicate_api_port_result is failed

    - name: Try to delete the existing API port
      ansible.platform.http_port:
        name: "{{ api_port_name }}"
        state: absent
      ignore_errors: true
      register: delete_api_port_result

    - name: Assert deleting an API port fails
      ansible.builtin.assert:
        that:
          - delete_api_port_result is failed

    - name: Try to unset is_api_port on existing API port
      ansible.platform.http_port:
        name: "{{ api_port_name }}"
        is_api_port: false
      ignore_errors: true
      register: unset_api_port_result

    - name: Assert unsetting is_api_port fails
      ansible.builtin.assert:
        that:
          - unset_api_port_result is failed

  always:
    - name: Delete http ports
      ansible.platform.http_port:
        state: absent
        name: "{{ vars[item].id }}"
      when: "item in vars and 'id' in vars[item]"
      loop:
        - "http_port1"
        - "http_port2"
        - "http_port3"
        - "http_port4"

    - name: Delete duplicate API port
      ansible.platform.http_port:
        name: "{{ test_id }}-API-Port"
        state: absent
      register: delete_duplicate_api_port
      failed_when: delete_duplicate_api_port is failed and '403' not in delete_duplicate_api_port.msg | default('')
      when: duplicate_api_port_result is defined and duplicate_api_port_result is not failed

    - name: Delete initial API port if we created one
      ansible.platform.http_port:
        name: "{{ test_id }}-API-Port-Initial"
        state: absent
      register: delete_initial_api_port
      failed_when: delete_initial_api_port is failed and '403' not in delete_initial_api_port.msg | default('')
      when: initial_api_port is defined and initial_api_port is changed
...
