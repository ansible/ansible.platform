---
- name: Generate a test ID
  ansible.builtin.set_fact:
    test_id: "{{ lookup('password', '/dev/null chars=ascii_letters length=16') }}"
  when: test_id is not defined

- name: Preset vars
  ansible.builtin.set_fact:
    name_prefix: "AAP-Collection-Test-Group-{{ test_id }}"

- name: Look up Demo Inventory for the host association test
  ansible.builtin.uri:
    url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/controller/v2/inventories/?name=Demo+Inventory"
    method: GET
    user: "{{ gateway_username }}"
    password: "{{ gateway_password }}"
    force_basic_auth: true
    validate_certs: "{{ gateway_validate_certs | bool }}"
    status_code: [200]
  register: demo_inventory
  delegate_to: localhost

- name: Assert Demo Inventory is available
  ansible.builtin.assert:
    that:
      - demo_inventory.json.results | length > 0

- name: Create a host for the group association test
  ansible.builtin.uri:
    url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/controller/v2/hosts/"
    method: POST
    user: "{{ gateway_username }}"
    password: "{{ gateway_password }}"
    force_basic_auth: true
    validate_certs: "{{ gateway_validate_certs | bool }}"
    body_format: json
    body:
      name: "{{ name_prefix }}-Host"
      inventory: "{{ demo_inventory.json.results[0].id }}"
      description: "Integration test host for group association"
    status_code: [201]
  register: test_host
  delegate_to: localhost

- name: Run Test
  module_defaults:
    group/ansible.platform.controller:
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs | bool }}"

  block:
    - name: Delete a non-existent group
      ansible.platform.group:
        name: "{{ name_prefix }}-Missing"
        inventory: "Demo Inventory"
        state: absent
      register: missing_group

    - name: Assert deleting a non-existent group does not change anything
      ansible.builtin.assert:
        that:
          - missing_group is not changed

    - name: Create group
      ansible.platform.group:
        name: "{{ name_prefix }}-Test"
        description: "Integration test group"
        inventory: "Demo Inventory"
        variables:
          env: test
        state: present
      register: created_group

    - name: Assert creation changed
      ansible.builtin.assert:
        that:
          - created_group is changed
          - created_group.group.name == (name_prefix ~ '-Test')
          - created_group.group.id is defined
          - created_group.group.description == 'Integration test group'
          - "created_group.group.variables | from_json == {'env': 'test'}"

    - name: Check idempotency
      ansible.platform.group:
        name: "{{ name_prefix }}-Test"
        description: "Integration test group"
        inventory: "Demo Inventory"
        variables:
          env: test
        state: present
      register: idempotent_group

    - name: Assert no change on re-apply
      ansible.builtin.assert:
        that:
          - idempotent_group is not changed

    - name: Update group description and variables
      ansible.platform.group:
        name: "{{ name_prefix }}-Test"
        inventory: "Demo Inventory"
        description: "Updated integration test group"
        variables:
          env: updated
      register: updated_group

    - name: Assert group update changed the existing group
      ansible.builtin.assert:
        that:
          - updated_group is changed
          - updated_group.group.id == created_group.group.id
          - updated_group.group.description == 'Updated integration test group'
          - "updated_group.group.variables | from_json == {'env': 'updated'}"

    - name: Reapply the updated group
      ansible.platform.group:
        name: "{{ name_prefix }}-Test"
        inventory: "Demo Inventory"
        description: "Updated integration test group"
        variables:
          env: updated
      register: idempotent_update_group

    - name: Assert the group update is idempotent
      ansible.builtin.assert:
        that:
          - idempotent_update_group is not changed

    - name: Create a child group for the association test
      ansible.platform.group:
        name: "{{ name_prefix }}-Child"
        inventory: "Demo Inventory"
        state: present
      register: child_group

    - name: Associate a host and child group
      ansible.platform.group:
        name: "{{ name_prefix }}-Test"
        inventory: "Demo Inventory"
        hosts:
          - "{{ test_host.json.name }}"
        children:
          - "{{ child_group.group.name }}"
      register: associated_group

    - name: Assert the associations changed the group
      ansible.builtin.assert:
        that:
          - associated_group is changed

    - name: Read the group's host association
      ansible.builtin.uri:
        url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/controller/v2/groups/{{ created_group.group.id }}/hosts/"
        method: GET
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        status_code: [200]
      register: associated_hosts
      delegate_to: localhost

    - name: Read the group's child association
      ansible.builtin.uri:
        url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/controller/v2/groups/{{ created_group.group.id }}/children/"
        method: GET
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        status_code: [200]
      register: associated_children
      delegate_to: localhost

    - name: Assert the expected host and child group are associated
      ansible.builtin.assert:
        that:
          - associated_hosts.json.results | selectattr('name', 'equalto', test_host.json.name) | list | length == 1
          - associated_children.json.results | selectattr('name', 'equalto', child_group.group.name) | list | length == 1

    - name: Check group association idempotency
      ansible.platform.group:
        name: "{{ name_prefix }}-Test"
        inventory: "Demo Inventory"
        hosts:
          - "{{ test_host.json.name }}"
        children:
          - "{{ child_group.group.name }}"
      register: idempotent_association

    - name: Assert the group associations are idempotent
      ansible.builtin.assert:
        that:
          - idempotent_association is not changed

    - name: Rename group
      ansible.platform.group:
        name: "{{ name_prefix }}-Test"
        new_name: "{{ name_prefix }}-Renamed"
        inventory: "Demo Inventory"
      register: renamed_group

    - name: Assert rename changed
      ansible.builtin.assert:
        that:
          - renamed_group is changed
          - renamed_group.group.id == created_group.group.id
          - renamed_group.group.name == (name_prefix ~ '-Renamed')
          - renamed_group.group.description == 'Updated integration test group'
          - "renamed_group.group.variables | from_json == {'env': 'updated'}"

    - name: Check exists
      ansible.platform.group:
        name: "{{ name_prefix }}-Renamed"
        inventory: "Demo Inventory"
        state: exists
      register: exists_check

    - name: Assert exists
      ansible.builtin.assert:
        that:
          - exists_check.exists
          - exists_check is not changed

    - name: Delete the renamed group
      ansible.platform.group:
        name: "{{ name_prefix }}-Renamed"
        inventory: "Demo Inventory"
        state: absent
      register: deleted_group

    - name: Assert deleting the group changed it
      ansible.builtin.assert:
        that:
          - deleted_group is changed

  always:
    - name: Delete group (renamed)
      ansible.platform.group:
        name: "{{ name_prefix }}-Renamed"
        inventory: "Demo Inventory"
        state: absent
      failed_when: false

    - name: Delete group (original, in case rename failed)
      ansible.platform.group:
        name: "{{ name_prefix }}-Test"
        inventory: "Demo Inventory"
        state: absent
      failed_when: false

    - name: Delete the child group
      ansible.platform.group:
        name: "{{ name_prefix }}-Child"
        inventory: "Demo Inventory"
        state: absent
      failed_when: false

    - name: Delete the test host
      ansible.builtin.uri:
        url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/controller/v2/hosts/{{ test_host.json.id }}/"
        method: DELETE
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        status_code: [200, 202, 204, 404]
      when:
        - test_host is defined
        - test_host.json.id is defined
      delegate_to: localhost
      failed_when: false
...
