---
- name: Generate a unique test identifier
  ansible.builtin.set_fact:
    test_id: "{{ lookup('password', '/dev/null chars=ascii_letters length=16') }}"
  when: test_id is not defined

- name: Set test resource names
  ansible.builtin.set_fact:
    test_inventory_name: "AAP-Collection-Test-BulkJobLaunch-{{ test_id }}-Inventory"
    test_host_name: "AAP-Collection-Test-BulkJobLaunch-{{ test_id }}-localhost"
    test_job_template_name: "AAP-Collection-Test-BulkJobLaunch-{{ test_id }}"

- name: Exercise bulk_job_launch with a local test inventory
  module_defaults:
    group/ansible.platform.controller:
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs | bool }}"
  block:
    - name: Create a test inventory
      ansible.platform.inventory:
        name: "{{ test_inventory_name }}"
        organization: Default
        state: present
      register: test_inventory

    - name: Add localhost to the test inventory
      ansible.platform.host:
        name: "{{ test_host_name }}"
        inventory: "{{ test_inventory_name }}"
        variables:
          ansible_connection: local
        state: present
      register: test_host

    - name: Create a job template that accepts inventory prompts
      ansible.platform.job_template:
        name: "{{ test_job_template_name }}"
        project: Demo Project
        playbook: hello_world.yml
        inventory: "{{ test_inventory_name }}"
        ask_inventory_on_launch: true
        state: present
      register: test_jt

    - name: Assert test job template exists
      ansible.builtin.assert:
        that:
          - test_jt.job_template.id is defined

    - name: Bulk launch jobs and wait for completion
      ansible.platform.bulk_job_launch:
        name: "{{ test_job_template_name }}-Wait"
        jobs:
          - unified_job_template: "{{ test_jt.job_template.id }}"
        organization: Default
        inventory: "{{ test_inventory_name }}"
        wait: true
        timeout: 120
        interval: 2
      register: launch_result

    - name: Assert bulk launch succeeded
      ansible.builtin.assert:
        that:
          - launch_result is not failed
          - launch_result.id is defined
          - launch_result.status == "successful"
          - launch_result.changed

    - name: Bulk launch without waiting
      ansible.platform.bulk_job_launch:
        name: "{{ test_job_template_name }}-NoWait"
        jobs:
          - unified_job_template: "{{ test_jt.job_template.id }}"
        organization: Default
        inventory: "{{ test_inventory_name }}"
        wait: false
      register: nowait_result

    - name: Assert no-wait launch returned an ID
      ansible.builtin.assert:
        that:
          - nowait_result is not failed
          - nowait_result.id is defined
          - nowait_result.changed

    - name: Wait for background workflow to finish
      ansible.builtin.uri:
        url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/controller/v2/workflow_jobs/{{ nowait_result.id }}/"
        method: GET
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        status_code: [200]
      register: bg_job
      delegate_to: localhost
      until: bg_job.json.status in ['successful', 'failed', 'error', 'canceled']
      retries: 60
      delay: 2

    - name: Assert background workflow succeeded
      ansible.builtin.assert:
        that:
          - bg_job.json.status == "successful"

  always:
    - name: Remove test job template
      ansible.platform.job_template:
        name: "{{ test_job_template_name }}"
        state: absent
      when: test_id is defined
      failed_when: false

    - name: Remove the test host
      ansible.platform.host:
        name: "{{ test_host_name }}"
        inventory: "{{ test_inventory_name }}"
        state: absent
      when: test_id is defined
      failed_when: false

    - name: Remove the test inventory
      ansible.platform.inventory:
        name: "{{ test_inventory_name }}"
        organization: Default
        state: absent
      when: test_id is defined
...
