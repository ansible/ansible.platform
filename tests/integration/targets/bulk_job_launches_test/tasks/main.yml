---
- name: Generate a unique test identifier
  ansible.builtin.set_fact:
    test_id: "{{ lookup('password', '/dev/null chars=ascii_letters length=16') }}"
  when: test_id is not defined

- name: Look up Default organization in Controller
  ansible.builtin.uri:
    url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/controller/v2/organizations/?name=Default"
    method: GET
    user: "{{ gateway_username }}"
    password: "{{ gateway_password }}"
    force_basic_auth: true
    validate_certs: "{{ gateway_validate_certs | bool }}"
    status_code: [200]
  register: default_org
  delegate_to: localhost

- name: Assert Default organization exists
  ansible.builtin.assert:
    that:
      - default_org.json.count | int > 0
    fail_msg: "Controller organization 'Default' was not found."

- name: Exercise bulk_job_launch with an isolated localhost inventory
  block:
    - name: Create a test inventory
      ansible.builtin.uri:
        url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/controller/v2/inventories/"
        method: POST
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        body_format: json
        body:
          name: "AAP-Collection-Test-BulkJobLaunch-{{ test_id }}-Inventory"
          organization: "{{ default_org.json.results[0].id }}"
        status_code: [201]
      register: test_inventory
      delegate_to: localhost

    - name: Add localhost to the test inventory
      ansible.builtin.uri:
        url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/controller/v2/inventories/{{ test_inventory.json.id }}/hosts/"
        method: POST
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        body_format: json
        body:
          name: localhost
          variables: '{"ansible_connection": "local"}'
        status_code: [201]
      delegate_to: localhost

    - name: Create a job template that accepts inventory prompts
      ansible.platform.job_template:
        name: "AAP-Collection-Test-BulkJobLaunch-{{ test_id }}"
        copy_from: "Demo Job Template"
        ask_inventory_on_launch: true
        state: present
      register: test_jt

    - name: Assert test job template exists
      ansible.builtin.assert:
        that:
          - test_jt.id is defined

    - name: Bulk launch jobs and wait for completion
      ansible.platform.bulk_job_launch:
        name: "AAP-Collection-Test-BulkJobLaunch-{{ test_id }}-Wait"
        jobs:
          - unified_job_template: "{{ test_jt.id }}"
        organization: Default
        inventory: "AAP-Collection-Test-BulkJobLaunch-{{ test_id }}-Inventory"
        wait: true
        timeout: 120
        interval: 2
      register: launch_result

    - name: Assert bulk launch succeeded
      ansible.builtin.assert:
        that:
          - launch_result is not failed
          - launch_result.id is defined
          - launch_result.status == "successful"
          - launch_result.changed

    - name: Bulk launch without waiting
      ansible.platform.bulk_job_launch:
        name: "AAP-Collection-Test-BulkJobLaunch-{{ test_id }}-NoWait"
        jobs:
          - unified_job_template: "{{ test_jt.id }}"
        organization: Default
        inventory: "AAP-Collection-Test-BulkJobLaunch-{{ test_id }}-Inventory"
        wait: false
      register: nowait_result

    - name: Assert no-wait launch returned an ID
      ansible.builtin.assert:
        that:
          - nowait_result is not failed
          - nowait_result.id is defined
          - nowait_result.changed

    - name: Wait for background workflow to finish
      ansible.builtin.uri:
        url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/controller/v2/workflow_jobs/{{ nowait_result.id }}/"
        method: GET
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        status_code: [200]
      register: bg_job
      delegate_to: localhost
      until: bg_job.json.status in ['successful', 'failed', 'error', 'canceled']
      retries: 60
      delay: 2

    - name: Assert background workflow succeeded
      ansible.builtin.assert:
        that:
          - bg_job.json.status == "successful"

  always:
    - name: Remove test job template
      ansible.platform.job_template:
        name: "AAP-Collection-Test-BulkJobLaunch-{{ test_id }}"
        state: absent
      when: test_jt is defined
      failed_when: false

    - name: Remove test inventory
      ansible.builtin.uri:
        url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/controller/v2/inventories/{{ test_inventory.json.id }}/"
        method: DELETE
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        status_code: [202, 204, 404]
      delegate_to: localhost
      when:
        - test_inventory is defined
        - test_inventory.json is defined
        - test_inventory.json.id is defined
      failed_when: false
...
