---
- name: Run Test
  module_defaults:
    group/ansible.platform.gateway:
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs | bool }}"

  block:

    # --------------------------------------------------------------------------
    # Setup
    # --------------------------------------------------------------------------
    - name: Generate a unique test ID
      ansible.builtin.set_fact:
        test_id: "{{ lookup('password', '/dev/null chars=ascii_letters length=16') }}"
      when: test_id is not defined

    - name: Preset variables for test resource names
      ansible.builtin.set_fact:
        organization_name: "GW-Collection-Test-Organization-{{ test_id }}"
        team_name_prefix: "GW-Collection-Test-Team-{{ test_id }}"
        custom_role_name: "GW-Custom-Role-{{ test_id }}"

    # --------------------------------------------------------------------------
    # Organizations
    # --------------------------------------------------------------------------
    - name: Create Organization 1
      ansible.platform.organization:
        name: "{{ organization_name }}-1"
      register: org1

    - name: Create Organization 2
      ansible.platform.organization:
        name: "{{ organization_name }}-2"
      register: org2

    - name: Create Organization 3
      ansible.platform.organization:
        name: "{{ organization_name }}-3"
      register: org3

    - name: Create Organization 4
      ansible.platform.organization:
        name: "{{ organization_name }}-4"
      register: org4

    - name: Assert organizations were created
      ansible.builtin.assert:
        that:
          - org1 is changed
          - org2 is changed
          - org3 is changed
          - org4 is changed

    # --------------------------------------------------------------------------
    # Teams
    # --------------------------------------------------------------------------
    - name: Create Team 1 in Organization 1
      ansible.platform.team:
        name: "{{ team_name_prefix }}-Team-1"
        organization: "{{ org1.name }}"
        description: "Test Team 1"
      register: team1

    - name: Create Team 2 in Organization 2
      ansible.platform.team:
        name: "{{ team_name_prefix }}-Team-2"
        organization: "{{ org2.name }}"
        description: "Test Team 2"
      register: team2

    - name: Create Team 3 in Organization 3
      ansible.platform.team:
        name: "{{ team_name_prefix }}-Team-3"
        organization: "{{ org3.name }}"
        description: "Test Team 3"
      register: team3

    - name: Create Team 4 in Organization 4
      ansible.platform.team:
        name: "{{ team_name_prefix }}-Team-4"
        organization: "{{ org4.name }}"
        description: "Test Team 3"
      register: team4

    - name: Assert that teams were created
      ansible.builtin.assert:
        that:
          - team1 is changed
          - team2 is changed
          - team3 is changed
          - team4 is changed

    # --------------------------------------------------------------------------
    # Custom Role Setup
    # --------------------------------------------------------------------------
    - name: Create Custom Role
      ansible.platform.role_definition:
        name: "{{ custom_role_name }}"
        description: "Custom role for integration test"
        content_type: "shared.organization"
        permissions:
          - "shared.view_organization"
        state: present
      register: custom_role

    # --------------------------------------------------------------------------
    # Resource-level role definitions for type-mismatch tests
    # --------------------------------------------------------------------------
    # Use EDA content types for mismatch tests — awx.* types require Controller
    # which may not be present in all CI environments. EDA types are available
    # whenever EDA is connected to Gateway.
    - name: Create activation-scoped custom role (content_type eda.activation)
      ansible.platform.role_definition:
        name: "{{ custom_role_name }}-activation"
        description: "Activation-scoped role for content_type mismatch tests (type 1)"
        content_type: "eda.activation"
        permissions:
          - "eda.view_activation"
        state: present
      register: custom_project_role   # kept as custom_project_role for variable reuse below

    - name: Create eda-credential-scoped custom role (content_type eda.edacredential)
      ansible.platform.role_definition:
        name: "{{ custom_role_name }}-edacredential"
        description: "EDA credential-scoped role for content_type mismatch tests (type 2)"
        content_type: "eda.edacredential"
        permissions:
          - "eda.view_edacredential"
        state: present
      register: custom_activation_role

    # --------------------------------------------------------------------------
    # Root cause: resource-level role + type:organizations caused 400/500.
    # Fix: module now validates type matches content_type and raises a clear error.
    # --------------------------------------------------------------------------

    # TEST 1: Type mismatch — activation role + type:organizations must give clear error
    - name: "BUG#165 | eda.activation role with type:organizations must fail with clear error"
      ansible.platform.role_team_assignment:
        role_definition: "{{ custom_role_name }}-activation"
        team: "{{ team1.name }}"
        assignment_objects:
          - name: "{{ org1.name }}"
            type: organizations
        state: present
      register: mismatch_project_org
      ignore_errors: true

    - name: "BUG#165 | Assert error message tells user the correct type to use"
      ansible.builtin.assert:
        that:
          - mismatch_project_org is failed
          - "'activations' in mismatch_project_org.msg"
          - "'organizations' in mismatch_project_org.msg"
        success_msg: >
          BUG FIX CONFIRMED: module rejects eda.activation role + type:organizations with
          a clear error pointing to 'activations' as the expected type.
        fail_msg: >
          BUG NOT FIXED: either the assignment was silently accepted (no error)
          or the error message does not mention the correct type 'activations'.
          Result: {{ mismatch_project_org | to_nice_json }}

    # TEST 2: Type mismatch — eda credential role + type:organizations must give clear error
    - name: "BUG#165 | eda.edacredential role with type:organizations must fail with clear error"
      ansible.platform.role_team_assignment:
        role_definition: "{{ custom_role_name }}-edacredential"
        team: "{{ team1.name }}"
        assignment_objects:
          - name: "{{ org1.name }}"
            type: organizations
        state: present
      register: mismatch_activation_org
      ignore_errors: true

    - name: "BUG#165 | Assert eda credential mismatch error mentions eda_credentials"
      ansible.builtin.assert:
        that:
          - mismatch_activation_org is failed
          - "'eda_credentials' in mismatch_activation_org.msg"
          - "'organizations' in mismatch_activation_org.msg"
        success_msg: "BUG FIX CONFIRMED: eda.edacredential role + type:organizations correctly rejected."
        fail_msg: "EDA credential mismatch not caught. Result: {{ mismatch_activation_org | to_nice_json }}"

    # TEST 3: Correct org-level role assignment still works (no regression)
    - name: "BUG#165 | org-scoped role with type:organizations must still work (regression check)"
      ansible.platform.role_team_assignment:
        role_definition: "{{ custom_role_name }}"
        team: "{{ team1.name }}"
        assignment_objects:
          - name: "{{ org1.name }}"
            type: organizations
        state: present
      register: correct_org_assignment

    - name: "BUG#165 | Assert org-level assignment succeeds"
      ansible.builtin.assert:
        that:
          - correct_org_assignment is not failed
        success_msg: "No regression: org-scoped role + type:organizations still works correctly."
        fail_msg: "REGRESSION: org-scoped role assignment is broken. {{ correct_org_assignment.msg | default('') }}"

    # TEST 4: Idempotency — re-running org assignment produces no change
    - name: "BUG#165 | Idempotency — re-run org assignment"
      ansible.platform.role_team_assignment:
        role_definition: "{{ custom_role_name }}"
        team: "{{ team1.name }}"
        assignment_objects:
          - name: "{{ org1.name }}"
            type: organizations
        state: present
      register: idempotent_check

    - name: "BUG#165 | Assert idempotency"
      ansible.builtin.assert:
        that:
          - idempotent_check is not failed
          - idempotent_check is not changed
        success_msg: "Idempotency confirmed — second run made no changes."
        fail_msg: "Idempotency broken — second run changed state or failed."

    # TEST 5: object_ansible_id path bypasses type check and still works
    - name: "BUG#165 | Assignment via object_ansible_id must work regardless of content_type"
      ansible.platform.role_team_assignment:
        role_definition: "{{ custom_role_name }}"
        team: "{{ team2.name }}"
        assignment_objects:
          - object_ansible_id: "{{ org2.organization.ansible_id | default(omit) }}"
        state: present
      register: ansible_id_assignment
      when: org2.organization.ansible_id is defined
      ignore_errors: true

    # TEST 6: state:absent removes assignment correctly
    - name: "BUG#165 | state:absent removes the assignment"
      ansible.platform.role_team_assignment:
        role_definition: "{{ custom_role_name }}"
        team: "{{ team1.name }}"
        assignment_objects:
          - name: "{{ org1.name }}"
            type: organizations
        state: absent
      register: absent_assignment

    - name: "BUG#165 | Assert assignment was removed"
      ansible.builtin.assert:
        that:
          - absent_assignment is not failed
          - absent_assignment is changed
        success_msg: "state:absent removed assignment correctly."
        fail_msg: "state:absent failed or made no change. {{ absent_assignment.msg | default('') }}"

    # TEST 7: Multi-org assignment — single task, multiple objects
    - name: "BUG#165 | Multi-org assignment in one task"
      ansible.platform.role_team_assignment:
        role_definition: "{{ custom_role_name }}"
        team: "{{ team3.name }}"
        assignment_objects:
          - name: "{{ org3.name }}"
            type: organizations
          - name: "{{ org4.name }}"
            type: organizations
        state: present
      register: multi_org_assignment

    - name: "BUG#165 | Assert multi-org assignment succeeded"
      ansible.builtin.assert:
        that:
          - multi_org_assignment is not failed
          - multi_org_assignment.assignments | length == 2
        success_msg: "Multi-org assignment: both orgs assigned in one task."
        fail_msg: "Multi-org assignment failed. {{ multi_org_assignment | to_nice_json }}"

    # 1. Assign Org Admin role to Team1 on Org1 (Global role can't be assigned)
    - name: Assign Org Admin to Team1 on Org1
      ansible.platform.role_team_assignment:
        assignment_objects:
          - name: "{{ org1.name }}"
            type: "organizations"
        role_definition: Organization Admin
        team: "{{ team1.id }}"
      register: org_admin_assignment_1
      ignore_errors: true  # this may fail depending on AAP limitations

    # 2. Assign Platform role to Team3 on Org3 (Global role can't be assigned)
    - name: Assign Platform Auditor to Team1 on Org1
      ansible.platform.role_team_assignment:
        assignment_objects:
          - name: "{{ org1.name }}"
            type: "organizations"
        role_definition: Platform Auditor
        team: "{{ team1.name }}"
      register: org_admin_assignment_2
      ignore_errors: true  # this may fail depending on AAP limitations

    # 3. Assign Custom Role Assignment Test to Team1 on Org1
    - name: Assign Custom Role to Team1 on Org1
      ansible.platform.role_team_assignment:
        assignment_objects:
          - name: "{{ org1.name }}"
            type: "organizations"
        role_definition: "{{ custom_role_name }}"
        team: "{{ team1.name }}"
        state: present
      register: custom_role_assignment

    # --------------------------------------------------------------------------
    # VERIFICATION: Query API to confirm assignment persists
    # --------------------------------------------------------------------------
    - name: Fetch assignment for Team 1 and Custom Role
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}api/gateway/v1/role_team_assignments/?role_definition={{ custom_role.id }}&team={{ team1.id }}"
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        return_content: true
      register: assignment_query

    - name: Assert Assignment exists
      ansible.builtin.assert:
        that:
          - "assignment_query.json.count > 0"
        fail_msg: "No role assignment found for Custom Role ID {{ custom_role.id }} and Team ID {{ team1.id }}."

    # Once we have role_definition , module available we can uncomment these
    # 3. Assign Org Inventory Admin role to Team2 on Org2
    # - name: Assign Org Inventory Admin to Team2 on Org2
    #   ansible.platform.role_team_assignment:
    #     assignment_objects:
    #       - name: "{{ org1.name }}"
    #         type: "organizations"
    #       - name: "{{ org2.name }}"
    #         type: "organizations"
    #     role_definition: Organization Inventory Admin
    #     team: "{{ team2.name }}"
    #     state: present
    #   register: org_admin_assignment_3

    # - name: Assert Team2 Org Inventory Admin assignment worked
    #   ansible.builtin.assert:
    #     that:
    #       - org_admin_assignment_3 is changed or org_admin_assignment_3 is not failed

    # 4. Idempotency check (should not change)
    # - name: Re-run Org Inventory Admin removal for Team2
    #   ansible.platform.role_team_assignment:
    #     assignment_objects:
    #       - name: "{{ org1.name }}"
    #         type: "organizations"
    #       - name: "{{ org2.name }}"
    #         type: "organizations"
    #     role_definition: Organization Inventory Admin
    #     team: "{{ team2.name }}"
    #     state: present
    #   register: org_admin_assignment_3_check

    # - name: Assert no change on idempotent re-run
    #   ansible.builtin.assert:
    #     that:
    #       - org_admin_assignment_3_check is not changed

    # 5. Assign Org Inventory Admin role to Team2 on Org1 (absent to test delete)
    # - name: Assign Org Credential Admin to Team3 on Org3
    #   ansible.platform.role_team_assignment:
    #     assignment_objects:
    #       - name: "{{ org3.name }}"
    #         type: "organizations"
    #     role_definition: Organization Credential Admin
    #     team: "{{ team3.name }}"
    #     state: present
    #   register: org_admin_assignment_5

    # - name: Assert Org Credential Admin assignment worked
    #   ansible.builtin.assert:
    #     that:
    #       - org_admin_assignment_5 is changed

  always:
    # ----------------------------------------------------------------------
    # Explicit Role Cleanup (Uncomment once role_definition implemented)
    # ----------------------------------------------------------------------
    # - name: Remove Org Inventory Admin assignment from Team2 on Org1,Org2
    #   ansible.platform.role_team_assignment:
    #     assignment_objects:
    #       - name: "{{ org1.name }}"
    #         type: organizations
    #       - name: "{{ org2.name }}"
    #         type: organizations
    #     role_definition: Organization Inventory Admin
    #     team: "{{ team2.name }}"
    #     state: absent

    # - name: Remove Org Inventory Admin assignment from Team2 on Org3
    #   ansible.platform.role_team_assignment:
    #     assignment_objects:
    #       - name: "{{ org3.name }}"
    #         type: organizations
    #     role_definition: Organization Inventory Admin
    #     team: "{{ team3.name }}"
    #     state: absent
    # ----------------------------------------------------------------------
    # Cleanup
    # ----------------------------------------------------------------------
    - name: Delete test teams
      ansible.platform.team:
        name: "{{ item.name }}"
        organization: "{{ item.organization }}"
        state: absent
      loop:
        - { name: "{{ team1.name }}", organization: "{{ org1.name }}" }
        - { name: "{{ team2.name }}", organization: "{{ org2.name }}" }
        - { name: "{{ team3.name }}", organization: "{{ org3.name }}" }
        - { name: "{{ team4.name }}", organization: "{{ org4.name }}" }

    - name: Delete test organizations
      ansible.platform.organization:
        name: "{{ item }}"
        state: absent
      loop:
        - "{{ org1.name }}"
        - "{{ org2.name }}"
        - "{{ org3.name }}"
        - "{{ org4.name }}"

    - name: Delete custom org-scoped role
      ansible.platform.role_definition:
        name: "{{ custom_role_name }}"
        content_type: "shared.organization"
        permissions:
          - "shared.view_organization"
        state: absent
      register: role_delete
      failed_when:
        - role_delete.failed
        - "'Not found' not in role_delete.msg"
        - "'does not exist' not in role_delete.msg"

    - name: Delete custom activation-scoped role type 1 (bug#165 test)
      ansible.platform.role_definition:
        name: "{{ custom_role_name }}-activation"
        content_type: "eda.activation"
        permissions:
          - "eda.view_activation"
        state: absent
      failed_when: false

    - name: Delete custom eda-credential-scoped role type 2 (bug#165 test)
      ansible.platform.role_definition:
        name: "{{ custom_role_name }}-edacredential"
        content_type: "eda.edacredential"
        permissions:
          - "eda.view_edacredential"
        state: absent
      failed_when: false
...
