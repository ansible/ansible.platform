---
- name: Run Test
  module_defaults:
    group/ansible.platform.gateway:
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs | bool }}"

  block:

    - name: Generate a unique test ID
      ansible.builtin.set_fact:
        test_id: "{{ lookup('password', '/dev/null chars=ascii_letters length=16') }}"
      when: test_id is not defined

    - name: Set resource name variables
      ansible.builtin.set_fact:
        organization_name: "GW-Collection-Test-Organization-{{ test_id }}"
        team_name_prefix: "GW-Collection-Test-Team-{{ test_id }}"
        custom_role_name: "GW-Custom-Role-{{ test_id }}"
        eda_de_name: "GW-Test-DE-{{ test_id }}"
        eda_project_name: "GW-Test-EDA-Project-{{ test_id }}"
        ctrl_inventory_name: "GW-Test-Inventory-{{ test_id }}"
        ctrl_project_name: "GW-Test-Project-{{ test_id }}"
        ctrl_ee_name: "GW-Test-EE-{{ test_id }}"
        ctrl_ig_name: "GW-Test-IG-{{ test_id }}"
        hub_ns_name: "gw_test_ns_{{ test_id | lower }}"
        hub_remote_name: "GW-Test-Remote-{{ test_id }}"
        hub_repo_name: "GW-Test-Repo-{{ test_id }}"
        hub_cns_name: "gw-test-cns-{{ test_id | lower }}"
        eda_cred_name: "GW-Test-EDA-Cred-{{ test_id }}"
        eda_stream_name: "GW-Test-Stream-{{ test_id }}"
        eda_activation_name: "GW-Test-Activation-{{ test_id }}"
        ctrl_cred_name: "GW-Test-Cred-{{ test_id }}"
        ctrl_jt_name: "GW-Test-JT-{{ test_id }}"
        ctrl_wfjt_name: "GW-Test-WFJT-{{ test_id }}"
        ctrl_nt_name: "GW-Test-NT-{{ test_id }}"

    # -- Organizations --------------------------------------------------------

    - name: Create Organization 1
      ansible.platform.organization:
        name: "{{ organization_name }}-1"
      register: org1

    - name: Create Organization 2
      ansible.platform.organization:
        name: "{{ organization_name }}-2"
      register: org2

    - name: Create Organization 3
      ansible.platform.organization:
        name: "{{ organization_name }}-3"
      register: org3

    - name: Create Organization 4
      ansible.platform.organization:
        name: "{{ organization_name }}-4"
      register: org4

    - name: Assert organizations created
      ansible.builtin.assert:
        that:
          - org1 is changed
          - org2 is changed
          - org3 is changed
          - org4 is changed

    # -- Teams ----------------------------------------------------------------

    - name: Create Team 1
      ansible.platform.team:
        name: "{{ team_name_prefix }}-Team-1"
        organization: "{{ org1.name }}"
      register: team1

    - name: Create Team 2
      ansible.platform.team:
        name: "{{ team_name_prefix }}-Team-2"
        organization: "{{ org2.name }}"
      register: team2

    - name: Create Team 3
      ansible.platform.team:
        name: "{{ team_name_prefix }}-Team-3"
        organization: "{{ org3.name }}"
      register: team3

    - name: Create Team 4
      ansible.platform.team:
        name: "{{ team_name_prefix }}-Team-4"
        organization: "{{ org4.name }}"
      register: team4

    - name: Assert teams created
      ansible.builtin.assert:
        that:
          - team1 is changed
          - team2 is changed
          - team3 is changed
          - team4 is changed

    # -- Custom role ----------------------------------------------------------

    - name: Create custom org-scoped role
      ansible.platform.role_definition:
        name: "{{ custom_role_name }}"
        description: "Custom role for integration test"
        content_type: "shared.organization"
        permissions:
          - "shared.view_organization"
        state: present
      register: custom_role

    # -- Org-scoped assignments -----------------------------------------------

    - name: Assign Org Admin to Team1 on Org1
      ansible.platform.role_team_assignment:
        assignment_objects:
          - name: "{{ org1.name }}"
            type: organizations
        role_definition: Organization Admin
        team: "{{ team1.id }}"
      register: org_admin_assignment_1
      ignore_errors: true

    - name: Assign Platform Auditor to Team1 on Org1
      ansible.platform.role_team_assignment:
        assignment_objects:
          - name: "{{ org1.name }}"
            type: organizations
        role_definition: Platform Auditor
        team: "{{ team1.name }}"
      register: org_admin_assignment_2
      ignore_errors: true

    - name: Assign custom role to Team1 on Org1
      ansible.platform.role_team_assignment:
        assignment_objects:
          - name: "{{ org1.name }}"
            type: organizations
        role_definition: "{{ custom_role_name }}"
        team: "{{ team1.name }}"
        state: present
      register: custom_role_assignment

    - name: Assert custom role assignment created
      ansible.builtin.assert:
        that: custom_role_assignment is changed

    - name: Idempotency — re-run custom role assignment
      ansible.platform.role_team_assignment:
        assignment_objects:
          - name: "{{ org1.name }}"
            type: organizations
        role_definition: "{{ custom_role_name }}"
        team: "{{ team1.name }}"
        state: present
      register: custom_role_idem

    - name: Assert custom role idempotent
      ansible.builtin.assert:
        that: custom_role_idem is not changed
        fail_msg: "Re-run of org-scoped assignment should not change."

    # -- Verify via API -------------------------------------------------------

    - name: Fetch assignment from API to confirm persistence
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}api/gateway/v1/role_team_assignments/?role_definition={{ custom_role.id }}&team={{ team1.id }}"
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        return_content: true
      register: assignment_query

    - name: Assert assignment exists in API
      ansible.builtin.assert:
        that: "assignment_query.json.count > 0"
        fail_msg: "No assignment found for role={{ custom_role.id }} team={{ team1.id }}."

    # -- Gateway: team ---------------------------------------------------------
    # Assigns a role against a team object (team2) — tests type=teams lookup.

    - name: Verify team role assignment (type=teams)
      ansible.builtin.include_tasks:
        file: verify_assignment.yml
      vars:
        res_ok: "{{ team2 is defined }}"
        res_name: "{{ team2.name }}"
        res_type: teams
        res_role_def: "Team Admin"
        team_name: "{{ team1.name }}"

    # -- EDA decision environment assignment (ACA-6324) -----------------------
    # EDA uses its own org ID namespace; look up the synced org by name first.

    - name: Look up test organization in EDA
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}api/eda/v1/organizations/?name={{ org1.name | urlencode }}"
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        return_content: true
      register: eda_org
      ignore_errors: true

    - name: Set EDA org ID fact
      ansible.builtin.set_fact:
        eda_org_id: "{{ eda_org.json.results[0].id }}"
      when: eda_org is not failed and eda_org.json.count > 0

    - name: Create EDA decision environment via EDA API
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}api/eda/v1/decision-environments/"
        method: POST
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        body_format: json
        body:
          name: "{{ eda_de_name }}"
          image_url: "quay.io/ansible/de-supported:latest"
          organization_id: "{{ eda_org_id }}"
        status_code: [200, 201]
      register: eda_de
      when: eda_org_id is defined
      ignore_errors: true

    - name: Verify EDA decision environment role assignment
      ansible.builtin.include_tasks:
        file: verify_assignment.yml
      vars:
        res_ok: "{{ eda_de is not failed and eda_de is not skipped }}"
        res_name: "{{ eda_de_name }}"
        res_type: decision_environments
        res_role_def: "Decision Environment Admin"
        team_name: "{{ team1.name }}"

    # -- EDA project assignment (ACA-6206) ------------------------------------
    # Uses type=eda_projects which routes to /api/eda/v1/projects/.
    # type=projects would incorrectly route to /api/controller/v2/projects/.

    - name: Create EDA project via EDA API
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}api/eda/v1/projects/"
        method: POST
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        body_format: json
        body:
          name: "{{ eda_project_name }}"
          url: "https://github.com/ansible/event-driven-ansible"
          organization_id: "{{ eda_org_id }}"
        status_code: [200, 201]
      register: eda_project
      when: eda_org_id is defined
      ignore_errors: true

    - name: Create EDA project role definition
      ansible.platform.role_definition:
        name: "GW-EDA-Project-Role-{{ test_id }}"
        content_type: eda.project
        permissions:
          - eda.view_project
          - eda.change_project
          - eda.delete_project
          - eda.sync_project
          - eda.view_rulebook
        state: present
      register: eda_project_role_def
      ignore_errors: true

    - name: Verify EDA project role assignment
      ansible.builtin.include_tasks:
        file: verify_assignment.yml
      vars:
        res_ok: "{{ eda_project is not failed and eda_project is not skipped and eda_project_role_def is not failed }}"
        res_name: "{{ eda_project_name }}"
        res_type: eda_projects
        res_role_def: "GW-EDA-Project-Role-{{ test_id }}"
        team_name: "{{ team1.name }}"

    # -- EDA: eda_credentials --------------------------------------------------

    - name: Look up EDA credential type
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}api/eda/v1/credential-types/?name=Source+Control"
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        return_content: true
      register: eda_cred_types
      ignore_errors: true

    - name: Set EDA credential type fact
      ansible.builtin.set_fact:
        eda_cred_type_id: "{{ eda_cred_types.json.results[0].id }}"
      when: eda_cred_types is not failed and eda_cred_types.json.count > 0

    - name: Create EDA credential
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}api/eda/v1/eda-credentials/"
        method: POST
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        body_format: json
        body:
          name: "{{ eda_cred_name }}"
          credential_type_id: "{{ eda_cred_type_id }}"
          inputs: {}
          organization_id: "{{ eda_org_id }}"
        status_code: [200, 201]
      register: eda_cred
      when: eda_cred_type_id is defined and eda_org_id is defined
      ignore_errors: true

    - name: Verify EDA credential role assignment
      ansible.builtin.include_tasks:
        file: verify_assignment.yml
      vars:
        res_ok: "{{ eda_cred is defined and eda_cred is not failed and eda_cred is not skipped }}"
        res_name: "{{ eda_cred_name }}"
        res_type: eda_credentials
        res_role_def: "Eda Credential Admin"
        team_name: "{{ team1.name }}"

    # -- EDA: event_streams ----------------------------------------------------
    # Event streams require a credential of an event-stream-compatible type
    # (Basic/Token/HMAC/etc.) — not a Source Control credential.

    - name: Look up Token Event Stream credential type
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}api/eda/v1/credential-types/?name=Token+Event+Stream"
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        return_content: true
      register: eda_stream_cred_types
      ignore_errors: true

    - name: Set EDA stream credential type fact
      ansible.builtin.set_fact:
        eda_stream_cred_type_id: "{{ eda_stream_cred_types.json.results[0].id }}"
      when: eda_stream_cred_types is not failed and eda_stream_cred_types.json.count > 0

    - name: Create EDA event stream credential
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}api/eda/v1/eda-credentials/"
        method: POST
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        body_format: json
        body:
          name: "{{ eda_stream_name }}-cred"
          credential_type_id: "{{ eda_stream_cred_type_id }}"
          inputs:
            token: "integration-test-token"
          organization_id: "{{ eda_org_id }}"
        status_code: [200, 201]
      register: eda_stream_cred
      when: eda_stream_cred_type_id is defined and eda_org_id is defined
      ignore_errors: true

    - name: Create EDA event stream
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}api/eda/v1/event-streams/"
        method: POST
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        body_format: json
        body:
          name: "{{ eda_stream_name }}"
          organization_id: "{{ eda_org_id }}"
          eda_credential_id: "{{ eda_stream_cred.json.id }}"
        status_code: [200, 201]
      register: eda_stream
      when: eda_org_id is defined and eda_stream_cred is defined and eda_stream_cred is not failed and eda_stream_cred is not skipped
      ignore_errors: true

    - name: Verify EDA event stream role assignment
      ansible.builtin.include_tasks:
        file: verify_assignment.yml
      vars:
        res_ok: "{{ eda_stream is defined and eda_stream is not failed and eda_stream is not skipped }}"
        res_name: "{{ eda_stream_name }}"
        res_type: event_streams
        res_role_def: "Event Stream Admin"
        team_name: "{{ team1.name }}"

    # -- EDA: activations ------------------------------------------------------
    # Activations require a rulebook and decision environment. Look up existing
    # ones in the environment; skip gracefully if none are available.

    - name: Look up existing EDA rulebook for activation test
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}api/eda/v1/rulebooks/?page_size=1"
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        return_content: true
      register: eda_rulebooks
      ignore_errors: true

    - name: Look up existing EDA decision environment for activation test
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}api/eda/v1/decision-environments/?page_size=1"
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        return_content: true
      register: eda_des_list
      ignore_errors: true

    - name: Create EDA activation (disabled)
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}api/eda/v1/activations/"
        method: POST
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        body_format: json
        body:
          name: "{{ eda_activation_name }}"
          rulebook_id: "{{ eda_rulebooks.json.results[0].id }}"
          decision_environment_id: "{{ eda_des_list.json.results[0].id }}"
          organization_id: "{{ eda_org_id }}"
          is_enabled: false
        status_code: [200, 201]
      register: eda_activation
      when: >
        eda_rulebooks is not failed and eda_rulebooks.json.count > 0
        and eda_des_list is not failed and eda_des_list.json.count > 0
        and eda_org_id is defined
      ignore_errors: true

    - name: Verify EDA activation role assignment
      ansible.builtin.include_tasks:
        file: verify_assignment.yml
      vars:
        res_ok: "{{ eda_activation is defined and eda_activation is not failed and eda_activation is not skipped }}"
        res_name: "{{ eda_activation_name }}"
        res_type: activations
        res_role_def: "Activation Admin"
        team_name: "{{ team1.name }}"

    # -- Controller: look up Default org ID ------------------------------------

    - name: Look up Default organization in Controller
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}api/controller/v2/organizations/?name=Default"
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        return_content: true
      register: ctrl_default_org
      ignore_errors: true

    - name: Set Controller org ID fact
      ansible.builtin.set_fact:
        ctrl_org_id: "{{ ctrl_default_org.json.results[0].id }}"
      when: ctrl_default_org is not failed and ctrl_default_org.json.count > 0

    # -- Controller: inventory -------------------------------------------------

    - name: Create Controller inventory
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}api/controller/v2/inventories/"
        method: POST
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        body_format: json
        body:
          name: "{{ ctrl_inventory_name }}"
          organization: "{{ ctrl_org_id }}"
        status_code: [200, 201]
      register: ctrl_inventory
      when: ctrl_org_id is defined
      ignore_errors: true

    - name: Verify inventory role assignment
      ansible.builtin.include_tasks:
        file: verify_assignment.yml
      vars:
        res_ok: "{{ ctrl_inventory is not failed and ctrl_inventory is not skipped }}"
        res_name: "{{ ctrl_inventory_name }}"
        res_type: inventories
        res_role_def: "Inventory Admin"
        team_name: "{{ team1.name }}"

    # -- Controller: project ---------------------------------------------------

    - name: Create Controller project (manual SCM)
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}api/controller/v2/projects/"
        method: POST
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        body_format: json
        body:
          name: "{{ ctrl_project_name }}"
          organization: "{{ ctrl_org_id }}"
          scm_type: ""
        status_code: [200, 201]
      register: ctrl_project
      when: ctrl_org_id is defined
      ignore_errors: true

    - name: Verify project role assignment
      ansible.builtin.include_tasks:
        file: verify_assignment.yml
      vars:
        res_ok: "{{ ctrl_project is not failed and ctrl_project is not skipped }}"
        res_name: "{{ ctrl_project_name }}"
        res_type: projects
        res_role_def: "Project Admin"
        team_name: "{{ team1.name }}"

    # -- Controller: execution environment -------------------------------------

    - name: Create Controller execution environment
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}api/controller/v2/execution_environments/"
        method: POST
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        body_format: json
        body:
          name: "{{ ctrl_ee_name }}"
          image: "quay.io/ansible/awx-ee:latest"
        status_code: [200, 201]
      register: ctrl_ee
      ignore_errors: true

    - name: Verify execution environment role assignment
      ansible.builtin.include_tasks:
        file: verify_assignment.yml
      vars:
        res_ok: "{{ ctrl_ee is not failed and ctrl_ee is not skipped }}"
        res_name: "{{ ctrl_ee_name }}"
        res_type: execution_environments
        res_role_def: "ExecutionEnvironment Admin"
        team_name: "{{ team1.name }}"

    # -- Controller: instance group --------------------------------------------

    - name: Create Controller instance group
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}api/controller/v2/instance_groups/"
        method: POST
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        body_format: json
        body:
          name: "{{ ctrl_ig_name }}"
        status_code: [200, 201]
      register: ctrl_ig
      ignore_errors: true

    - name: Verify instance group role assignment
      ansible.builtin.include_tasks:
        file: verify_assignment.yml
      vars:
        res_ok: "{{ ctrl_ig is not failed and ctrl_ig is not skipped }}"
        res_name: "{{ ctrl_ig_name }}"
        res_type: instance_groups
        res_role_def: "InstanceGroup Admin"
        team_name: "{{ team1.name }}"

    # -- Controller: credentials -----------------------------------------------

    - name: Look up Machine credential type in Controller
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}api/controller/v2/credential_types/?namespace=ssh"
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        return_content: true
      register: ctrl_cred_types
      ignore_errors: true

    - name: Set Controller credential type fact
      ansible.builtin.set_fact:
        ctrl_cred_type_id: "{{ ctrl_cred_types.json.results[0].id }}"
      when: ctrl_cred_types is not failed and ctrl_cred_types.json.count > 0

    - name: Create Controller credential
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}api/controller/v2/credentials/"
        method: POST
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        body_format: json
        body:
          name: "{{ ctrl_cred_name }}"
          credential_type: "{{ ctrl_cred_type_id }}"
          inputs: {}
          organization: "{{ ctrl_org_id }}"
        status_code: [200, 201]
      register: ctrl_cred
      when: ctrl_cred_type_id is defined and ctrl_org_id is defined
      ignore_errors: true

    - name: Verify credential role assignment
      ansible.builtin.include_tasks:
        file: verify_assignment.yml
      vars:
        res_ok: "{{ ctrl_cred is defined and ctrl_cred is not failed and ctrl_cred is not skipped }}"
        res_name: "{{ ctrl_cred_name }}"
        res_type: credentials
        res_role_def: "Credential Admin"
        team_name: "{{ team1.name }}"

    # -- Controller: job_templates ---------------------------------------------
    # Reuses the project and inventory already created in this test run.

    # Job templates require a valid playbook from a synced project.
    # Look up an existing synced project and its first available playbook.
    - name: Look up Controller project with playbooks for job template
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}api/controller/v2/projects/?status=successful&page_size=10"
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        return_content: true
      register: ctrl_synced_projects
      ignore_errors: true

    - name: Look up playbooks from synced project
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}{{ ctrl_synced_projects.json.results[0].related.playbooks | regex_replace('^/', '') }}"
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        return_content: true
      register: ctrl_playbooks
      when: ctrl_synced_projects is not failed and ctrl_synced_projects.json.count > 0
      ignore_errors: true

    - name: Set job template project and playbook facts
      ansible.builtin.set_fact:
        ctrl_jt_project_id: "{{ ctrl_synced_projects.json.results[0].id }}"
        ctrl_jt_playbook: "{{ ctrl_playbooks.json[0] }}"
      when: >
        ctrl_synced_projects is not failed and ctrl_synced_projects.json.count > 0
        and ctrl_playbooks is not failed and ctrl_playbooks is not skipped
        and ctrl_playbooks.json | length > 0

    - name: Create Controller job template
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}api/controller/v2/job_templates/"
        method: POST
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        body_format: json
        body:
          name: "{{ ctrl_jt_name }}"
          project: "{{ ctrl_jt_project_id }}"
          inventory: "{{ ctrl_inventory.json.id }}"
          playbook: "{{ ctrl_jt_playbook }}"
        status_code: [200, 201]
      register: ctrl_jt
      when: ctrl_jt_project_id is defined and ctrl_jt_playbook is defined and ctrl_inventory is not failed and ctrl_inventory is not skipped
      ignore_errors: true

    - name: Verify job template role assignment
      ansible.builtin.include_tasks:
        file: verify_assignment.yml
      vars:
        res_ok: "{{ ctrl_jt is defined and ctrl_jt is not failed and ctrl_jt is not skipped }}"
        res_name: "{{ ctrl_jt_name }}"
        res_type: job_templates
