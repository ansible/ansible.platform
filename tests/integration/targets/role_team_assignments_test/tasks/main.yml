---
- name: Run Test
  module_defaults:
    group/ansible.platform.gateway:
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs | bool }}"

  block:

    - name: Generate a unique test ID
      ansible.builtin.set_fact:
        test_id: "{{ lookup('password', '/dev/null chars=ascii_letters length=16') }}"
      when: test_id is not defined

    - name: Set resource name variables
      ansible.builtin.set_fact:
        organization_name: "GW-Collection-Test-Organization-{{ test_id }}"
        team_name_prefix: "GW-Collection-Test-Team-{{ test_id }}"
        custom_role_name: "GW-Custom-Role-{{ test_id }}"
        eda_de_name: "GW-Test-DE-{{ test_id }}"
        eda_project_name: "GW-Test-EDA-Project-{{ test_id }}"

    # -- Organizations --------------------------------------------------------

    - name: Create Organization 1
      ansible.platform.organization:
        name: "{{ organization_name }}-1"
      register: org1

    - name: Create Organization 2
      ansible.platform.organization:
        name: "{{ organization_name }}-2"
      register: org2

    - name: Create Organization 3
      ansible.platform.organization:
        name: "{{ organization_name }}-3"
      register: org3

    - name: Create Organization 4
      ansible.platform.organization:
        name: "{{ organization_name }}-4"
      register: org4

    - name: Assert organizations created
      ansible.builtin.assert:
        that:
          - org1 is changed
          - org2 is changed
          - org3 is changed
          - org4 is changed

    # -- Teams ----------------------------------------------------------------

    - name: Create Team 1
      ansible.platform.team:
        name: "{{ team_name_prefix }}-Team-1"
        organization: "{{ org1.name }}"
      register: team1

    - name: Create Team 2
      ansible.platform.team:
        name: "{{ team_name_prefix }}-Team-2"
        organization: "{{ org2.name }}"
      register: team2

    - name: Create Team 3
      ansible.platform.team:
        name: "{{ team_name_prefix }}-Team-3"
        organization: "{{ org3.name }}"
      register: team3

    - name: Create Team 4
      ansible.platform.team:
        name: "{{ team_name_prefix }}-Team-4"
        organization: "{{ org4.name }}"
      register: team4

    - name: Assert teams created
      ansible.builtin.assert:
        that:
          - team1 is changed
          - team2 is changed
          - team3 is changed
          - team4 is changed

    # -- Custom role ----------------------------------------------------------

    - name: Create custom org-scoped role
      ansible.platform.role_definition:
        name: "{{ custom_role_name }}"
        description: "Custom role for integration test"
        content_type: "shared.organization"
        permissions:
          - "shared.view_organization"
        state: present
      register: custom_role

    # -- Org-scoped assignments -----------------------------------------------

    - name: Assign Org Admin to Team1 on Org1
      ansible.platform.role_team_assignment:
        assignment_objects:
          - name: "{{ org1.name }}"
            type: organizations
        role_definition: Organization Admin
        team: "{{ team1.id }}"
      register: org_admin_assignment_1
      ignore_errors: true

    - name: Assign Platform Auditor to Team1 on Org1
      ansible.platform.role_team_assignment:
        assignment_objects:
          - name: "{{ org1.name }}"
            type: organizations
        role_definition: Platform Auditor
        team: "{{ team1.name }}"
      register: org_admin_assignment_2
      ignore_errors: true

    - name: Assign custom role to Team1 on Org1
      ansible.platform.role_team_assignment:
        assignment_objects:
          - name: "{{ org1.name }}"
            type: organizations
        role_definition: "{{ custom_role_name }}"
        team: "{{ team1.name }}"
        state: present
      register: custom_role_assignment

    - name: Assert custom role assignment created
      ansible.builtin.assert:
        that: custom_role_assignment is changed

    - name: Idempotency — re-run custom role assignment
      ansible.platform.role_team_assignment:
        assignment_objects:
          - name: "{{ org1.name }}"
            type: organizations
        role_definition: "{{ custom_role_name }}"
        team: "{{ team1.name }}"
        state: present
      register: custom_role_idem

    - name: Assert custom role idempotent
      ansible.builtin.assert:
        that: custom_role_idem is not changed
        fail_msg: "Re-run of org-scoped assignment should not change."

    # -- Verify via API -------------------------------------------------------

    - name: Fetch assignment from API to confirm persistence
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}api/gateway/v1/role_team_assignments/?role_definition={{ custom_role.id }}&team={{ team1.id }}"
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        return_content: true
      register: assignment_query

    - name: Assert assignment exists in API
      ansible.builtin.assert:
        that: "assignment_query.json.count > 0"
        fail_msg: "No assignment found for role={{ custom_role.id }} team={{ team1.id }}."

    # -- EDA decision environment assignment (ACA-6324) -----------------------

    - name: Create EDA decision environment via EDA API
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}api/eda/v1/decision-environments/"
        method: POST
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        body_format: json
        body:
          name: "{{ eda_de_name }}"
          image_url: "quay.io/ansible/de-supported:latest"
          organization_id: "{{ org1.id }}"
        status_code: [200, 201]
      register: eda_de
      ignore_errors: true

    - name: Assign Decision Environment Admin to team by name
      ansible.platform.role_team_assignment:
        role_definition: "Decision Environment Admin"
        team: "{{ team1.name }}"
        assignment_objects:
          - name: "{{ eda_de_name }}"
            type: decision_environments
        state: present
      register: eda_de_role
      when: eda_de is not failed
      ignore_errors: true

    - name: Assert DE role assignment succeeded
      ansible.builtin.assert:
        that:
          - eda_de_role is not failed
          - eda_de_role is changed
        fail_msg: "EDA DE role assignment failed: {{ eda_de_role.msg | default('') }}"
      when: eda_de is not failed and eda_de_role is defined

    - name: Idempotency — re-run DE assignment
      ansible.platform.role_team_assignment:
        role_definition: "Decision Environment Admin"
        team: "{{ team1.name }}"
        assignment_objects:
          - name: "{{ eda_de_name }}"
            type: decision_environments
        state: present
      register: eda_de_role_idem
      when: eda_de is not failed and eda_de_role is not failed

    - name: Assert DE assignment idempotent
      ansible.builtin.assert:
        that: eda_de_role_idem is not changed
        fail_msg: "DE assignment re-run should not change."
      when: eda_de is not failed and eda_de_role is not failed and eda_de_role_idem is defined

    - name: state=absent removes DE assignment
      ansible.platform.role_team_assignment:
        role_definition: "Decision Environment Admin"
        team: "{{ team1.name }}"
        assignment_objects:
          - name: "{{ eda_de_name }}"
            type: decision_environments
        state: absent
      register: eda_de_role_absent
      when: eda_de is not failed and eda_de_role is not failed

    - name: Assert DE assignment removed
      ansible.builtin.assert:
        that:
          - eda_de_role_absent is not failed
          - eda_de_role_absent is changed
        fail_msg: "state=absent on DE assignment failed: {{ eda_de_role_absent.msg | default('') }}"
      when: eda_de is not failed and eda_de_role is not failed and eda_de_role_absent is defined

    # -- EDA project assignment (ACA-6206) ------------------------------------
    # Uses type=eda_projects which routes to /api/eda/v1/projects/.
    # type=projects would incorrectly route to /api/controller/v2/projects/.

    - name: Create EDA project via EDA API
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}api/eda/v1/projects/"
        method: POST
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        body_format: json
        body:
          name: "{{ eda_project_name }}"
          url: "https://github.com/ansible/event-driven-ansible"
          organization_id: "{{ org1.id }}"
        status_code: [200, 201]
      register: eda_project
      ignore_errors: true

    - name: Create EDA project role definition
      ansible.platform.role_definition:
        name: "GW-EDA-Project-Role-{{ test_id }}"
        content_type: eda.project
        permissions:
          - eda.view_project
          - eda.change_project
          - eda.delete_project
          - eda.sync_project
          - eda.view_rulebook
        state: present
      register: eda_project_role_def
      ignore_errors: true

    - name: Assign EDA project role to team by name (type=eda_projects)
      ansible.platform.role_team_assignment:
        role_definition: "GW-EDA-Project-Role-{{ test_id }}"
        team: "{{ team1.name }}"
        assignment_objects:
          - name: "{{ eda_project_name }}"
            type: eda_projects
        state: present
      register: eda_project_role
      when: eda_project is not failed and eda_project_role_def is not failed
      ignore_errors: true

    - name: Assert EDA project role assignment succeeded
      ansible.builtin.assert:
        that:
          - eda_project_role is not failed
          - eda_project_role is changed
        fail_msg: "EDA project role assignment failed: {{ eda_project_role.msg | default('') }}"
      when: eda_project is not failed and eda_project_role_def is not failed and eda_project_role is defined

    - name: Idempotency — re-run EDA project assignment
      ansible.platform.role_team_assignment:
        role_definition: "GW-EDA-Project-Role-{{ test_id }}"
        team: "{{ team1.name }}"
        assignment_objects:
          - name: "{{ eda_project_name }}"
            type: eda_projects
        state: present
      register: eda_project_role_idem
      when: eda_project is not failed and eda_project_role is not failed

    - name: Assert EDA project assignment idempotent
      ansible.builtin.assert:
        that: eda_project_role_idem is not changed
        fail_msg: "EDA project assignment re-run should not change."
      when: eda_project is not failed and eda_project_role is not failed and eda_project_role_idem is defined

    - name: state=absent removes EDA project assignment
      ansible.platform.role_team_assignment:
        role_definition: "GW-EDA-Project-Role-{{ test_id }}"
        team: "{{ team1.name }}"
        assignment_objects:
          - name: "{{ eda_project_name }}"
            type: eda_projects
        state: absent
      register: eda_project_role_absent
      when: eda_project is not failed and eda_project_role is not failed

    - name: Assert EDA project assignment removed
      ansible.builtin.assert:
        that:
          - eda_project_role_absent is not failed
          - eda_project_role_absent is changed
        fail_msg: "state=absent on EDA project assignment failed: {{ eda_project_role_absent.msg | default('') }}"
      when: eda_project is not failed and eda_project_role is not failed and eda_project_role_absent is defined

  always:

    - name: Delete test teams
      ansible.platform.team:
        name: "{{ item.name }}"
        organization: "{{ item.organization }}"
        state: absent
      loop:
        - {name: "{{ team1.name }}", organization: "{{ org1.name }}"}
        - {name: "{{ team2.name }}", organization: "{{ org2.name }}"}
        - {name: "{{ team3.name }}", organization: "{{ org3.name }}"}
        - {name: "{{ team4.name }}", organization: "{{ org4.name }}"}

    - name: Delete test organizations
      ansible.platform.organization:
        name: "{{ item }}"
        state: absent
      loop:
        - "{{ org1.name }}"
        - "{{ org2.name }}"
        - "{{ org3.name }}"
        - "{{ org4.name }}"

    - name: Delete custom role definition
      ansible.platform.role_definition:
        name: "{{ custom_role_name }}"
        content_type: "shared.organization"
        permissions:
          - "shared.view_organization"
        state: absent
      register: role_delete
      failed_when:
        - role_delete.failed
        - "'Not found' not in role_delete.msg"
        - "'does not exist' not in role_delete.msg"

    - name: Delete EDA project role definition
      ansible.platform.role_definition:
        name: "GW-EDA-Project-Role-{{ test_id }}"
        content_type: eda.project
        permissions:
          - eda.view_project
        state: absent
      ignore_errors: true

    - name: Delete EDA decision environment
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}api/eda/v1/decision-environments/{{ eda_de.json.id }}/"
        method: DELETE
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        status_code: [204, 404]
      when: eda_de is defined and eda_de is not failed and eda_de.json.id is defined
      ignore_errors: true

    - name: Delete EDA project
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}api/eda/v1/projects/{{ eda_project.json.id }}/"
        method: DELETE
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        status_code: [204, 404]
      when: eda_project is defined and eda_project is not failed and eda_project.json.id is defined
      ignore_errors: true
...
