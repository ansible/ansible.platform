---
- name: Run Test
  module_defaults:
    group/ansible.platform.gateway:
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs | bool }}"

  block:

    # --------------------------------------------------------------------------
    # Setup
    # --------------------------------------------------------------------------
    - name: Generate a unique test ID
      ansible.builtin.set_fact:
        test_id: "{{ lookup('password', '/dev/null chars=ascii_letters length=16') }}"
      when: test_id is not defined

    - name: Preset variables for test resource names
      ansible.builtin.set_fact:
        organization_name: "GW-Collection-Test-Organization-{{ test_id }}"
        team_name_prefix: "GW-Collection-Test-Team-{{ test_id }}"
        custom_role_name: "GW-Custom-Role-{{ test_id }}"

    # --------------------------------------------------------------------------
    # Organizations
    # --------------------------------------------------------------------------
    - name: Create Organization 1
      ansible.platform.organization:
        name: "{{ organization_name }}-1"
      register: org1

    - name: Create Organization 2
      ansible.platform.organization:
        name: "{{ organization_name }}-2"
      register: org2

    - name: Create Organization 3
      ansible.platform.organization:
        name: "{{ organization_name }}-3"
      register: org3

    - name: Create Organization 4
      ansible.platform.organization:
        name: "{{ organization_name }}-4"
      register: org4

    - name: Assert organizations were created
      ansible.builtin.assert:
        that:
          - org1 is changed
          - org2 is changed
          - org3 is changed
          - org4 is changed

    # --------------------------------------------------------------------------
    # Teams
    # --------------------------------------------------------------------------
    - name: Create Team 1 in Organization 1
      ansible.platform.team:
        name: "{{ team_name_prefix }}-Team-1"
        organization: "{{ org1.name }}"
        description: "Test Team 1"
      register: team1

    - name: Create Team 2 in Organization 2
      ansible.platform.team:
        name: "{{ team_name_prefix }}-Team-2"
        organization: "{{ org2.name }}"
        description: "Test Team 2"
      register: team2

    - name: Create Team 3 in Organization 3
      ansible.platform.team:
        name: "{{ team_name_prefix }}-Team-3"
        organization: "{{ org3.name }}"
        description: "Test Team 3"
      register: team3

    - name: Create Team 4 in Organization 4
      ansible.platform.team:
        name: "{{ team_name_prefix }}-Team-4"
        organization: "{{ org4.name }}"
        description: "Test Team 3"
      register: team4

    - name: Assert that teams were created
      ansible.builtin.assert:
        that:
          - team1 is changed
          - team2 is changed
          - team3 is changed
          - team4 is changed

    # --------------------------------------------------------------------------
    # Custom Role Setup
    # --------------------------------------------------------------------------
    - name: Create Custom Role
      ansible.platform.role_definition:
        name: "{{ custom_role_name }}"
        description: "Custom role for integration test"
        content_type: "shared.organization"
        permissions:
          - "shared.view_organization"
        state: present
      register: custom_role

    # 1. Assign Org Admin role to Team1 on Org1 (Global role can't be assigned)
    - name: Assign Org Admin to Team1 on Org1
      ansible.platform.role_team_assignment:
        assignment_objects:
          - name: "{{ org1.name }}"
            type: "organizations"
        role_definition: Organization Admin
        team: "{{ team1.id }}"
      register: org_admin_assignment_1
      ignore_errors: true  # this may fail depending on AAP limitations

    # 2. Assign Platform role to Team3 on Org3 (Global role can't be assigned)
    - name: Assign Platform Auditor to Team1 on Org1
      ansible.platform.role_team_assignment:
        assignment_objects:
          - name: "{{ org1.name }}"
            type: "organizations"
        role_definition: Platform Auditor
        team: "{{ team1.name }}"
      register: org_admin_assignment_2
      ignore_errors: true  # this may fail depending on AAP limitations

    # 3. Assign Custom Role Assignment Test to Team1 on Org1
    - name: Assign Custom Role to Team1 on Org1
      ansible.platform.role_team_assignment:
        assignment_objects:
          - name: "{{ org1.name }}"
            type: "organizations"
        role_definition: "{{ custom_role_name }}"
        team: "{{ team1.name }}"
        state: present
      register: custom_role_assignment

    # --------------------------------------------------------------------------
    # VERIFICATION: Query API to confirm assignment persists
    # --------------------------------------------------------------------------
    - name: Fetch assignment for Team 1 and Custom Role
      ansible.builtin.set_fact:
        assignment_query: "{{ query('ansible.platform.gateway_api', 'role_team_assignments',
                             query_params={'role_definition': custom_role.id, 'team': team1.id},
                             host=gateway_hostname, username=gateway_username,
                             password=gateway_password, verify_ssl=gateway_validate_certs | bool) }}"

    - name: Assert Assignment exists
      ansible.builtin.assert:
        that:
          - assignment_query | length > 0
        fail_msg: "No role assignment found for Custom Role ID {{ custom_role.id }} and Team ID {{ team1.id }}."

    # Once we have role_definition , module available we can uncomment these
    # 3. Assign Org Inventory Admin role to Team2 on Org2
    # - name: Assign Org Inventory Admin to Team2 on Org2
    #   ansible.platform.role_team_assignment:
    #     assignment_objects:
    #       - name: "{{ org1.name }}"
    #         type: "organizations"
    #       - name: "{{ org2.name }}"
    #         type: "organizations"
    #     role_definition: Organization Inventory Admin
    #     team: "{{ team2.name }}"
    #     state: present
    #   register: org_admin_assignment_3

    # - name: Assert Team2 Org Inventory Admin assignment worked
    #   ansible.builtin.assert:
    #     that:
    #       - org_admin_assignment_3 is changed or org_admin_assignment_3 is not failed

    # 4. Idempotency check (should not change)
    # - name: Re-run Org Inventory Admin removal for Team2
    #   ansible.platform.role_team_assignment:
    #     assignment_objects:
    #       - name: "{{ org1.name }}"
    #         type: "organizations"
    #       - name: "{{ org2.name }}"
    #         type: "organizations"
    #     role_definition: Organization Inventory Admin
    #     team: "{{ team2.name }}"
    #     state: present
    #   register: org_admin_assignment_3_check

    # - name: Assert no change on idempotent re-run
    #   ansible.builtin.assert:
    #     that:
    #       - org_admin_assignment_3_check is not changed

    # 5. Assign Org Inventory Admin role to Team2 on Org1 (absent to test delete)
    # - name: Assign Org Credential Admin to Team3 on Org3
    #   ansible.platform.role_team_assignment:
    #     assignment_objects:
    #       - name: "{{ org3.name }}"
    #         type: "organizations"
    #     role_definition: Organization Credential Admin
    #     team: "{{ team3.name }}"
    #     state: present
    #   register: org_admin_assignment_5

    # - name: Assert Org Credential Admin assignment worked
    #   ansible.builtin.assert:
    #     that:
    #       - org_admin_assignment_5 is changed

    # --------------------------------------------------------------------------
    # EDA resource-level role assignments by name (ACA-6324)
    # --------------------------------------------------------------------------
    # EDA resources are created via uri (no ansible.platform EDA modules yet).
    # The role_team_assignment module resolves names via /api/eda/v1/ paths
    # instead of /api/gateway/v1/ which does not proxy these endpoints.
    # --------------------------------------------------------------------------

    - name: "ACA-6324 | Set EDA resource names"
      ansible.builtin.set_fact:
        eda_de_name: "GW-Test-DE-{{ test_id }}"
        eda_event_stream_name: "GW-Test-ES-{{ test_id }}"

    # --- Create EDA Decision Environment via uri ----------------------------
    - name: "ACA-6324 | Create EDA decision environment via EDA API"
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}api/eda/v1/decision-environments/"
        method: POST
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        body_format: json
        body:
          name: "{{ eda_de_name }}"
          image_url: "quay.io/ansible/de-supported:latest"
          organization_id: "{{ org1.id }}"
        status_code: [200, 201]
      register: eda_de
      ignore_errors: true

    # --- Assign role to team on decision environment by name ----------------
    - name: "ACA-6324 | Assign Decision Environment Admin to team by name"
      ansible.platform.role_team_assignment:
        role_definition: "Decision Environment Admin"
        team: "{{ team1.name }}"
        assignment_objects:
          - name: "{{ eda_de_name }}"
            type: decision_environments
        state: present
      register: eda_de_role
      when: eda_de is not failed
      ignore_errors: true

    - name: "ACA-6324 | Assert DE role assignment by name succeeded"
      ansible.builtin.assert:
        that:
          - eda_de_role is not failed
          - eda_de_role is changed
        success_msg: >
          EDA decision environment role assigned by name via /api/eda/v1/decision-environments/.
          object_id resolved correctly — Gateway accepted the assignment.
        fail_msg: >
          EDA decision environment role assignment failed: {{ eda_de_role.msg | default('no msg') }}.
          Check that /api/eda/v1/decision-environments/ is accessible and the role name is correct.
      when: eda_de is not failed and eda_de_role is defined

    # --- Idempotency: second run must be no-change -------------------------
    - name: "ACA-6324 | Idempotency — re-run DE assignment must be no-change"
      ansible.platform.role_team_assignment:
        role_definition: "Decision Environment Admin"
        team: "{{ team1.name }}"
        assignment_objects:
          - name: "{{ eda_de_name }}"
            type: decision_environments
        state: present
      register: eda_de_role_idempotent
      when: eda_de is not failed and eda_de_role is not failed

    - name: "ACA-6324 | Assert DE assignment idempotency"
      ansible.builtin.assert:
        that:
          - eda_de_role_idempotent is not changed
        success_msg: "Idempotency confirmed — second run made no changes."
        fail_msg: "Idempotency broken — second run changed state or failed."
      when: eda_de is not failed and eda_de_role is not failed and eda_de_role_idempotent is defined

    # --- state:absent removes DE assignment --------------------------------
    - name: "ACA-6324 | state:absent removes DE role assignment"
      ansible.platform.role_team_assignment:
        role_definition: "Decision Environment Admin"
        team: "{{ team1.name }}"
        assignment_objects:
          - name: "{{ eda_de_name }}"
            type: decision_environments
        state: absent
      register: eda_de_role_absent
      when: eda_de is not failed and eda_de_role is not failed

    - name: "ACA-6324 | Assert DE assignment removed"
      ansible.builtin.assert:
        that:
          - eda_de_role_absent is not failed
          - eda_de_role_absent is changed
        success_msg: "state:absent removed EDA DE assignment correctly."
        fail_msg: "state:absent failed or made no change: {{ eda_de_role_absent.msg | default('') }}"
      when: eda_de is not failed and eda_de_role is not failed and eda_de_role_absent is defined

  always:
    # ----------------------------------------------------------------------
    # Explicit Role Cleanup (Uncomment once role_definition implemented)
    # ----------------------------------------------------------------------
    # - name: Remove Org Inventory Admin assignment from Team2 on Org1,Org2
    #   ansible.platform.role_team_assignment:
    #     assignment_objects:
    #       - name: "{{ org1.name }}"
    #         type: organizations
    #       - name: "{{ org2.name }}"
    #         type: organizations
    #     role_definition: Organization Inventory Admin
    #     team: "{{ team2.name }}"
    #     state: absent

    # - name: Remove Org Inventory Admin assignment from Team2 on Org3
    #   ansible.platform.role_team_assignment:
    #     assignment_objects:
    #       - name: "{{ org3.name }}"
    #         type: organizations
    #     role_definition: Organization Inventory Admin
    #     team: "{{ team3.name }}"
    #     state: absent
    # ----------------------------------------------------------------------
    # Cleanup
    # ----------------------------------------------------------------------
    - name: Delete test teams
      ansible.platform.team:
        name: "{{ item.name }}"
        organization: "{{ item.organization }}"
        state: absent
      loop:
        - { name: "{{ team1.name }}", organization: "{{ org1.name }}" }
        - { name: "{{ team2.name }}", organization: "{{ org2.name }}" }
        - { name: "{{ team3.name }}", organization: "{{ org3.name }}" }
        - { name: "{{ team4.name }}", organization: "{{ org4.name }}" }

    - name: Delete test organizations
      ansible.platform.organization:
        name: "{{ item }}"
        state: absent
      loop:
        - "{{ org1.name }}"
        - "{{ org2.name }}"
        - "{{ org3.name }}"
        - "{{ org4.name }}"

    - name: Delete custom role
      ansible.platform.role_definition:
        name: "{{ custom_role_name }}"
        content_type: "shared.organization"
        permissions:
          - "shared.view_organization"
        state: absent
      register: role_delete
      failed_when:
        - role_delete.failed
        - "'Not found' not in role_delete.msg"
        - "'does not exist' not in role_delete.msg"

    # --- EDA cleanup -------------------------------------------------------
    - name: "ACA-6324 | Delete EDA decision environment"
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}api/eda/v1/decision-environments/{{ eda_de.json.id }}/"
        method: DELETE
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        status_code: [204, 404]
      when: eda_de is defined and eda_de is not failed and eda_de.json.id is defined
      ignore_errors: true
...
