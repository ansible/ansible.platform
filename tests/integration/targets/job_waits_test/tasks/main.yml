---
- name: Check module fails with correct msg for nonexistent job
  ansible.platform.job_wait:
    job_id: 99999999
  register: result
  ignore_errors: true

- name: Assert missing job is rejected
  ansible.builtin.assert:
    that:
      - result is failed
      - "'could not be found' in result.msg"

- name: Launch Demo Job Template via URI (get template ID)
  ansible.builtin.uri:
    url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/controller/v2/job_templates/?name=Demo+Job+Template"
    user: "{{ gateway_username }}"
    password: "{{ gateway_password }}"
    validate_certs: "{{ gateway_validate_certs | bool }}"
    force_basic_auth: true
    method: GET
    status_code: [200]
  register: jt_lookup
  delegate_to: localhost

- name: Assert Demo Job Template is available
  ansible.builtin.assert:
    that:
      - jt_lookup.json.results | length > 0

- name: Extract template ID
  ansible.builtin.set_fact:
    demo_jt_id: "{{ jt_lookup.json.results[0].id }}"

- name: Launch Demo Job Template via URI
  ansible.builtin.uri:
    url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/controller/v2/job_templates/{{ demo_jt_id }}/launch/"
    user: "{{ gateway_username }}"
    password: "{{ gateway_password }}"
    validate_certs: "{{ gateway_validate_certs | bool }}"
    force_basic_auth: true
    method: POST
    body_format: json
    body: {}
    status_code:
      - 201
  register: launched_job
  delegate_to: localhost

- name: Assert the demo job was launched
  ansible.builtin.assert:
    that:
      - launched_job.status == 201
      - launched_job.json.id is defined

- name: Wait for the Job to finish
  ansible.platform.job_wait:
    job_id: "{{ launched_job.json.id }}"
    timeout: 120
  register: wait_results

- name: Assert the job wait result
  ansible.builtin.assert:
    that:
      - wait_results is successful
      - "'elapsed' in wait_results"
      - "'id' in wait_results"
      - "'status' in wait_results"
      - wait_results.status == "successful"

- name: Wait for already-finished job (should return immediately)
  ansible.platform.job_wait:
    job_id: "{{ launched_job.json.id }}"
    timeout: 10
  register: wait_results_again

- name: Assert waiting for a completed job returns immediately
  ansible.builtin.assert:
    that:
      - wait_results_again is successful
      - wait_results_again.status == "successful"
...
