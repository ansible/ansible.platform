---
- name: Generate a test ID
  ansible.builtin.set_fact:
    test_id: "{{ lookup('password', '/dev/null chars=ascii_letters length=16') }}"
  when: test_id is not defined

- name: Preset vars
  ansible.builtin.set_fact:
    event_stream_name: "EDA-Event-Stream-Test-{{ test_id }}"

- name: Run Tests
  module_defaults:
    group/ansible.platform.eda:
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs | bool }}"

  block:
    # <Pre-cleanup> -------------------
    - name: Delete any pre-existing test event stream
      ansible.platform.event_stream:
        name: "{{ event_stream_name }}"
        state: absent
      failed_when: false

    # <Create with check mode> -------------------
    - name: Create event stream with check mode
      ansible.platform.event_stream:
        name: "{{ event_stream_name }}"
        credential_name: "EDA Default Event Stream Credential"
        organization_name: Default
        state: present
      check_mode: true
      register: check_create

    - name: Assert check mode reports changed
      ansible.builtin.assert:
        that:
          - check_create is changed

    # <Create> -------------------
    - name: Create event stream
      ansible.platform.event_stream:
        name: "{{ event_stream_name }}"
        credential_name: "EDA Default Event Stream Credential"
        organization_name: Default
        state: present
      register: create_result

    - name: Assert event stream was created
      ansible.builtin.assert:
        that:
          - create_result is changed
          - create_result.id is defined

    # <Idempotency> -------------------
    - name: Create event stream again (idempotency check)
      ansible.platform.event_stream:
        name: "{{ event_stream_name }}"
        credential_name: "EDA Default Event Stream Credential"
        organization_name: Default
        state: present
      register: idempotent_result

    - name: Assert idempotent run did not change
      ansible.builtin.assert:
        that:
          - idempotent_result is not changed

    # <Update> -------------------
    - name: Update event stream with forward_events enabled
      ansible.platform.event_stream:
        name: "{{ event_stream_name }}"
        credential_name: "EDA Default Event Stream Credential"
        organization_name: Default
        forward_events: true
        headers: "Content-Type,X-Custom-Header"
        state: present
      register: update_result

    - name: Assert update changed
      ansible.builtin.assert:
        that:
          - update_result is changed

    # <Exists check> -------------------
    - name: Check existence
      ansible.platform.event_stream:
        name: "{{ event_stream_name }}"
        state: exists
      register: exists_result

    - name: Assert exists check correct
      ansible.builtin.assert:
        that:
          - exists_result.exists
          - exists_result is not changed

    # <Delete> -------------------
    - name: Delete event stream
      ansible.platform.event_stream:
        name: "{{ event_stream_name }}"
        state: absent
      register: delete_result

    - name: Assert delete succeeded
      ansible.builtin.assert:
        that:
          - delete_result is changed

    # <Delete idempotency> -------------------
    - name: Delete already absent event stream
      ansible.platform.event_stream:
        name: "{{ event_stream_name }}"
        state: absent
      register: delete_absent_result

    - name: Assert delete absent is no-op
      ansible.builtin.assert:
        that:
          - delete_absent_result is not changed

  always:
    - name: Cleanup - delete test event stream
      ansible.platform.event_stream:
        name: "{{ event_stream_name }}"
        state: absent
      failed_when: false

    - name: Cleanup - delete renamed event stream (in case rename test ran)
      ansible.platform.event_stream:
        name: "EDA-Event-Stream-Renamed-{{ test_id }}"
        state: absent
      failed_when: false
...
