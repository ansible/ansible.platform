---
- name: Generate a test ID
  ansible.builtin.set_fact:
    test_id: "{{ lookup('password', '/dev/null chars=ascii_letters length=16') }}"
  when: test_id is not defined

- name: Preset vars
  ansible.builtin.set_fact:
    event_stream_name: "EDA-Event-Stream-Test-{{ test_id }}"
    event_stream_credential_name: "EDA-Event-Stream-Test-Credential-{{ test_id }}"

- name: Run Tests
  module_defaults:
    group/ansible.platform.eda:
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs | bool }}"

  block:
    - name: Look up Token Event Stream credential type
      ansible.builtin.uri:
        url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/eda/v1/credential-types/?name=Token%20Event%20Stream"
        url_username: "{{ gateway_username }}"
        url_password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        return_content: true
      register: event_stream_credential_types
      delegate_to: localhost

    - name: Look up Default EDA organization
      ansible.builtin.uri:
        url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/eda/v1/organizations/?name=Default"
        url_username: "{{ gateway_username }}"
        url_password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        return_content: true
      register: event_stream_organizations
      delegate_to: localhost

    - name: Assert event stream credential prerequisites are unique
      ansible.builtin.assert:
        that:
          - event_stream_credential_types.json.count == 1
          - event_stream_organizations.json.count == 1
        fail_msg: "Expected one Token Event Stream credential type and one Default EDA organization."

    - name: Create test-owned event stream credential
      ansible.builtin.uri:
        url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/eda/v1/eda-credentials/"
        method: POST
        url_username: "{{ gateway_username }}"
        url_password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        body_format: json
        body:
          name: "{{ event_stream_credential_name }}"
          credential_type_id: "{{ event_stream_credential_types.json.results[0].id }}"
          organization_id: "{{ event_stream_organizations.json.results[0].id }}"
          inputs:
            token: integration-test-token
        status_code: [200, 201]
      register: event_stream_credential
      delegate_to: localhost

    # <Pre-cleanup> -------------------
    - name: Delete any pre-existing test event stream
      ansible.platform.event_stream:
        name: "{{ event_stream_name }}"
        state: absent
      failed_when: false

    # <Create with check mode> -------------------
    - name: Create event stream with check mode
      ansible.platform.event_stream:
        name: "{{ event_stream_name }}"
        credential_name: "{{ event_stream_credential_name }}"
        organization_name: Default
        state: present
      check_mode: true
      register: check_create

    - name: Assert check mode reports changed
      ansible.builtin.assert:
        that:
          - check_create is changed

    # <Create> -------------------
    - name: Create event stream
      ansible.platform.event_stream:
        name: "{{ event_stream_name }}"
        credential_name: "{{ event_stream_credential_name }}"
        organization_name: Default
        state: present
      register: create_result

    - name: Assert event stream was created
      ansible.builtin.assert:
        that:
          - create_result is changed
          - create_result.id is defined

    # <Idempotency> -------------------
    - name: Create event stream again (idempotency check)
      ansible.platform.event_stream:
        name: "{{ event_stream_name }}"
        credential_name: "{{ event_stream_credential_name }}"
        organization_name: Default
        state: present
      register: idempotent_result

    - name: Assert idempotent run did not change
      ansible.builtin.assert:
        that:
          - idempotent_result is not changed

    # <Update> -------------------
    - name: Update event stream with forward_events enabled
      ansible.platform.event_stream:
        name: "{{ event_stream_name }}"
        credential_name: "{{ event_stream_credential_name }}"
        organization_name: Default
        forward_events: true
        headers: "Content-Type,X-Custom-Header"
        state: present
      register: update_result

    - name: Assert update changed
      ansible.builtin.assert:
        that:
          - update_result is changed

    # <Exists check> -------------------
    - name: Check existence
      ansible.platform.event_stream:
        name: "{{ event_stream_name }}"
        state: exists
      register: exists_result

    - name: Assert exists check correct
      ansible.builtin.assert:
        that:
          - exists_result.exists
          - exists_result is not changed

    # <Delete> -------------------
    - name: Delete event stream
      ansible.platform.event_stream:
        name: "{{ event_stream_name }}"
        state: absent
      register: delete_result

    - name: Assert delete succeeded
      ansible.builtin.assert:
        that:
          - delete_result is changed

    # <Delete idempotency> -------------------
    - name: Delete already absent event stream
      ansible.platform.event_stream:
        name: "{{ event_stream_name }}"
        state: absent
      register: delete_absent_result

    - name: Assert delete absent is no-op
      ansible.builtin.assert:
        that:
          - delete_absent_result is not changed

  always:
    - name: Cleanup - delete test event stream
      ansible.platform.event_stream:
        name: "{{ event_stream_name }}"
        state: absent
      failed_when: false

    - name: Cleanup - delete renamed event stream (in case rename test ran)
      ansible.platform.event_stream:
        name: "EDA-Event-Stream-Renamed-{{ test_id }}"
        state: absent
      failed_when: false

    - name: Cleanup - delete test-owned event stream credential
      ansible.builtin.uri:
        url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/eda/v1/eda-credentials/{{ event_stream_credential.json.id }}/"
        method: DELETE
        url_username: "{{ gateway_username }}"
        url_password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        status_code: [204, 404]
      when: event_stream_credential is defined and event_stream_credential.json.id is defined
      failed_when: false
      delegate_to: localhost
...
