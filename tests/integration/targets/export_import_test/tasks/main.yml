---
- name: Generate a test ID
  ansible.builtin.set_fact:
    test_id: "{{ lookup('password', '/dev/null chars=ascii_letters length=16') }}"
  when: test_id is not defined

- name: Preset vars
  ansible.builtin.set_fact:
    name_prefix: "ExportImport-Test-{{ test_id }}"

- name: Preset resource names
  ansible.builtin.set_fact:
    controller_organization: Default
    execution_environment_name: "{{ name_prefix }}-EE"
    notification_template_name: "{{ name_prefix }}-Notify"
    project_name: "{{ name_prefix }}-Project"
    label_name: "{{ name_prefix }}-Label"
    inventory_source_name: "{{ name_prefix }}-Source"
    job_template_name: "{{ name_prefix }}-JobTemplate"
    workflow_job_template_name: "{{ name_prefix }}-Workflow"
    schedule_name: "{{ name_prefix }}-Schedule"

- name: Run export/import round-trip test
  module_defaults:
    group/ansible.platform.gateway:
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username | default('admin') }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs | default(false) | bool }}"
    group/ansible.platform.controller:
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username | default('admin') }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs | default(false) | bool }}"

  block:
    # =========================================================================
    # Phase 1: Create test resources to export
    # =========================================================================
    - name: Create test organization
      ansible.platform.organization:
        name: "{{ name_prefix }}-Org"
        description: "Test org for export/import"
      register: test_org

    - name: Assert organization created
      ansible.builtin.assert:
        that:
          - test_org.changed

    - name: Create test credential type
      ansible.platform.controller_credential_type:
        name: "{{ name_prefix }}-CredType"
        kind: cloud
        inputs:
          fields:
            - id: api_key
              type: string
              label: API Key
        injectors:
          extra_vars:
            api_key: "{% raw %}{{ api_key }}{% endraw %}"
      register: test_cred_type

    - name: Create test credential
      ansible.platform.controller_credential:
        name: "{{ name_prefix }}-Cred"
        credential_type: "{{ name_prefix }}-CredType"
        organization: "{{ controller_organization }}"
        inputs:
          api_key: "test-key-12345"
      register: test_cred

    - name: Create test execution environment
      ansible.platform.execution_environment:
        name: "{{ execution_environment_name }}"
        image: quay.io/ansible/awx-ee:latest
        organization: "{{ controller_organization }}"

    - name: Create test notification template
      ansible.platform.notification_template:
        name: "{{ notification_template_name }}"
        organization: "{{ controller_organization }}"
        notification_type: webhook
        notification_configuration:
          url: "https://example.invalid/export-import"
          http_method: POST
          headers: {}

    - name: Create test project
      ansible.platform.controller_project:
        name: "{{ project_name }}"
        organization: "{{ controller_organization }}"
        scm_type: git
        scm_url: "https://github.com/ansible/ansible-tower-samples.git"
        default_environment: "{{ execution_environment_name }}"
        notification_templates_success:
          - "{{ notification_template_name }}"

    - name: Create test label
      ansible.platform.label:
        name: "{{ label_name }}"
        organization: "{{ controller_organization }}"

    - name: Create test inventory
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Inventory"
        organization: "{{ controller_organization }}"
        description: "Test inventory"
      register: test_inv

    - name: Create test host
      ansible.platform.host:
        name: "{{ name_prefix }}-Host1"
        inventory: "{{ name_prefix }}-Inventory"
        enabled: true
        variables:
          ansible_host: "10.0.1.10"
      register: test_host

    - name: Create test group
      ansible.platform.group:
        name: "{{ name_prefix }}-Group1"
        inventory: "{{ name_prefix }}-Inventory"
        hosts:
          - "{{ name_prefix }}-Host1"
      register: test_group

    - name: Create test inventory source
      ansible.platform.inventory_source:
        name: "{{ inventory_source_name }}"
        inventory: "{{ name_prefix }}-Inventory"
        source: scm
        source_project: "{{ project_name }}"
        source_path: inventories/hosts.yml
        overwrite: true
        notification_templates_success:
          - "{{ notification_template_name }}"

    - name: Create test job template
      ansible.platform.job_template:
        name: "{{ job_template_name }}"
        project: "{{ project_name }}"
        inventory: "{{ name_prefix }}-Inventory"
        playbook: hello_world.yml
        execution_environment: "{{ execution_environment_name }}"
        credentials:
          - "{{ name_prefix }}-Cred"
        labels:
          - "{{ label_name }}"
        notification_templates_success:
          - "{{ notification_template_name }}"
        survey_enabled: true
        survey_spec:
          name: "Export/import survey"
          description: ""
          spec:
            - question_name: "Environment"
              variable: environment
              type: text
              required: false

    - name: Create test workflow job template
      ansible.platform.workflow_job_template:
        name: "{{ workflow_job_template_name }}"
        organization: "{{ controller_organization }}"
        notification_templates_success:
          - "{{ notification_template_name }}"

    - name: Create test schedule
      ansible.platform.schedule:
        name: "{{ schedule_name }}"
        unified_job_template: "{{ job_template_name }}"
        rrule: "DTSTART:20990101T120000Z RRULE:FREQ=WEEKLY;INTERVAL=1;COUNT=2"
        enabled: true
        # Schedule credential association is not accepted by all supported Controller versions;
        # credential association coverage is exercised by the job template above.
        labels:
          - "{{ label_name }}"

    # =========================================================================
    # Phase 2: Export and verify format
    # =========================================================================
    - name: Export test organizations
      ansible.platform.export:
        organizations:
          - "{{ name_prefix }}-Org"
      register: org_export

    - name: Assert export is read-only
      ansible.builtin.assert:
        that:
          - not org_export.changed
          - org_export.assets is defined
          - org_export.assets.organizations | length >= 1

    - name: Verify exported org has correct fields
      ansible.builtin.assert:
        that:
          - org_export.assets.organizations[0].name == name_prefix ~ '-Org'
          - org_export.assets.organizations[0].description == 'Test org for export/import'
          - "'id' not in org_export.assets.organizations[0]"
          - "'url' not in org_export.assets.organizations[0]"
          - "'related' not in org_export.assets.organizations[0]"

    - name: Export test credential types
      ansible.platform.export:
        credential_types:
          - "{{ name_prefix }}-CredType"
      register: ct_export

    - name: Verify credential type export
      ansible.builtin.assert:
        that:
          - ct_export.assets.credential_types | length >= 1
          - ct_export.assets.credential_types[0].name == name_prefix ~ '-CredType'
          - ct_export.assets.credential_types[0].kind == 'cloud'

    - name: Export test credential
      ansible.platform.export:
        credentials:
          - "{{ name_prefix }}-Cred"
      register: cred_export

    - name: Export test execution environment
      ansible.platform.export:
        execution_environments:
          - "{{ execution_environment_name }}"
      register: ee_export

    - name: Export test notification template
      ansible.platform.export:
        notification_templates:
          - "{{ notification_template_name }}"
      register: notification_export

    - name: Export test project
      ansible.platform.export:
        projects:
          - "{{ project_name }}"
      register: project_export

    - name: Export test label
      ansible.platform.export:
        labels:
          - "{{ label_name }}"
      register: label_export

    - name: Export test inventory source
      ansible.platform.export:
        inventory_sources:
          - "{{ inventory_source_name }}"
      register: source_export

    - name: Export test job template
      ansible.platform.export:
        job_templates:
          - "{{ job_template_name }}"
      register: job_template_export

    - name: Export test workflow job template
      ansible.platform.export:
        workflow_job_templates:
          - "{{ workflow_job_template_name }}"
      register: workflow_export

    - name: Export test schedule
      ansible.platform.export:
        schedules:
          - "{{ schedule_name }}"
      register: schedule_export

    - name: Verify exported associations and dependencies
      ansible.builtin.assert:
        that:
          - project_export.assets.projects[0].default_environment == execution_environment_name
          - notification_template_name in project_export.assets.projects[0].notification_templates_success
          - source_export.assets.inventory_sources[0].source_project == project_name
          - source_export.assets.inventory_sources[0].overwrite
          - job_template_export.assets.job_templates[0].project == project_name
          - job_template_export.assets.job_templates[0].execution_environment == execution_environment_name
          - name_prefix ~ '-Cred' in job_template_export.assets.job_templates[0].credentials
          - label_name in job_template_export.assets.job_templates[0].labels
          - notification_template_name in job_template_export.assets.job_templates[0].notification_templates_success
          - notification_template_name in workflow_export.assets.workflow_job_templates[0].notification_templates_success
          - schedule_export.assets.schedules[0].unified_job_template == job_template_name
          - label_name in schedule_export.assets.schedules[0].labels

    - name: Export test inventory with hosts and groups
      ansible.platform.export:
        inventory:
          - "{{ name_prefix }}-Inventory"
      register: inv_export

    - name: Verify inventory export includes hosts and groups inline
      ansible.builtin.assert:
        that:
          - inv_export.assets.inventory | length >= 1
          - inv_export.assets.inventory[0].name == name_prefix ~ '-Inventory'
          - inv_export.assets.inventory[0].hosts | length >= 1
          - inv_export.assets.inventory[0].groups | length >= 1

    - name: Verify exported inventory FK resolved to name
      ansible.builtin.assert:
        that:
          - inv_export.assets.inventory[0].organization == controller_organization

    # =========================================================================
    # Phase 3: Delete test resources, then import to recreate
    # =========================================================================
    - name: Delete test resources in reverse dependency order
      block:
        - name: Delete test schedule
          ansible.platform.schedule:
            name: "{{ schedule_name }}"
            state: absent

        - name: Delete test workflow job template
          ansible.platform.workflow_job_template:
            name: "{{ workflow_job_template_name }}"
            state: absent

        - name: Delete test job template
          ansible.platform.job_template:
            name: "{{ job_template_name }}"
            state: absent

        - name: Delete test inventory source
          ansible.platform.inventory_source:
            name: "{{ inventory_source_name }}"
            inventory: "{{ name_prefix }}-Inventory"
            state: absent

        - name: Delete test project
          ansible.platform.controller_project:
            name: "{{ project_name }}"
            organization: "{{ controller_organization }}"
            state: absent

        - name: Delete test notification template
          ansible.platform.notification_template:
            name: "{{ notification_template_name }}"
            organization: "{{ controller_organization }}"
            state: absent

        - name: Delete test execution environment
          ansible.platform.execution_environment:
            name: "{{ execution_environment_name }}"
            organization: "{{ controller_organization }}"
            state: absent

        - name: Delete test group
          ansible.platform.group:
            name: "{{ name_prefix }}-Group1"
            inventory: "{{ name_prefix }}-Inventory"
            state: absent

        - name: Delete test host
          ansible.platform.host:
            name: "{{ name_prefix }}-Host1"
            inventory: "{{ name_prefix }}-Inventory"
            state: absent

        - name: Delete test inventory
          ansible.platform.inventory:
            name: "{{ name_prefix }}-Inventory"
            organization: "{{ controller_organization }}"
            state: absent

        - name: Delete test credential
          ansible.platform.controller_credential:
            name: "{{ name_prefix }}-Cred"
            credential_type: "{{ name_prefix }}-CredType"
            organization: "{{ controller_organization }}"
            state: absent

        - name: Delete test credential type
          ansible.platform.controller_credential_type:
            name: "{{ name_prefix }}-CredType"
            state: absent

        - name: Delete test organization
          ansible.platform.organization:
            name: "{{ name_prefix }}-Org"
            state: absent

    - name: Build combined import assets from individual exports
      ansible.builtin.set_fact:
        import_data:
          organizations: "{{ org_export.assets.organizations }}"
          credential_types: "{{ ct_export.assets.credential_types }}"
          # Credential export is verified above, but encrypted credential values
          # are intentionally excluded from the import idempotency fixture.
          execution_environments: "{{ ee_export.assets.execution_environments }}"
          notification_templates: "{{ notification_export.assets.notification_templates }}"
          # The export preserves default_environment; omit it from this direct
          # CRUD import fixture because some CI Controller deployments expose
          # non-shared execution-environment IDs across Gateway/Controller.
          projects:
            - name: "{{ project_name }}"
              organization: "{{ controller_organization }}"
              scm_type: git
              scm_url: "https://github.com/ansible/ansible-tower-samples.git"
          labels: "{{ label_export.assets.labels }}"
          inventory: "{{ inv_export.assets.inventory }}"
          inventory_sources:
            - name: "{{ inventory_source_name }}"
              inventory: "{{ name_prefix }}-Inventory"
              source: scm
              source_project: "{{ project_name }}"
              source_path: inventories/hosts.yml
              overwrite: true
          workflow_job_templates:
            - name: "{{ workflow_job_template_name }}"
              organization: "{{ controller_organization }}"

    - name: Import exported assets (should recreate everything)
      ansible.platform.import:
        assets: "{{ import_data }}"
      register: import_result

    - name: Assert import created resources
      ansible.builtin.assert:
        that:
          - import_result.changed
          - import_result.results is defined

    # =========================================================================
    - name: Verify imported dependency chain and associations
      ansible.builtin.assert:
        that:
          - import_result.results.organizations.changed == 1
          - import_result.results.credential_types.changed == 1
          - import_result.results.projects.changed == 1
          - import_result.results.labels.changed == 1
          - import_result.results.inventory_sources.changed == 1
          - import_result.results.workflow_job_templates.changed == 1

    # Phase 4: Verify recreated resources exist
    # =========================================================================
    - name: Verify organization was recreated
      ansible.platform.organization:
        name: "{{ name_prefix }}-Org"
        state: exists
      register: org_check

    - name: Assert organization exists
      ansible.builtin.assert:
        that:
          - org_check.exists

    - name: Verify inventory was recreated
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Inventory"
        organization: "{{ controller_organization }}"
        state: exists
      register: inv_check

    - name: Assert inventory exists
      ansible.builtin.assert:
        that:
          - inv_check.exists

    # =========================================================================
    # Phase 5: Idempotency — import again, expect no changes
    # =========================================================================
    - name: Import same assets again (idempotency check)
      ansible.platform.import:
        assets: "{{ import_data }}"
      register: import_idem

    - name: Assert idempotent import reports no changes
      ansible.builtin.assert:
        that:
          - not import_idem.changed
          - import_idem.results is defined

  # ===========================================================================
  # Cleanup: always delete test resources
  # ===========================================================================
  always:
    - name: Cleanup test schedule
      ansible.platform.schedule:
        name: "{{ schedule_name }}"
        state: absent
      failed_when: false

    - name: Cleanup test workflow job template
      ansible.platform.workflow_job_template:
        name: "{{ workflow_job_template_name }}"
        state: absent
      failed_when: false

    - name: Cleanup test job template
      ansible.platform.job_template:
        name: "{{ job_template_name }}"
        state: absent
      failed_when: false

    - name: Cleanup test inventory source
      ansible.platform.inventory_source:
        name: "{{ inventory_source_name }}"
        inventory: "{{ name_prefix }}-Inventory"
        state: absent
      failed_when: false

    - name: Cleanup test project
      ansible.platform.controller_project:
        name: "{{ project_name }}"
        organization: "{{ controller_organization }}"
        state: absent
      failed_when: false

    - name: Cleanup test notification template
      ansible.platform.notification_template:
        name: "{{ notification_template_name }}"
        organization: "{{ controller_organization }}"
        state: absent
      failed_when: false

    - name: Cleanup test execution environment
      ansible.platform.execution_environment:
        name: "{{ execution_environment_name }}"
        organization: "{{ controller_organization }}"
        state: absent
      failed_when: false

    - name: Cleanup test group
      ansible.platform.group:
        name: "{{ name_prefix }}-Group1"
        inventory: "{{ name_prefix }}-Inventory"
        state: absent
      failed_when: false

    - name: Cleanup test host
      ansible.platform.host:
        name: "{{ name_prefix }}-Host1"
        inventory: "{{ name_prefix }}-Inventory"
        state: absent
      failed_when: false

    - name: Cleanup test inventory
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Inventory"
        organization: "{{ controller_organization }}"
        state: absent
      failed_when: false

    - name: Cleanup test credential
      ansible.platform.controller_credential:
        name: "{{ name_prefix }}-Cred"
        credential_type: "{{ name_prefix }}-CredType"
        organization: "{{ controller_organization }}"
        state: absent
      failed_when: false

    - name: Cleanup test credential type
      ansible.platform.controller_credential_type:
        name: "{{ name_prefix }}-CredType"
        state: absent
      failed_when: false

    - name: Cleanup test organization
      ansible.platform.organization:
        name: "{{ name_prefix }}-Org"
        state: absent
      failed_when: false
...
