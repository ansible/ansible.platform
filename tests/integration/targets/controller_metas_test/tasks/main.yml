---
- name: Get collection metadata
  ansible.platform.controller_meta:
  register: controller_meta_result

- name: Verify collection metadata
  ansible.builtin.assert:
    that:
      - controller_meta_result is not changed
      - controller_meta_result.namespace == "ansible"
      - controller_meta_result.name == "platform"
      - controller_meta_result.prefix == "ansible.platform"
      - controller_meta_result.version is string
      - controller_meta_result.version | length > 0
...
