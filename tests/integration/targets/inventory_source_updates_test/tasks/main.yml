---
- name: Generate unique test ID
  ansible.builtin.set_fact:
    test_id: "{{ lookup('password', '/dev/null chars=ascii_letters length=16') }}"
  when: test_id is not defined

- name: Set name prefix for test resources
  ansible.builtin.set_fact:
    name_prefix: "AAP-Collection-Test-ISU-{{ test_id }}"

- name: Run inventory source update tests
  block:
    - name: Assert the cached Default organization is available
      ansible.builtin.assert:
        that:
          - controller_default_organization_id is defined
        fail_msg: "The shared Default organization fixture was not found."

    - name: Create a test project for inventory source update
      ansible.builtin.uri:
        url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/controller/v2/projects/"
        method: POST
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        body_format: json
        body:
          name: "{{ name_prefix }}-Project"
          organization: "{{ controller_default_organization_id }}"
          scm_type: "git"
          scm_url: "https://github.com/ansible/test-playbooks"
        status_code: [201]
      register: test_project
      delegate_to: localhost

    - name: Wait for project sync to complete
      ansible.builtin.uri:
        url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/controller/v2/projects/{{ test_project.json.id }}/"
        method: GET
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
      register: project_status
      delegate_to: localhost
      until: project_status.json is defined and project_status.json.status | default('') in ['successful', 'failed', 'error', 'canceled']
      retries: 60
      delay: 2

    - name: Assert project sync succeeded
      ansible.builtin.assert:
        that:
          - project_status.json.status == 'successful'
        fail_msg: "Project sync finished with status '{{ project_status.json.status }}', cannot proceed"

    - name: Create a test inventory for inventory source update
      ansible.builtin.uri:
        url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/controller/v2/inventories/"
        method: POST
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        body_format: json
        body:
          name: "{{ name_prefix }}-Inventory"
          organization: "{{ controller_default_organization_id }}"
        status_code: [201]
      register: test_inventory
      delegate_to: localhost

    - name: Create a separate inventory for the wrong-inventory assertion
      ansible.builtin.uri:
        url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/controller/v2/inventories/"
        method: POST
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        body_format: json
        body:
          name: "{{ name_prefix }}-Wrong-Inventory"
          organization: "{{ controller_default_organization_id }}"
        status_code: [201]
      register: wrong_inventory
      delegate_to: localhost

    - name: Create a custom-script inventory source
      ansible.builtin.uri:
        url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/controller/v2/inventory_sources/"
        method: POST
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        body_format: json
        body:
          name: "{{ name_prefix }}-Source"
          inventory: "{{ test_inventory.json.id }}"
          source: "scm"
          source_project: "{{ test_project.json.id }}"
          source_path: "inventories/create_10_hosts.ini"
        status_code: [201]
      register: test_source
      delegate_to: localhost

    - name: Trigger inventory source update without waiting
      ansible.platform.inventory_source_update:
        name: "{{ name_prefix }}-Source"
        inventory: "{{ name_prefix }}-Inventory"
        wait: false
      register: nowait_result

    - name: Assert launch returned an ID
      ansible.builtin.assert:
        that:
          - nowait_result is not failed
          - nowait_result.id is defined
          - nowait_result.changed

    - name: Trigger inventory source update with wait
      ansible.platform.inventory_source_update:
        name: "{{ name_prefix }}-Source"
        inventory: "{{ name_prefix }}-Inventory"
        wait: true
        timeout: 120
        interval: 2
      register: wait_result
      ignore_errors: true

    - name: Assert the waited sync completed successfully
      ansible.builtin.assert:
        that:
          - wait_result is not failed
          - wait_result.id is defined
          - wait_result.status == "successful"

    - name: Trigger update by numeric source ID (validates inventory ownership)
      ansible.platform.inventory_source_update:
        name: "{{ test_source.json.id }}"
        inventory: "{{ name_prefix }}-Inventory"
        wait: true
        timeout: 120
        interval: 2
      register: numeric_id_result
      ignore_errors: true

    - name: Assert numeric ID lookup succeeded within correct inventory
      ansible.builtin.assert:
        that:
          - numeric_id_result is not failed
          - numeric_id_result.id is defined
          - numeric_id_result.status == "successful"

    - name: Trigger update by numeric source ID in wrong inventory (should fail)
      ansible.platform.inventory_source_update:
        name: "{{ test_source.json.id }}"
        inventory: "{{ wrong_inventory.json.name }}"
        wait: false
      register: wrong_inventory_result
      ignore_errors: true

    - name: Assert numeric ID in wrong inventory is rejected
      ansible.builtin.assert:
        that:
          - wrong_inventory_result is failed
          - "'not found in inventory' in wrong_inventory_result.msg"

  always:
    - name: Clean up test inventory source
      ansible.builtin.uri:
        url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/controller/v2/inventory_sources/{{ test_source.json.id }}/"
        method: DELETE
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        status_code: [202, 204, 404]
      when: test_source is defined and test_source.json.id is defined
      delegate_to: localhost
      failed_when: false

    - name: Clean up test inventory
      ansible.builtin.uri:
        url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/controller/v2/inventories/{{ test_inventory.json.id }}/"
        method: DELETE
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        status_code: [202, 204, 404]
      when: test_inventory is defined and test_inventory.json.id is defined
      delegate_to: localhost
      failed_when: false

    - name: Clean up wrong test inventory
      ansible.builtin.uri:
        url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/controller/v2/inventories/{{ wrong_inventory.json.id }}/"
        method: DELETE
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        status_code: [202, 204, 404]
      when: wrong_inventory is defined and wrong_inventory.json.id is defined
      delegate_to: localhost
      failed_when: false

    - name: Clean up test project
      ansible.builtin.uri:
        url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/controller/v2/projects/{{ test_project.json.id }}/"
        method: DELETE
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        status_code: [202, 204, 404]
      when: test_project is defined and test_project.json.id is defined
      delegate_to: localhost
      failed_when: false
...
