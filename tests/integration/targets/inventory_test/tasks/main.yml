---
# Integration tests for ansible.platform.inventory

- name: Generate a test ID
  ansible.builtin.set_fact:
    test_id: "{{ lookup('password', '/dev/null chars=ascii_letters length=16') }}"
  when: test_id is not defined

- name: Preset vars
  ansible.builtin.set_fact:
    name_prefix: "AAP-Collection-Test-Inventory-{{ test_id }}"

- name: Run Test
  module_defaults:
    group/ansible.platform.controller:
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs | bool }}"

  block:
    - name: Create inventory
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Test"
        description: "Integration test inventory"
        organization: "Default"
        state: present
      register: created_inv

    - name: Assert creation changed
      ansible.builtin.assert:
        that:
          - created_inv is changed
          - created_inv.inventory.name is defined
          - created_inv.inventory.id is defined

    - name: Check idempotency
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Test"
        description: "Integration test inventory"
        organization: "Default"
        state: present
      register: idempotent_inv

    - name: Assert no change on re-apply
      ansible.builtin.assert:
        that:
          - idempotent_inv is not changed

    - name: Update inventory description
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Test"
        description: "Updated integration test inventory"
        organization: "Default"
      register: updated_inv

    - name: Assert update changed
      ansible.builtin.assert:
        that:
          - updated_inv is changed

    - name: Rename inventory
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Test"
        new_name: "{{ name_prefix }}-Renamed"
        organization: "Default"
      register: renamed_inv

    - name: Assert rename changed
      ansible.builtin.assert:
        that:
          - renamed_inv is changed

    - name: Check exists
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Renamed"
        organization: "Default"
        state: exists
      register: exists_check

    - name: Assert exists
      ansible.builtin.assert:
        that:
          - exists_check.exists

    # -- Instance group association tests --

    - name: Create an instance group for association test
      ansible.platform.instance_group:
        name: "{{ name_prefix }}-IG"
        state: present
      register: test_ig

    - name: Predict an inventory association change
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Renamed"
        organization: Default
        instance_groups: ["{{ name_prefix }}-IG"]
      check_mode: true
      register: planned_ig

    - name: Read associations after the dry run
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}/api/controller/v2/inventories/{{ created_inv.id }}/instance_groups/"
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
      register: dry_run_ig
      delegate_to: localhost

    - name: Assert the dry run predicts a change without applying it
      ansible.builtin.assert:
        that:
          - planned_ig is changed
          - dry_run_ig.json.count == 0

    - name: Associate instance group with inventory
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Renamed"
        organization: "Default"
        instance_groups:
          - "{{ name_prefix }}-IG"
      register: ig_assoc

    - name: Assert instance group association changed
      ansible.builtin.assert:
        that:
          - ig_assoc is changed

    - name: Check instance group association idempotency
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Renamed"
        organization: "Default"
        instance_groups:
          - "{{ name_prefix }}-IG"
      register: ig_assoc_idem

    - name: Assert instance group association is idempotent
      ansible.builtin.assert:
        that:
          - ig_assoc_idem is not changed

    - name: Check unchanged associations in check mode
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Renamed"
        organization: Default
        instance_groups: ["{{ name_prefix }}-IG"]
      check_mode: true
      register: unchanged_ig

    - name: Assert association check mode is idempotent
      ansible.builtin.assert:
        that: unchanged_ig is not changed

    # -- Copy (clone) tests --

    - name: Copy the inventory
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Cloned"
        copy_from: "{{ name_prefix }}-Renamed"
        organization: "Default"
        state: present
      register: cloned_inv

    - name: Assert copy changed
      ansible.builtin.assert:
        that:
          - cloned_inv.copied
          - cloned_inv is changed
          - cloned_inv.inventory.name == (name_prefix ~ '-Cloned')

    - name: Assert cloned inventory is a different resource
      ansible.builtin.assert:
        that:
          - cloned_inv.inventory.id != renamed_inv.inventory.id


    # -- Smart inventory and error-path coverage (legacy awx_collection) --

    - name: Create a smart inventory
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Smart"
        organization: "Default"
        kind: smart
        host_filter: "name=localhost"
        state: present
      register: smart_inventory

    - name: Assert smart inventory creation changed
      ansible.builtin.assert:
        that:
          - smart_inventory is changed
          - smart_inventory.inventory.kind == "smart"

    - name: Reject an invalid inventory organization
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Invalid-Organization"
        organization: "{{ name_prefix }}-does-not-exist"
        state: present
      register: invalid_organization
      ignore_errors: true

    - name: Assert invalid inventory organization is rejected
      ansible.builtin.assert:
        that:
          - invalid_organization is failed
          - invalid_organization is not changed

  always:
    - name: Delete smart inventory
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Smart"
        organization: "Default"
        state: absent
      failed_when: false

    - name: Delete cloned inventory
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Cloned"
        organization: "Default"
        state: absent
      failed_when: false

    - name: Delete instance group
      ansible.platform.instance_group:
        name: "{{ name_prefix }}-IG"
        state: absent
      failed_when: false

    - name: Delete inventory (renamed)
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Renamed"
        organization: "Default"
        state: absent
      failed_when: false

    - name: Delete inventory (original, in case rename failed)
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Test"
        organization: "Default"
        state: absent
      failed_when: false
...
