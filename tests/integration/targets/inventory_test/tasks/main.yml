---
# Integration tests for ansible.platform.inventory

- name: Generate a test ID
  ansible.builtin.set_fact:
    test_id: "{{ lookup('password', '/dev/null chars=ascii_letters length=16') }}"
  when: test_id is not defined

- name: Preset vars
  ansible.builtin.set_fact:
    name_prefix: "AAP-Collection-Test-Inventory-{{ test_id }}"

- name: Run Test
  module_defaults:
    group/ansible.platform.controller:
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs | bool }}"

  block:
    - name: Create inventory
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Test"
        description: "Integration test inventory"
        organization: "Default"
        state: present
      register: created_inv

    - name: Assert creation changed
      ansible.builtin.assert:
        that:
          - created_inv is changed
          - created_inv.inventory.name is defined
          - created_inv.inventory.id is defined

    - name: Check idempotency
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Test"
        description: "Integration test inventory"
        organization: "Default"
        state: present
      register: idempotent_inv

    - name: Assert no change on re-apply
      ansible.builtin.assert:
        that:
          - idempotent_inv is not changed

    - name: Update inventory description
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Test"
        description: "Updated integration test inventory"
        organization: "Default"
      register: updated_inv

    - name: Assert update changed
      ansible.builtin.assert:
        that:
          - updated_inv is changed

    - name: Rename inventory
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Test"
        new_name: "{{ name_prefix }}-Renamed"
        organization: "Default"
      register: renamed_inv

    - name: Assert rename changed
      ansible.builtin.assert:
        that:
          - renamed_inv is changed

    - name: Check exists
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Renamed"
        organization: "Default"
        state: exists
      register: exists_check

    - name: Assert exists
      ansible.builtin.assert:
        that:
          - exists_check.exists

    # -- Instance group association tests --

    - name: Create an instance group for association test
      ansible.platform.instance_group:
        name: "{{ name_prefix }}-IG"
        state: present
      register: test_ig

    - name: Associate instance group with inventory
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Renamed"
        organization: "Default"
        instance_groups:
          - "{{ name_prefix }}-IG"
      register: ig_assoc

    - name: Assert instance group association changed
      ansible.builtin.assert:
        that:
          - ig_assoc is changed

    - name: Check instance group association idempotency
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Renamed"
        organization: "Default"
        instance_groups:
          - "{{ name_prefix }}-IG"
      register: ig_assoc_idem

    - name: Assert instance group association is idempotent
      ansible.builtin.assert:
        that:
          - ig_assoc_idem is not changed

    # -- Copy (clone) tests --

    - name: Copy the inventory
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Cloned"
        copy_from: "{{ name_prefix }}-Renamed"
        organization: "Default"
        state: present
      register: cloned_inv

    - name: Assert copy changed
      ansible.builtin.assert:
        that:
          - cloned_inv is changed
          - cloned_inv.inventory.name == (name_prefix ~ '-Cloned')

    - name: Assert cloned inventory is a different resource
      ansible.builtin.assert:
        that:
          - cloned_inv.inventory.id != renamed_inv.inventory.id

  always:
    - name: Delete cloned inventory
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Cloned"
        organization: "Default"
        state: absent
      failed_when: false

    - name: Delete instance group
      ansible.platform.instance_group:
        name: "{{ name_prefix }}-IG"
        state: absent
      failed_when: false

    - name: Delete inventory (renamed)
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Renamed"
        organization: "Default"
        state: absent
      failed_when: false

    - name: Delete inventory (original, in case rename failed)
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Test"
        organization: "Default"
        state: absent
      failed_when: false
...
