---
- name: Generate a test ID
  ansible.builtin.set_fact:
    test_id: "{{ lookup('password', '/dev/null chars=ascii_letters length=16') }}"
  when: test_id is not defined

- name: Preset vars
  ansible.builtin.set_fact:
    name_prefix: "AAP-Collection-Test-Inventory-{{ test_id }}"

- name: Run Test
  module_defaults:
    group/ansible.platform.gateway:
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs | bool }}"

  block:
    # <Organizations> -----------------------------
    - name: Create Organization 1
      ansible.platform.organization:
        name: "{{ name_prefix }}-Organization-1"
      register: org1
    # </Organizations> ----------------------------

    - name: Create inventory
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Inventory-1"
        organization: "{{ org1.name }}"
        description: "Our Foo Cloud Servers"
        variables:
          foo: bar
      register: inv1

    - name: Assert creation changed
      ansible.builtin.assert:
        that:
          - inv1 is changed
          - inv1.inventory.name is defined
          - inv1.id is defined

    - name: Check idempotency (re-apply, expect no change)
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Inventory-1"
        organization: "{{ org1.name }}"
        description: "Our Foo Cloud Servers"
        variables:
          foo: bar
      register: inv1_idempotent

    - name: Assert no change on re-apply
      ansible.builtin.assert:
        that:
          - inv1_idempotent is not changed
          - inv1_idempotent.id == inv1.id

    - name: Update inventory description
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Inventory-1"
        organization: "{{ org1.name }}"
        description: "Updated description"
      register: inv1_updated

    - name: Assert update changed
      ansible.builtin.assert:
        that:
          - inv1_updated is changed
          - inv1_updated.id == inv1.id

    - name: Check exists returns true
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Inventory-1"
        organization: "{{ org1.name }}"
        state: exists
      register: inv1_exists

    - name: Assert exists is true and no change
      ansible.builtin.assert:
        that:
          - inv1_exists.exists
          - inv1_exists is not changed

    - name: Rename inventory
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Inventory-1"
        new_name: "{{ name_prefix }}-Inventory-1-Renamed"
        organization: "{{ org1.name }}"
      register: inv1_renamed

    - name: Assert rename changed
      ansible.builtin.assert:
        that:
          - inv1_renamed is changed
          - inv1_renamed.id == inv1.id

    - name: Copy inventory
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Inventory-Copy"
        copy_from: "{{ name_prefix }}-Inventory-1-Renamed"
        organization: "{{ org1.name }}"
      register: inv_copy

    - name: Assert copy created a distinct inventory
      ansible.builtin.assert:
        that:
          - inv_copy is changed
          - inv_copy.id is defined
          - inv_copy.id != inv1.id

    - name: Create a constructed inventory with input_inventories
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Constructed"
        organization: "{{ org1.name }}"
        kind: constructed
        input_inventories:
          - "{{ name_prefix }}-Inventory-1-Renamed"
      register: inv_constructed

    - name: Assert constructed inventory created
      ansible.builtin.assert:
        that:
          - inv_constructed is changed
          - inv_constructed.kind == "constructed"

    - name: Re-apply constructed inventory (idempotent on input_inventories)
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Constructed"
        organization: "{{ org1.name }}"
        kind: constructed
        input_inventories:
          - "{{ name_prefix }}-Inventory-1-Renamed"
      register: inv_constructed_idempotent

    - name: Assert no change on re-apply
      ansible.builtin.assert:
        that:
          - inv_constructed_idempotent is not changed

    - name: Delete inventory
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Inventory-1-Renamed"
        organization: "{{ org1.name }}"
        state: absent
      register: inv1_deleted

    - name: Assert delete changed
      ansible.builtin.assert:
        that:
          - inv1_deleted is changed

    - name: Delete inventory again (idempotent)
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Inventory-1-Renamed"
        organization: "{{ org1.name }}"
        state: absent
      register: inv1_deleted_again

    - name: Assert repeat delete is a no-op
      ansible.builtin.assert:
        that:
          - inv1_deleted_again is not changed

  always:
    - name: Delete constructed inventory
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Constructed"
        organization: "{{ org1.name }}"
        state: absent
      when: org1 is defined and "id" in org1

    - name: Delete copied inventory
      ansible.platform.inventory:
        name: "{{ name_prefix }}-Inventory-Copy"
        organization: "{{ org1.name }}"
        state: absent
      when: org1 is defined and "id" in org1

    - name: Delete Organization 1
      ansible.platform.organization:
        name: "{{ org1.name }}"
        state: absent
      when: org1 is defined and "id" in org1
...
