---
# Exercise instance reads and updates against an existing Controller instance.
# Creation and deprovisioning require an OpenShift/Kubernetes Controller.

- name: Get existing Controller instances
  ansible.builtin.set_fact:
    controller_instances: "{{ query('ansible.platform.gateway_api', 'api/controller/v2/instances/', **connection_info) }}"

- name: Assert an instance with a capacity adjustment is available
  ansible.builtin.assert:
    that:
      - controller_instances | selectattr('capacity_adjustment', 'defined') | list | length > 0
    fail_msg: "This test needs an existing Controller instance with a capacity adjustment."

- name: Select an instance and record its original capacity adjustment
  ansible.builtin.set_fact:
    test_instance: "{{ controller_instances | selectattr('capacity_adjustment', 'defined') | list | first }}"

- name: Record the original capacity adjustment
  ansible.builtin.set_fact:
    original_capacity_adjustment: "{{ test_instance.capacity_adjustment | float }}"

- name: Generate a test ID
  ansible.builtin.set_fact:
    test_id: "{{ lookup('password', '/dev/null chars=ascii_letters length=16') }}"
  when: test_id is not defined

- name: Derive unique capacity values from test_id (avoids collision between parallel CI jobs)
  ansible.builtin.set_fact:
    _baseline_cap: "{{ ((test_id | hash('md5') | int(base=16)) % 20 + 20) / 100.0 }}"
    _different_cap: "{{ ((test_id | hash('md5') | int(base=16)) % 20 + 60) / 100.0 }}"

- name: Run Test
  module_defaults:
    group/ansible.platform.controller:
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs | bool }}"

  block:
    - name: Set a known baseline capacity (unique per test run)
      ansible.platform.instance:
        hostname: "{{ test_instance.hostname }}"
        capacity_adjustment: "{{ _baseline_cap }}"
      register: baseline_result

    - name: Assert baseline was applied
      ansible.builtin.assert:
        that:
          - baseline_result.instance.capacity_adjustment | float == _baseline_cap | float

    - name: Check mode with same value is idempotent
      ansible.platform.instance:
        hostname: "{{ test_instance.hostname }}"
        capacity_adjustment: "{{ _baseline_cap }}"
      check_mode: true
      register: check_mode_same

    - name: Assert check mode with same value reports no change
      ansible.builtin.assert:
        that:
          - check_mode_same is not changed

    - name: Check mode with different value predicts change
      ansible.platform.instance:
        hostname: "{{ test_instance.hostname }}"
        capacity_adjustment: "{{ _different_cap }}"
      check_mode: true
      register: check_mode_diff

    - name: Assert check mode predicts a change
      ansible.builtin.assert:
        that:
          - check_mode_diff is changed

    - name: Verify check mode did not actually change the instance
      ansible.builtin.set_fact:
        instance_after_check_mode: >-
          {{ (query('ansible.platform.gateway_api', 'api/controller/v2/instances/',
          query_params={'hostname': test_instance.hostname}, **connection_info) | first).capacity_adjustment | float }}

    - name: Assert check mode left the instance at baseline
      ansible.builtin.assert:
        that:
          - instance_after_check_mode | float == _baseline_cap | float

    - name: Update capacity adjustment to different value
      ansible.platform.instance:
        hostname: "{{ test_instance.hostname }}"
        capacity_adjustment: "{{ _different_cap }}"
      register: updated_instance

    - name: Assert update changed the requested field
      ansible.builtin.assert:
        that:
          - updated_instance is changed
          - updated_instance.instance.capacity_adjustment | float == _different_cap | float

    - name: Check idempotency
      ansible.platform.instance:
        hostname: "{{ test_instance.hostname }}"
        capacity_adjustment: "{{ _different_cap }}"
      register: idempotent_instance

    - name: Assert no change on re-apply
      ansible.builtin.assert:
        that:
          - idempotent_instance is not changed

    - name: Check exists
      ansible.platform.instance:
        hostname: "{{ test_instance.hostname }}"
        state: exists
      register: exists_check

    - name: Assert instance exists
      ansible.builtin.assert:
        that:
          - exists_check.exists

  always:
    - name: Restore original capacity adjustment
      ansible.platform.instance:
        hostname: "{{ test_instance.hostname }}"
        capacity_adjustment: "{{ original_capacity_adjustment }}"
      when:
        - test_instance is defined
        - original_capacity_adjustment is defined
...
