---
- name: Load existing service keys
  ansible.builtin.set_fact:
    existing_service_keys: "{{ query('ansible.platform.gateway_api', 'service_keys', **connection_info) }}"

- name: Ensure a service key is available for update tests
  ansible.builtin.fail:
    msg: Create a service key before running this edit-only integration test.
  when: existing_service_keys | length == 0

- name: Generate a missing service key name
  ansible.builtin.set_fact:
    missing_service_key_name: "GW-Collection-Test-Missing-{{ lookup('password', '/dev/null chars=ascii_letters length=16') }}"

- name: Run service key edit-only tests
  module_defaults:
    group/ansible.platform.gateway:
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs | bool }}"

  block:
    - name: Verify an unchanged service key is idempotent
      ansible.platform.service_key:
        name: "{{ existing_service_keys[0].name }}"
        is_active: "{{ existing_service_keys[0].is_active }}"
      register: unchanged_service_key

    - name: Assert the unchanged service key was not modified
      ansible.builtin.assert:
        that:
          - unchanged_service_key is not changed

    - name: Verify check mode detects a service key update
      ansible.platform.service_key:
        name: "{{ existing_service_keys[0].name }}"
        is_active: "{{ not existing_service_keys[0].is_active }}"
      check_mode: true
      register: planned_service_key_update

    - name: Assert check mode would modify the service key
      ansible.builtin.assert:
        that:
          - planned_service_key_update is changed

    - name: Update the service key active state
      ansible.platform.service_key:
        name: "{{ existing_service_keys[0].name }}"
        is_active: "{{ not existing_service_keys[0].is_active }}"
      register: updated_service_key

    - name: Assert the service key was updated
      ansible.builtin.assert:
        that:
          - updated_service_key is changed

    - name: Reject creation of a missing service key
      ansible.platform.service_key:
        name: "{{ missing_service_key_name }}"
        is_active: true
      register: missing_service_key
      ignore_errors: true

    - name: Assert a missing service key fails instead of being created
      ansible.builtin.assert:
        that:
          - missing_service_key is failed
          - "'only supports editing existing resources' in missing_service_key.msg"

  always:
    - name: Restore the original service key active state
      ansible.platform.service_key:
        name: "{{ existing_service_keys[0].name }}"
        is_active: "{{ existing_service_keys[0].is_active }}"
      when: updated_service_key is defined and updated_service_key is changed
...
