---
- name: Generate a test ID
  ansible.builtin.set_fact:
    test_id: "{{ lookup('password', '/dev/null chars=ascii_letters length=16') }}"
  when: test_id is not defined

- name: Preset vars
  ansible.builtin.set_fact:
    name_prefix: "GW-Collection-Test-ServiceKeys-{{ test_id }}"

- name: Get existing service clusters
  ansible.builtin.set_fact:
    _sc_query: "{{ query('ansible.platform.gateway_api', 'service_clusters', **connection_info) }}"

- name: Fail if more than one service cluster or that cluster is not a gateway cluster
  ansible.builtin.fail:
    msg: "This test works with 3 service clusters: gateway, eda and hub. It appears you might already have one or more of those, failing"
  when:
    - _sc_query | length > 1
    - _sc_query | length != 1 and _sc_query[0].name != 'gateway'

- name: Run Test
  module_defaults:
    group/ansible.platform.gateway:
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs | bool }}"

  block:
    # <Service Clusters> ----------------------------
    - name: Create Controller Service Type
      ansible.platform.service_type:
        name: "{{ test_id }}controller"
        ping_url: "/api/ping/"
        login_path: "/api/login/"
        logout_path: "/api/logout/"
        service_index_path: "/api/service-index/"
      register: controller_st

    - name: Create Controller Service Cluster
      ansible.platform.service_cluster:
        name: "Automation Controller"
        service_type: "{{ controller_st.id }}"
      register: controller_sc

    - name: Create Hub Service Type
      ansible.platform.service_type:
        name: "{{ test_id }}hub"
        ping_url: "/api/ping/"
        login_path: "/api/login/"
        logout_path: "/api/logout/"
        service_index_path: "/api/service-index/"
      register: hub_st

    - name: Create Hub Service Cluster
      ansible.platform.service_cluster:
        name: Automation Hub
        service_type: "{{ hub_st.id }}"
      register: hub_sc

    - name: Create EDA Service Type
      ansible.platform.service_type:
        name: "{{ test_id }}eda"
        ping_url: "/api/ping/"
        login_path: "/api/login/"
        logout_path: "/api/logout/"
        service_index_path: "/api/service-index/"
      register: eda_st

    - name: "Create EDA Service Cluster"
      ansible.platform.service_cluster:
        name: Event Driven Automation
        service_type: "{{ eda_st.id }}"
      register: eda_sc
    # </Service Clusters> ----------------------------

    # <Service Keys> ----------------------------
    - name: Create Service Key 1 with check mode
      ansible.platform.service_key:
        name: "{{ name_prefix }}-Key 1"
        service_cluster: "{{ controller_sc.id }}"
        algorithm: "HS256"
        mark_previous_inactive: False
      register: check_mode_create

    - name: Include old tests
      ansible.builtin.include_tasks: "creatable.yml"
      when: check_mode_create.warnings | default([]) | length == 0

    - name: Include new tests
      ansible.builtin.include_tasks: "editable.yml"
      when: check_mode_create.warnings | default([]) | length > 0

  always:
    # Always Cleanup
    - name: Delete Service Clusters
      ansible.platform.service_cluster:
        name: "{{ vars[item].id }}"
        state: absent
      loop:
        - "controller_sc"
        - "hub_sc"
        - "eda_sc"
      when: "item in vars and 'id' in vars[item]"

    - name: Delete Service Types
      ansible.platform.service_type:
        name: "{{ item.name }}"
        state: absent
      loop: "{{ gateway_service_types }}"
      vars:
        gateway_service_types:
          - name: "{{ test_id }}controller"
          - name: "{{ test_id }}hub"
          - name: "{{ test_id }}eda"
...
