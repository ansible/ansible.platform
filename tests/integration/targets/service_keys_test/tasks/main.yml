---
- name: Skip service_keys test for non-http-direct modes (parallel runs race on shared state)
  ansible.builtin.meta: end_host
  when: connection_mode | default('local') != 'http-direct'

- name: Generate a test ID
  ansible.builtin.set_fact:
    test_id: "{{ lookup('password', '/dev/null chars=ascii_letters length=16') }}"
  when: test_id is not defined

- name: Set test variables
  ansible.builtin.set_fact:
    non_existent_service_key_name: "GW-Collection-Test-Service-Key-{{ test_id }}-DNE"
# The service-key API no longer creates keys. The integration environment must
# provision this fixture before running the edit-only tests.
- name: Generate a missing service key name
  ansible.builtin.set_fact:
    test_service_key_name: "{{ aap_test_service_key_name | default('GW-Collection-Test-Service-Key') }}"

- name: Generate a non-existent service key name
  ansible.builtin.set_fact:
    non_existent_service_key_name: >-
      {{ test_service_key_name }}-{{ lookup('password', '/dev/null chars=ascii_letters length=16') }}

- name: Look up existing bootstrap service keys
  ansible.builtin.set_fact:
    bootstrap_keys: >-
      {{ query('ansible.platform.gateway_api', 'service_keys', **connection_info) }}

- name: Skip if no bootstrap service keys exist
  ansible.builtin.meta: end_play
  when: bootstrap_keys | length == 0

- name: Select a bootstrap service key for testing (distributed for parallel safety)
  ansible.builtin.set_fact:
    _key_index: "{{ range(bootstrap_keys | length) | random(seed=test_id) }}"

- name: Set test service key variables
  ansible.builtin.set_fact:
    test_service_key_name: "{{ bootstrap_keys[_key_index | int].name }}"
    original_is_active: "{{ bootstrap_keys[_key_index | int].is_active }}"

- name: Run service key tests
  module_defaults:
    group/ansible.platform.gateway:
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs | bool }}"

  block:
    - name: Verify the bootstrap service key exists
    - name: Look up the fixture service key
      ansible.builtin.set_fact:
        fixture_service_keys: >-
          {{ query(
               'ansible.platform.gateway_api',
               'service_keys',
               query_params={'name': test_service_key_name},
               **connection_info
             ) }}

    - name: Require the integration environment to provision the fixture service key
      ansible.builtin.assert:
        that:
          - fixture_service_keys | length == 1
        fail_msg: >-
          The integration environment must pre-provision {{ test_service_key_name }}.
          Service keys cannot be created through the API, and the test runner cannot
          execute management commands inside the Gateway host.

    - name: Save the fixture service key's initial active state
      ansible.builtin.set_fact:
        fixture_service_key_initial_is_active: "{{ fixture_service_keys[0].is_active }}"

    - name: Verify the fixture service key exists
      ansible.platform.service_key:
        name: "{{ test_service_key_name }}"
        state: exists
      register: service_key

    - name: Assert the bootstrap service key exists
      ansible.builtin.assert:
        that:
          - service_key.exists

    - name: Set the service key is_active to true to ensure starting state
      ansible.platform.service_key:
        name: "{{ test_service_key_name }}"
        is_active: true

    - name: Verify an unchanged service key is idempotent
      ansible.platform.service_key:
        name: "{{ test_service_key_name }}"
        is_active: true
      register: unchanged_service_key

    - name: Assert the unchanged service key was not modified
      ansible.builtin.assert:
        that:
          - unchanged_service_key is not changed

    - name: Warn and ignore deprecated service key creation fields
      ansible.platform.service_key:
        name: "{{ test_service_key_name }}"
        is_active: true
        service_cluster: gateway
        secret: ignored-secret
        secret_length: 32
        mark_previous_inactive: true
        algorithm: HS256
      register: deprecated_service_key_fields

    - name: Assert deprecated creation fields are ignored
      ansible.builtin.assert:
        that:
          - deprecated_service_key_fields is not changed
          - deprecated_service_key_fields.deprecations | length == 5

    - name: Verify check mode detects a service key update
      ansible.platform.service_key:
        name: "{{ test_service_key_name }}"
        is_active: false
      check_mode: true
      register: planned_service_key_update

    - name: Assert check mode would modify the service key
      ansible.builtin.assert:
        that:
          - planned_service_key_update is changed

    - name: Update the service key active state
      ansible.platform.service_key:
        name: "{{ test_service_key_name }}"
        is_active: false
      register: updated_service_key

    - name: Assert the service key was updated
      ansible.builtin.assert:
        that:
          - updated_service_key is changed

    - name: Attempt to use a missing service key
      ansible.platform.service_key:
        name: "{{ non_existent_service_key_name }}"
        is_active: true
      register: missing_service_key
      ignore_errors: true

    - name: Assert operating on a missing service key fails
      ansible.builtin.assert:
        that:
          - missing_service_key is failed

    - name: Delete a non-existent service key
      ansible.platform.service_key:
        name: "{{ non_existent_service_key_name }}"
        state: absent
      register: deleted_non_existent_service_key

    - name: Assert deletion of a non-existent service key didn't fail
      ansible.builtin.assert:
        that:
          - deleted_non_existent_service_key is not changed

  always:
    - name: Restore bootstrap service key to original state
      ansible.platform.service_key:
        name: "{{ test_service_key_name }}"
        is_active: "{{ original_is_active | bool }}"
      when: test_service_key_name is defined
      failed_when: false
    - name: Restore the fixture service key's initial active state
      ansible.platform.service_key:
        name: "{{ test_service_key_name }}"
        is_active: "{{ fixture_service_key_initial_is_active }}"
      when: fixture_service_key_initial_is_active is defined
...
