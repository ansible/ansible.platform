---
- name: Generate a test ID
  ansible.builtin.set_fact:
    test_id: "{{ lookup('password', '/dev/null chars=ascii_letters length=16') }}"
  when: test_id is not defined

- name: Generate names
  ansible.builtin.set_fact:
    username: "Gateway-Collection-tests-stale-user-{{ test_id }}"

- name: Run Stale Socket Recovery Tests
  module_defaults:
    group/ansible.platform.gateway:
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs | bool }}"
  vars:
    ansible_connection: ansible.platform.http
    ansible_platform_use_persistent_connection: true

  block:
    - name: Trigger the initial manager spawn
      ansible.platform.user:
        username: "{{ username }}"
        first_name: Initial
        password: "{{ 65535 | random | to_uuid }}"
        state: present
      register: initial_run

    - name: Assert the initial run was successful
      ansible.builtin.assert:
        that:
          - initial_run is changed

    - name: Capture manager facts from initial run when available
      ansible.builtin.set_fact:
        detected_socket_path: >-
          {{
            initial_run.ansible_facts.platform_manager_socket
            | default(hostvars[inventory_hostname].platform_manager_socket, true)
            | default('', true)
          }}
        detected_authkey: >-
          {{
            initial_run.ansible_facts.platform_manager_authkey
            | default(hostvars[inventory_hostname].platform_manager_authkey, true)
            | default('ZHVtbXlfa2V5', true)
          }}

    - name: Find generated socket path via tempdir fallback
      ansible.builtin.shell: |
        python3 - <<'PY'
        import glob
        import os
        import tempfile
        socket_dir = os.path.join(tempfile.gettempdir(), "ansible_platform")
        sockets = sorted(glob.glob(os.path.join(socket_dir, "manager_*.sock")))
        print(sockets[-1] if sockets else "")
        PY
      register: found_socket_cmd
      changed_when: false
      when: detected_socket_path | length == 0
      vars:
        ansible_connection: local

    - name: Set socket path from fallback when needed
      ansible.builtin.set_fact:
        detected_socket_path: "{{ found_socket_cmd.stdout | trim }}"
      when: detected_socket_path | length == 0

    - name: Assert a manager socket was found
      ansible.builtin.assert:
        that:
          - detected_socket_path | length > 0

    - name: Force facts so the next task attempts reuse
      ansible.builtin.set_fact:
        platform_manager_socket: "{{ detected_socket_path }}"
        platform_manager_authkey: "{{ detected_authkey }}"

    - name: Simulate sudden manager crash (OOM Kill / Eviction)
      ansible.builtin.shell: |
        echo "Killing manager process to orphan the socket..."
        pkill -9 -f "manager_process.py"
      register: kill_result
      changed_when: kill_result.rc == 0
      failed_when: kill_result.rc not in [0, 1]
      vars:
        ansible_connection: local

    - name: Execute another task to trigger recovery
      ansible.platform.user:
        username: "{{ username }}"
        first_name: Recovered
        state: present
      register: recovery_run

    - name: Assert recovery was successful
      ansible.builtin.assert:
        that:
          - recovery_run is not failed
          - recovery_run is changed
          - recovery_run.user.first_name == "Recovered"
        fail_msg: "The connection plugin tripped over the stale socket instead of recovering."

  always:
    - name: Delete users
      ansible.platform.user:
        username: "{{ item }}"
        state: absent
      loop:
        - "{{ username }}"
      register: delete_results
      failed_when:
        - delete_results is failed
        - "'404' not in delete_results.msg | default('')"

    - name: Cleanup orphaned test sockets
      ansible.builtin.shell: |
        python3 - <<'PY'
        import glob
        import os
        import tempfile
        socket_dir = os.path.join(tempfile.gettempdir(), "ansible_platform")
        for path in glob.glob(os.path.join(socket_dir, "manager_*.sock*")):
            try:
                os.remove(path)
            except FileNotFoundError:
                pass
        PY
      register: rm_result
      changed_when: false
      failed_when: rm_result.rc != 0
      vars:
        ansible_connection: local
...
