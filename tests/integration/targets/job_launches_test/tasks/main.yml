---
- name: Generate a unique test identifier
  ansible.builtin.set_fact:
    test_id: "{{ lookup('password', '/dev/null chars=ascii_letters length=16') }}"
  when: test_id is not defined

- name: Set test resource names
  ansible.builtin.set_fact:
    test_inventory_name: "AAP-Collection-Test-JobLaunch-{{ test_id }}-Inventory"
    test_host_name: "AAP-Collection-Test-JobLaunch-{{ test_id }}-localhost"
    test_job_template_name: "AAP-Collection-Test-JobLaunch-{{ test_id }}"

- name: Exercise job_launch with a test-owned job template
  module_defaults:
    group/ansible.platform.controller:
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs | bool }}"
  block:
    - name: Create a test inventory
      ansible.platform.inventory:
        name: "{{ test_inventory_name }}"
        organization: Default
        state: present
      register: test_inventory

    - name: Add localhost to the test inventory
      ansible.platform.host:
        name: "{{ test_host_name }}"
        inventory: "{{ test_inventory_name }}"
        variables:
          ansible_connection: local
        state: present
      register: test_host

    - name: Create a job template that accepts inventory prompts
      ansible.platform.job_template:
        name: "{{ test_job_template_name }}"
        project: Demo Project
        playbook: hello_world.yml
        inventory: "{{ test_inventory_name }}"
        ask_inventory_on_launch: true
        state: present
      register: test_jt

    - name: Assert test job template exists
      ansible.builtin.assert:
        that:
          - test_jt.job_template.id is defined

    - name: Launch the test job template
      ansible.platform.job_launch:
        name: "{{ test_job_template_name }}"
        inventory: "{{ test_inventory_name }}"
        wait: true
        interval: 2
        timeout: 300
      register: launched_job

    - name: Assert the launched job completed successfully
      ansible.builtin.assert:
        that:
          - launched_job is changed
          - launched_job.id is defined
          - launched_job.status == 'successful'
          - launched_job.elapsed is number
          - launched_job.started is string
          - launched_job.finished is sameas true
          - launched_job.finished_at is string

  always:
    - name: Remove the test job template
      ansible.platform.job_template:
        name: "{{ test_job_template_name }}"
        state: absent
      when: test_id is defined
      failed_when: false

    - name: Remove the test host
      ansible.platform.host:
        name: "{{ test_host_name }}"
        inventory: "{{ test_inventory_name }}"
        state: absent
      when: test_id is defined
      failed_when: false

    - name: Remove the test inventory
      ansible.platform.inventory:
        name: "{{ test_inventory_name }}"
        organization: Default
        state: absent
      when: test_id is defined
      failed_when: false
...
