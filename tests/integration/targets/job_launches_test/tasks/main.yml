---
- name: Generate a unique test identifier
  ansible.builtin.set_fact:
    test_id: "{{ lookup('password', '/dev/null chars=ascii_letters length=16') }}"
  when: test_id is not defined

- name: Exercise job_launch with a test-owned job template
  module_defaults:
    group/ansible.platform.controller:
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs | bool }}"
  block:
    - name: Create a job template that accepts inventory prompts
      ansible.platform.job_template:
        name: "AAP-Collection-Test-JobLaunch-{{ test_id }}"
        project: "Demo Project"
        playbook: hello_world.yml
        inventory: "Demo Inventory"
        ask_inventory_on_launch: true
        state: present
      register: test_jt

    - name: Assert test job template exists
      ansible.builtin.assert:
        that:
          - test_jt.job_template.id is defined

    - name: Launch the test job template
      ansible.platform.job_launch:
        name: "AAP-Collection-Test-JobLaunch-{{ test_id }}"
        inventory: "Demo Inventory"
        wait: true
        interval: 2
        timeout: 300
      register: launched_job

    - name: Assert the launched job completed successfully
      ansible.builtin.assert:
        that:
          - launched_job is changed
          - launched_job.id is defined
          - launched_job.status == 'successful'

  always:
    - name: Remove the test job template
      ansible.platform.job_template:
        name: "AAP-Collection-Test-JobLaunch-{{ test_id }}"
        state: absent
      when: test_id is defined and test_jt is defined and test_jt is succeeded
      failed_when: false
...
