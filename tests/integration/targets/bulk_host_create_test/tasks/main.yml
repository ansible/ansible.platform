---
- name: Run Tests
  module_defaults:
    group/ansible.platform.gateway:
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs | bool }}"

  block:
    - name: Bulk create hosts with non-existent inventory (should fail)
      ansible.platform.bulk_host_create:
        inventory: "NonExistent_Inventory_999"
        hosts:
          - name: test-host-1
      register: bulk_result
      ignore_errors: true

    - name: Assert non-existent inventory produces error
      ansible.builtin.assert:
        that:
          - bulk_result is failed
...
