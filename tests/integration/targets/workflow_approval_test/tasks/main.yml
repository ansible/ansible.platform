---
- name: Run Tests
  module_defaults:
    group/ansible.platform.gateway:
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs | bool }}"

  block:
    - name: Approve non-existent workflow (should fail/timeout)
      ansible.platform.workflow_approval:
        workflow_job_id: 999999999
        name: "nonexistent_approval"
        timeout: 3
        interval: 1
      register: approval_result
      ignore_errors: true

    - name: Assert non-existent workflow produces error
      ansible.builtin.assert:
        that:
          - approval_result is failed
...
