---
- name: Generate a test ID
  ansible.builtin.set_fact:
    test_id: "{{ lookup('password', '/dev/null chars=ascii_letters length=16') }}"
  when: test_id is not defined

- name: Preset vars
  ansible.builtin.set_fact:
    test_role_name: "GW-Collection-Test-Role-{{ test_id }}"

- name: Run Tests
  module_defaults:
    group/ansible.platform.gateway:
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs | bool }}"

  block:
    - name: Create an role with check mode
      ansible.platform.role_definition:
        name: "{{ test_role_name }}"
        description: Grants view access to an organization
        content_type: shared.organization
        permissions:
          - shared.view_organization
      check_mode: true

    - name: Search for the role
      ansible.builtin.set_fact:
        item_that_should_not_exist: "{{ lookup('ansible.platform.gateway_api', 'role_definitions',
          query_params={'name': '{{ test_role_name }}'}, **connection_info) }}"

    - name: Assert that role does not exist
      ansible.builtin.assert:
        that:
          - item_that_should_not_exist is not defined or item_that_should_not_exist | length == 0
        fail_msg: "role '{{ test_role_name }}' exists in the system!"

    - name: Create Roles
      ansible.platform.role_definition:
        name: "{{ test_role_name }}"
        description: "Has member permission to a single organization"
        content_type: shared.organization
        permissions:
          - shared.view_organization
      register: role

    - name: Assert a creation changes the system
      ansible.builtin.assert:
        that:
          - role is changed

    - name: Recreate an role
      ansible.platform.role_definition:
        name: "{{ test_role_name }}"
        description: "Has member permission to a single organization"
        content_type: shared.organization
        permissions:
          - shared.view_organization
      register: recreate_role

    - name: Assert that a recreate does not change the system
      ansible.builtin.assert:
        that:
          - recreate_role is not changed

    - name: Probe EDA service availability
      ansible.builtin.uri:
        url: "{{ gateway_hostname | regex_replace('/$', '') }}/api/eda/v1/"
        user: "{{ gateway_username }}"
        password: "{{ gateway_password }}"
        force_basic_auth: true
        validate_certs: "{{ gateway_validate_certs | bool }}"
        status_code: [200, 401, 403]
      register: eda_probe
      failed_when: false
      delegate_to: localhost

    - name: Set EDA availability fact
      ansible.builtin.set_fact:
        eda_available: "{{ eda_probe.status | default(0) in [200, 401, 403] }}"

    - name: Create role with multiple permissions (EDA)
      ansible.platform.role_definition:
        name: "{{ test_role_name }}-multi"
        description: "Multi-permission idempotency test role"
        content_type: eda.project
        permissions:
          - eda.change_project
          - eda.view_project
      register: role_multi
      when: eda_available

    - name: Assert multi-permission create changed the system
      ansible.builtin.assert:
        that:
          - role_multi is changed
      when: eda_available

    - name: Recreate multi-permission role with permissions in reversed order
      ansible.platform.role_definition:
        name: "{{ test_role_name }}-multi"
        description: "Multi-permission idempotency test role"
        content_type: eda.project
        permissions:
          - eda.view_project
          - eda.change_project
      register: recreate_role_multi
      when: eda_available

    - name: Assert multi-permission idempotency — order must not matter
      ansible.builtin.assert:
        that:
          - recreate_role_multi is not changed
        fail_msg: "Multi-permission idempotency failed — permissions list comparison must be order-insensitive."
      when: eda_available

    - name: Alter an existing role by ID
      ansible.platform.role_definition:
        name: "{{ role.id }}"
        description: "Some updates in role"
        content_type: shared.organization
        permissions:
          - shared.view_organization
      register: role_change

    - name: Assert that an role change changes the system
      ansible.builtin.assert:
        that:
          - role_change is changed

    - name: Rename an role
      ansible.platform.role_definition:
        name: "{{ test_role_name }}"
        new_name: "new-{{ test_role_name }}"
        content_type: shared.organization
        permissions:
          - shared.view_organization
      register: rename_role

    - name: Assert the rename of an role changes the existing item
      ansible.builtin.assert:
        that:
          - rename_role is changed
          - role.id == rename_role.id

    - name: Delete a non-existent role
      ansible.platform.role_definition:
        name: "{{ test_role_name }}"
        content_type: shared.organization
        permissions:
          - shared.view_organization
        state: absent
      register: role_delete

    - name: Assert that the deletion of a non-existent role does not fail or change the system
      ansible.builtin.assert:
        that:
          role_delete is not changed

    - name: Delete an role
      ansible.platform.role_definition:
        name: "{{ role.id }}"
        content_type: shared.organization
        permissions:
          - shared.view_organization
        state: absent
      register: role_delete

    - name: Assert that the deletion of a valid or changes the system
      ansible.builtin.assert:
        that:
          - role_delete is changed

  always:
    - name: Delete Roles
      ansible.platform.role_definition:
        name: "{{ item }}"
        content_type: shared.organization
        permissions:
          - shared.view_organization
        state: absent
      when: "item in vars and 'id' in vars[item]"
      loop:
        - "role"

    - name: Delete multi-permission test role
      ansible.platform.role_definition:
        name: "{{ test_role_name }}-multi"
        content_type: eda.project
        permissions:
          - eda.view_project
        state: absent
      register: multi_role_delete
      when: eda_available | default(false)
      failed_when:
        - multi_role_delete.failed
        - "'Not found' not in (multi_role_delete.msg | default(''))"
        - "'does not exist' not in (multi_role_delete.msg | default(''))"
...
