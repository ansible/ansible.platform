---
# Integration tests for ansible.platform.execution_environment

- name: Generate a test ID
  ansible.builtin.set_fact:
    test_id: "{{ lookup('password', '/dev/null chars=ascii_letters length=16') }}"
  when: test_id is not defined

- name: Preset vars
  ansible.builtin.set_fact:
    name_prefix: "AAP-Collection-Test-EE-{{ test_id }}"

- name: Run Test
  module_defaults:
    group/ansible.platform.controller:
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs | bool }}"

  block:
    - name: Delete a non-existent execution environment
      ansible.platform.execution_environment:
        name: "{{ name_prefix }}-Missing"
        state: absent
      register: missing_ee

    - name: Assert deleting a non-existent execution environment does not change anything
      ansible.builtin.assert:
        that:
          - missing_ee is not changed

    - name: Create execution environment
      ansible.platform.execution_environment:
        name: "{{ name_prefix }}-Test"
        image: "quay.io/ansible/awx-ee:latest"
        description: "Integration test EE"
        pull: missing
        state: present
      register: created_ee

    - name: Assert creation changed
      ansible.builtin.assert:
        that:
          - created_ee is changed
          - created_ee.execution_environment.name == (name_prefix ~ '-Test')
          - created_ee.execution_environment.id is defined
          - created_ee.execution_environment.image == 'quay.io/ansible/awx-ee:latest'
          - created_ee.execution_environment.description == 'Integration test EE'
          - created_ee.execution_environment.pull == 'missing'

    - name: Check idempotency
      ansible.platform.execution_environment:
        name: "{{ name_prefix }}-Test"
        image: "quay.io/ansible/awx-ee:latest"
        description: "Integration test EE"
        pull: missing
        state: present
      register: idempotent_ee

    - name: Assert no change on re-apply
      ansible.builtin.assert:
        that:
          - idempotent_ee is not changed

    - name: Update description
      ansible.platform.execution_environment:
        name: "{{ name_prefix }}-Test"
        description: "Updated integration test EE"
        image: "quay.io/ansible/awx-ee:latest"
      register: updated_ee

    - name: Assert update changed
      ansible.builtin.assert:
        that:
          - updated_ee is changed
          - updated_ee.execution_environment.id == created_ee.execution_environment.id
          - updated_ee.execution_environment.description == 'Updated integration test EE'

    - name: Reapply the updated execution environment
      ansible.platform.execution_environment:
        name: "{{ name_prefix }}-Test"
        description: "Updated integration test EE"
        image: "quay.io/ansible/awx-ee:latest"
      register: idempotent_update_ee

    - name: Assert the update is idempotent
      ansible.builtin.assert:
        that:
          - idempotent_update_ee is not changed

    - name: Check exists
      ansible.platform.execution_environment:
        name: "{{ name_prefix }}-Test"
        state: exists
      register: exists_check

    - name: Assert exists
      ansible.builtin.assert:
        that:
          - exists_check.exists
          - exists_check is not changed

    - name: Rename execution environment
      ansible.platform.execution_environment:
        name: "{{ name_prefix }}-Test"
        new_name: "{{ name_prefix }}-Test-Renamed"
      register: renamed_ee

    - name: Assert rename updated the existing execution environment
      ansible.builtin.assert:
        that:
          - renamed_ee is changed
          - renamed_ee.execution_environment.id == created_ee.execution_environment.id
          - renamed_ee.execution_environment.name == (name_prefix ~ '-Test-Renamed')

    - name: Delete execution environment
      ansible.platform.execution_environment:
        name: "{{ renamed_ee.execution_environment.id }}"
        state: absent
      register: deleted_ee

    - name: Assert deleting the execution environment changed it
      ansible.builtin.assert:
        that:
          - deleted_ee is changed

  always:
    - name: Delete execution environment
      ansible.platform.execution_environment:
        name: "{{ created_ee.execution_environment.id }}"
        state: absent
      when: created_ee is defined and created_ee.execution_environment.id is defined
...
