---
# Integration tests for ansible.platform.execution_environment
# Auto-generated by tools/generate_resource.py — review and extend before committing.

- name: Generate a test ID
  ansible.builtin.set_fact:
    test_id: "{{ lookup('password', '/dev/null chars=ascii_letters length=16') }}"
  when: test_id is not defined

- name: Preset vars
  ansible.builtin.set_fact:
    name_prefix: "AAP-Collection-Test-ExecutionEnvironment-{{ test_id }}"

- name: Run Test
  module_defaults:
    group/ansible.platform.gateway:
      gateway_hostname: "{{ gateway_hostname }}"
      gateway_username: "{{ gateway_username }}"
      gateway_password: "{{ gateway_password }}"
      gateway_validate_certs: "{{ gateway_validate_certs | bool }}"

  block:
    - name: Create execution_environment
      ansible.platform.execution_environment:
        name: "{{ name_prefix }}-Test-ExecutionEnvironment"
        image: "example-image"
        state: present
      register: created_execution_environment

    - name: Assert creation changed
      ansible.builtin.assert:
        that:
          - created_execution_environment is changed
          - created_execution_environment.execution_environment.name is defined

    - name: Check idempotency (re-apply, expect no change)
      ansible.platform.execution_environment:
        name: "{{ name_prefix }}-Test-ExecutionEnvironment"
        image: "example-image"
        state: present
      register: idempotent_execution_environment

    - name: Assert no change on re-apply
      ansible.builtin.assert:
        that:
          - idempotent_execution_environment is not changed

    - name: Check exists returns true
      ansible.platform.execution_environment:
        name: "{{ created_execution_environment.execution_environment.name }}"
        state: exists
      register: exists_check

    - name: Assert exists is true
      ansible.builtin.assert:
        that:
          - exists_check.exists

  always:
    - name: Delete execution_environment
      ansible.platform.execution_environment:
        name: "{{ created_execution_environment.execution_environment.name }}"
        state: absent
      when: >-
        created_execution_environment is defined
        and "execution_environment" in created_execution_environment
        and "name" in created_execution_environment.execution_environment
