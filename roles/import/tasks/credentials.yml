---
- name: Create or update credentials
  ansible.platform.controller_credential:
    name: "{{ item.name }}"
    description: "{{ item.description | default(omit) }}"
    credential_type: "{{ item.credential_type }}"
    organization: "{{ item.organization | default(omit) }}"
    inputs: "{{ item.inputs | default(omit) }}"
    state: "{{ import_controller_state }}"
  loop: "{{ _import_controller_assets.credentials }}"
  loop_control:
    label: "{{ item.name }}"
...
