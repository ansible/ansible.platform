---
- name: Create or update credential types
  ansible.platform.controller_credential_type:
    name: "{{ item.name }}"
    description: "{{ item.description | default(omit) }}"
    kind: "{{ item.kind | default(omit) }}"
    inputs: "{{ item.inputs | default(omit) }}"
    injectors: "{{ item.injectors | default(omit) }}"
    state: "{{ import_state }}"
  loop: "{{ _import_assets.credential_types }}"
  loop_control:
    label: "{{ item.name }}"
...
