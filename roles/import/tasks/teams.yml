---
- name: Create or update teams
  ansible.platform.team:
    name: "{{ item.name }}"
    description: "{{ item.description | default(omit) }}"
    organization: "{{ item.organization }}"
    state: "{{ import_state }}"
  loop: "{{ _import_assets.teams }}"
  loop_control:
    label: "{{ item.name }}"
...
