---
bugfixes:
  - process_manager - Fix vault credentials causing subprocess spawn failure when
    ``aap_username``, ``aap_password``, or ``aap_hostname`` are defined as Ansible
    Vault encrypted values. The manager subprocess spawn failed with ``TypeError expected
    str bytes or os.PathLike object not AnsibleVaultEncryptedUnicode`` because vault-encrypted
    values were not converted to ``str()`` before being passed to ``subprocess.Popen``.
    The issue was particularly visible when using token authentication while vaulted
    credentials existed in playbook variables.
