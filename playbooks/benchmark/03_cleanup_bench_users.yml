---
# Step 3: Remove the N benchmark users (cleanup after benchmark).
# Use the same -e ansible_platform_persistent=... as in 02 for consistency.
# Run from collection root:
#   ansible-playbook playbooks/benchmark/03_cleanup_bench_users.yml -e @playbooks/benchmark/vars.yml -e ansible_platform_persistent=false
- name: Delete benchmark users (count {{ benchmark_user_count }})
  hosts: localhost
  connection: ansible.platform.http
  gather_facts: false

  vars:
    # Default for lint/syntax-check; override with -e benchmark_user_count=N or -e @vars.yml
    benchmark_user_count: 100
    gateway_hostname: "{{ base_url }}"
    # Use same auth as 02_create_users (username/password from vars; empty token for benchmark)
    gateway_token: "{{ gateway_token | default('', true) }}"
    ansible_platform_persistent: "{{ (ansible_platform_persistent | default(false) | string | lower) in ['true', 'yes', '1'] }}"

  tasks:
    - name: Show connection mode for this run
      ansible.builtin.debug:
        msg: "Connection mode: {{ 'persistent' if ansible_platform_persistent else 'direct' }} (ansible_platform_persistent={{ ansible_platform_persistent }})"

    - name: Delete benchmark users
      ansible.platform.user:
        gateway_hostname: "{{ base_url }}"
        gateway_token: "{{ gateway_token | default('', true) }}"
        gateway_validate_certs: "{{ gateway_validate_certs | default(false) }}"
        gateway_username: "{{ gateway_username }}"
        gateway_password: "{{ gateway_password | default('', true) }}"
        username: "bench_user_{{ '%03d' | format(item) }}"
        state: absent
      loop: "{{ range(1, (benchmark_user_count | int) + 1) | list }}"
      loop_control:
        label: "bench_user_{{ '%03d' | format(item) }}"
      register: delete_user_result
      failed_when: >
        delete_user_result.failed and
        ('not found' not in (delete_user_result.msg | default('') | lower)
         and '404' not in (delete_user_result.msg | default('')))
...
