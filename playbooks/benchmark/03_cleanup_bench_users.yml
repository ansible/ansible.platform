---
# Step 3: Remove the N benchmark users (cleanup after benchmark).
# Use the same -e ansible_platform_use_persistent_connection=... as in 02 for consistency.
# Run from collection root:
#   ansible-playbook playbooks/benchmark/03_cleanup_bench_users.yml -e @playbooks/benchmark/vars.yml -e ansible_platform_use_persistent_connection=false
- name: Delete benchmark users (count {{ benchmark_user_count }})
  hosts: localhost
  connection: ansible.platform.http
  gather_facts: false

  vars:
    # Default for lint/syntax-check; override with -e benchmark_user_count=N or -e @vars.yml
    benchmark_user_count: 100
    gateway_hostname: "{{ base_url }}"
    # Force username/password auth for benchmark (ignore AAP_TOKEN)
    gateway_token: "<token>"
    ansible_platform_use_persistent_connection: "{{ ansible_platform_use_persistent_connection | default(false) | bool }}"

  tasks:
    - name: Show connection mode for this run
      ansible.builtin.debug:
        msg: >
          Connection mode: {{ 'persistent' if ansible_platform_use_persistent_connection else 'direct' }}
          (ansible_platform_use_persistent_connection={{ ansible_platform_use_persistent_connection }})

    - name: Delete benchmark
      ansible.platform.user:
        gateway_hostname: "{{ base_url }}"
        gateway_token: "token"
        gateway_validate_certs: false
        gateway_username: "admin"
        gateway_password: "Admin!Password!Gw"
        username: "bench_user_{{ '%03d' | format(item) }}"
        state: absent
      loop: "{{ range(1, (benchmark_user_count | int) + 1) | list }}"
      loop_control:
        label: "bench_user_{{ '%03d' | format(item) }}"
      register: delete_user_result
      failed_when: >
        delete_user_result.failed and
        ('not found' not in (delete_user_result.msg | default('') | lower)
         and '404' not in (delete_user_result.msg | default('')))
...
