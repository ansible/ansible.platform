# Example: ansible-playbook -e base_url=https://your-gateway/ ...
---
# REQUIRED: set env BENCHMARK_BASE_URL or pass -e "base_url=https://your-gateway/"
base_url: "{{ lookup('env', 'BENCHMARK_BASE_URL') | default('https://34.238.38.25/', true) }}"
gateway_username: "{{ lookup('env', 'GATEWAY_USERNAME') | default('admin', true) }}"
gateway_password: "{{ lookup('env', 'GATEWAY_PASSWORD') | default('Admin!Password!Gw', true) }}"

gateway_token: ""
gateway_validate_certs: false

# Keep this user when cleaning "all except admin"
keep_username: "admin"

# Number of users for create/delete benchmark (e.g. 100)
benchmark_user_count: 100
...
